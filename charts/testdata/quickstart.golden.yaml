---
# Source: sidekick/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: sidekick
  labels:
    helm.sh/chart: sidekick-0.1.0
    app.kubernetes.io/name: sidekick
    app.kubernetes.io/instance: sidekick
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
data:
  sidekick.yaml: |
    database:
      migrations: startup
      urlSecret:
        key: url
        name: sidekick-postgres
    listeners:
      alerts:
        channel: '#alerts'
        match:
          sender:
            kind: bot
    model:
      connectors:
        claude:
          apiKeySecret:
            key: apiKey
            name: sidekick-anthropic
          model: claude-opus-5-5
          provider: anthropic
      roles:
        investigate: claude
    outputs:
      slack:
        channel: '#alerts'
        type: slack
    routes:
    - name: default
      outputs:
      - slack
      sources:
      - k8s
    secrets:
      dir: /var/run/secrets/sidekick
    server:
      listen: :8080
      metricsListen: :9090
    slack:
      appTokenSecret:
        key: appToken
        name: sidekick-slack
      botTokenSecret:
        key: botToken
        name: sidekick-slack
    sources:
      k8s:
        type: kubernetes

