---
# Source: sidekick/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sidekick
  labels:
    helm.sh/chart: sidekick-0.1.0
    app.kubernetes.io/name: sidekick
    app.kubernetes.io/instance: sidekick
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: server
spec:
  replicas: 1
  # A new pod starts before an old one stops, and an old one hands its jobs
  # back to the queue when it stops, so investigations go on.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sidekick
      app.kubernetes.io/instance: sidekick
      app.kubernetes.io/component: server
  template:
    metadata:
      annotations:
        # A config change rolls the pods.
        checksum/config: f73c1f7b1f2466fbd409dfde99b2263529b63a3ab2de3531b8d9d9d75f546bfd
      labels:
        app.kubernetes.io/name: sidekick
        app.kubernetes.io/instance: sidekick
        app.kubernetes.io/component: server
    spec:
      serviceAccountName: sidekick
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 60
      securityContext:
        fsGroup: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Sidekick exits when the database does not answer at start-up, so
        # with the bundled Postgres it waits for it first.
        - name: wait-for-postgres
          image: docker.io/library/postgres:18.6
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - until pg_isready -h sidekick-postgres -p 5432 -U sidekick; do sleep 2; done
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
      containers:
        - name: sidekick
          image: ghcr.io/nourtalaat/sidekick:0.1.0
          imagePullPolicy: IfNotPresent
          args: [serve, --config, /etc/sidekick/sidekick.yaml]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          env:
            - name: GOMEMLIMIT
              value: "460MiB"
            # sidekick test-alert labels its alert with the pod it runs in.
            - name: POD_NAME
              valueFrom:
                fieldRef: { fieldPath: metadata.name }
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef: { fieldPath: metadata.namespace }
          startupProbe:
            httpGet: { path: /healthz, port: metrics }
            periodSeconds: 5
            failureThreshold: 24
            timeoutSeconds: 2
          livenessProbe:
            httpGet: { path: /healthz, port: metrics }
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 2
          readinessProbe:
            httpGet: { path: /readyz, port: metrics }
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 6
          resources:
            limits:
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: config
              mountPath: /etc/sidekick
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: secret-0
              mountPath: /var/run/secrets/sidekick/sidekick-anthropic
              readOnly: true
            - name: secret-1
              mountPath: /var/run/secrets/sidekick/sidekick-slack
              readOnly: true
            - name: secret-2
              mountPath: /var/run/secrets/sidekick/sidekick-postgres
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: sidekick
        - name: tmp
          emptyDir: {}
        - name: secret-0
          secret:
            secretName: sidekick-anthropic
        - name: secret-1
          secret:
            secretName: sidekick-slack
        - name: secret-2
          secret:
            secretName: sidekick-postgres

---
# Source: sidekick/templates/postgres/statefulset.yaml
# A single Postgres for evaluation only: no replication, backups or
# tuning. Use a managed Postgres in production.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: sidekick-postgres
  labels:
    helm.sh/chart: sidekick-0.1.0
    app.kubernetes.io/name: sidekick
    app.kubernetes.io/instance: sidekick
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: postgres
spec:
  replicas: 1
  serviceName: sidekick-postgres
  selector:
    matchLabels:
      app.kubernetes.io/name: sidekick
      app.kubernetes.io/instance: sidekick
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sidekick
        app.kubernetes.io/instance: sidekick
        app.kubernetes.io/component: postgres
    spec:
      automountServiceAccountToken: false
      # 999 is the postgres user of the official image.
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: postgres
          image: docker.io/library/postgres:18.6
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_USER
              value: "sidekick"
            - name: POSTGRES_DB
              value: "sidekick"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sidekick-postgres
                  key: password
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          readinessProbe:
            exec:
              command: [pg_isready, -h, 127.0.0.1, -U, "sidekick", -d, "sidekick"]
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: [pg_isready, -h, 127.0.0.1, -U, "sidekick", -d, "sidekick"]
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            limits:
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 256Mi
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          volumeMounts:
            # The image keeps its data under /var/lib/postgresql, in a
            # directory named for the major version.
            - name: data
              mountPath: /var/lib/postgresql
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: sidekick
          app.kubernetes.io/instance: sidekick
          app.kubernetes.io/component: postgres
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 2Gi
