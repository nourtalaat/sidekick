---
# Source: sidekick/templates/rbac.yaml
# A service account of the actions. Nothing runs as it:
# Sidekick asks the API server for short-lived tokens of it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sidekick-actions
  labels:
    helm.sh/chart: sidekick-0.2.0
    app.kubernetes.io/name: sidekick
    app.kubernetes.io/instance: sidekick
    app.kubernetes.io/version: "0.2.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: actions
automountServiceAccountToken: false


---
# Source: sidekick/templates/rbac.yaml
# A service account of the actions. Nothing runs as it:
# Sidekick asks the API server for short-lived tokens of it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sidekick-helm-rollback
  labels:
    helm.sh/chart: sidekick-0.2.0
    app.kubernetes.io/name: sidekick
    app.kubernetes.io/instance: sidekick
    app.kubernetes.io/version: "0.2.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: actions
automountServiceAccountToken: false


---
# Source: sidekick/templates/rbac.yaml
# Sidekick's own service account may ask for tokens of the actions' accounts
# and of no other account.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sidekick-sidekick-actions-tokens
  labels:
    helm.sh/chart: sidekick-0.2.0
    app.kubernetes.io/name: sidekick
    app.kubernetes.io/instance: sidekick
    app.kubernetes.io/version: "0.2.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: actions
rules:
  - apiGroups: [""]
    resources: [serviceaccounts/token]
    resourceNames: ["sidekick-actions","sidekick-helm-rollback"]
    verbs: [create]


---
# Source: sidekick/templates/rbac.yaml
# The actions' service account may get and patch the PrometheusRules the
# actions list for this namespace, and nothing else.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sidekick-sidekick-actions-for-sidekick-actions
  namespace: monitoring
  labels:
    helm.sh/chart: sidekick-0.2.0
    app.kubernetes.io/name: sidekick
    app.kubernetes.io/instance: sidekick
    app.kubernetes.io/version: "0.2.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: actions
rules:
  - apiGroups: [monitoring.coreos.com]
    resources: [prometheusrules]
    resourceNames: ["checkout-alerts"]
    verbs: [get, patch]


---
# Source: sidekick/templates/rbac.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sidekick-sidekick-actions-tokens
  labels:
    helm.sh/chart: sidekick-0.2.0
    app.kubernetes.io/name: sidekick
    app.kubernetes.io/instance: sidekick
    app.kubernetes.io/version: "0.2.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: actions
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sidekick-sidekick-actions-tokens
subjects:
  - kind: ServiceAccount
    name: sidekick
    namespace: sidekick


