# Only a Kubernetes source that reads another cluster through a
# kubeconfigSecret: no roles.
secrets:
  - sidekick-anthropic
  - sidekick-slack
  - sidekick-webhook
  - sidekick-staging-cluster
config:
  sources:
    # The quick-start source, pointed at the other cluster too, so no source reads this one.
    k8s:
      kubeconfigSecret: { name: sidekick-staging-cluster, key: kubeconfig }
    staging-cluster:
      type: kubernetes
      kubeconfigSecret: { name: sidekick-staging-cluster, key: kubeconfig }
  routes:
    - name: default
      sources: [staging-cluster]
      outputs: [slack]
