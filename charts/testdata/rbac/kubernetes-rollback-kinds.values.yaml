# A kubernetes.rollback action for StatefulSets only: the Role lists the
# StatefulSets by name and ControllerRevisions, and no ReplicaSets.
validator:
  enabled: false
secrets:
  - sidekick-anthropic
  - sidekick-slack
  - sidekick-webhook
  - sidekick-staging-cluster
config:
  sources:
    # The quick-start source, pointed at another cluster, so no source reads this one.
    k8s:
      kubeconfigSecret: { name: sidekick-staging-cluster, key: kubeconfig }
  actions:
    rb-ledger:
      type: kubernetes.rollback
      limits:
        namespaces: [shop]
        kinds: [StatefulSet]
        names: [ledger]
  routes:
    - name: default
      sources: [k8s]
      outputs: [slack]
      mode: approved
      actions: [rb-ledger]
