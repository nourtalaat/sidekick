  - apiGroups: [apps]
    resources: [daemonsets]
    resourceNames: ["checkout","ledger"]
    verbs: [get, patch]
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: ["cart","checkout","ledger"]
    verbs: [get, patch]
  - apiGroups: [apps]
    resources: [statefulsets]
    resourceNames: ["checkout","ledger"]
    verbs: [get, patch]
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [list]
  - apiGroups: [apps]
    resources: [controllerrevisions]
    verbs: [list]


