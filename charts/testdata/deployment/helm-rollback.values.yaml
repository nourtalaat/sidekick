# A helm.rollback action and no Kubernetes source that reads this cluster:
# the pods mount the service account token anyway, so Sidekick can ask for
# tokens of the actions' service account. It is so with rbac.actions off too.
rbac:
  actions: false
secrets:
  - sidekick-anthropic
  - sidekick-slack
  - sidekick-webhook
  - sidekick-staging-cluster
config:
  sources:
    # The quick-start source, pointed at the other cluster, so no source reads this one.
    k8s:
      kubeconfigSecret: { name: sidekick-staging-cluster, key: kubeconfig }
  actions:
    helm-checkout:
      type: helm.rollback
      limits:
        namespaces: [shop]
        releases: [checkout]
  routes:
    - name: default
      sources: [k8s]
      outputs: [slack]
      mode: approved
      actions: [helm-checkout]
