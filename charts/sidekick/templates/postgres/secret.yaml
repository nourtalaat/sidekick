{{- if .Values.postgres.enabled }}
{{- $password := include "sidekick.postgres.password" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sidekick.postgres.fullname" . }}
  labels:
    {{- include "sidekick.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
  annotations:
    # The data volume outlives an uninstall, and holds this password.
    helm.sh/resource-policy: keep
type: Opaque
data:
  password: {{ $password | b64enc | quote }}
  url: {{ printf "postgres://%s:%s@%s:5432/%s?sslmode=disable" .Values.postgres.user ($password | urlquery) (include "sidekick.postgres.fullname" .) .Values.postgres.database | b64enc | quote }}
{{- end }}
