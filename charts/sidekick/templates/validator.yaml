{{- /*
Job mode of the validator: Sidekick creates one Job per validation, with
the request in a ConfigMap, and reads the result from the termination
message of the Job's pod. The Role allows exactly the calls Sidekick makes,
in the release's namespace only: create, read and delete Jobs; create and
delete ConfigMaps; list pods (to find the Job's pod). It does not poll with
watch, and reads no logs. The Job pods run as their own service account,
which mounts no token, and the NetworkPolicy keeps them off the network.
The Sidekick pods mount their service account token in this mode
(sidekick.automountToken).
*/ -}}
{{- if include "sidekick.validator.job" . }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "sidekick.validator.serviceAccountName" . }}
  labels:
    {{- include "sidekick.labels" . | nindent 4 }}
    app.kubernetes.io/component: validator
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "sidekick.fullname" . }}-validator
  labels:
    {{- include "sidekick.labels" . | nindent 4 }}
    app.kubernetes.io/component: validator
rules:
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [create, get, delete]
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [create, delete]
  - apiGroups: [""]
    resources: [pods]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "sidekick.fullname" . }}-validator
  labels:
    {{- include "sidekick.labels" . | nindent 4 }}
    app.kubernetes.io/component: validator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "sidekick.fullname" . }}-validator
subjects:
  - kind: ServiceAccount
    name: {{ include "sidekick.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- if .Values.networkPolicy.enabled }}
---
# The validation Job pods take no connections, and make none unless
# validator.allowDownloads lets OpenTofu reach registries over HTTPS.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "sidekick.fullname" . }}-validator
  labels:
    {{- include "sidekick.labels" . | nindent 4 }}
    app.kubernetes.io/component: validator
spec:
  podSelector:
    matchLabels:
      {{- include "sidekick.validator.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  {{- if .Values.validator.allowDownloads }}
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - ports:
        - port: 443
          protocol: TCP
  {{- else }}
  egress: []
  {{- end }}
{{- end }}
{{- end }}
