{{- if eq .Values.migrations.mode "job" }}
{{- $dbSecret := dig "database" "urlSecret" "name" "" (default dict .Values.config) }}
# The migration Job runs before the release's own resources exist, so it
# gets a copy of the config as a hook of its own.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sidekick.fullname" . }}-migrate
  labels:
    {{- include "sidekick.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
data:
  sidekick.yaml: |
    {{- include "sidekick.config" . | nindent 4 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "sidekick.fullname" . }}-migrate
  labels:
    {{- include "sidekick.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    # A failed Job is kept until the next install or upgrade, so its logs
    # can be read.
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migrations.job.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migrations.job.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "sidekick.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      {{- with .Values.migrations.job.serviceAccountName }}
      serviceAccountName: {{ . }}
      {{- end }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: migrate
          image: {{ include "sidekick.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: [migrate, up, --config, /etc/sidekick/sidekick.yaml]
          resources:
            {{- toYaml .Values.migrations.job.resources | nindent 12 }}
          securityContext:
            {{- include "sidekick.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/sidekick
              readOnly: true
            - name: tmp
              mountPath: /tmp
            # migrate reads only the database secret.
            - name: database
              mountPath: {{ include "sidekick.secretsDir" . }}/{{ $dbSecret }}
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: {{ include "sidekick.fullname" . }}-migrate
        - name: tmp
          emptyDir: {}
        - name: database
          secret:
            secretName: {{ $dbSecret }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
