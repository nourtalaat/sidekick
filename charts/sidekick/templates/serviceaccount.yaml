{{- $identity := .Values.serviceAccount.workloadIdentity }}
{{- if .Values.serviceAccount.create }}
{{- $annotations := dict }}
{{- with $identity.awsRoleArn }}
{{- $_ := set $annotations "eks.amazonaws.com/role-arn" . }}
{{- end }}
{{- with $identity.gcpServiceAccount }}
{{- $_ := set $annotations "iam.gke.io/gcp-service-account" . }}
{{- end }}
{{- range $key, $value := .Values.serviceAccount.annotations }}
{{- if hasKey $annotations $key }}
{{- fail (printf "serviceAccount.annotations sets %s, which serviceAccount.workloadIdentity already sets; keep only one of them" $key) }}
{{- end }}
{{- $_ := set $annotations $key $value }}
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "sidekick.serviceAccountName" . }}
  labels:
    {{- include "sidekick.labels" . | nindent 4 }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automountToken }}
{{- else if or $identity.awsRoleArn $identity.gcpServiceAccount }}
{{- fail "serviceAccount.workloadIdentity needs serviceAccount.create; with an existing service account, add the annotations to it yourself" }}
{{- end }}
