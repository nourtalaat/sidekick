{{- $access := include "sidekick.kubernetesSource.access" . | fromJson }}
{{- if and .Values.rbac.kubernetesSource $access.any }}
{{- $name := include "sidekick.kubernetesSource.rbacName" . }}
{{- if $access.clusterWide }}
# A Kubernetes source reads every namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $name }}
  labels:
    {{- include "sidekick.labels" . | nindent 4 }}
    app.kubernetes.io/component: kubernetes-source
rules:
  {{- include "sidekick.kubernetesSource.rules" (dict "logs" $access.logs "namespaced" false) | nindent 2 }}
{{- else }}
# The Kubernetes sources read only the namespaces they list, but list_nodes
# reads nodes, which have no namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $name }}-nodes
  labels:
    {{- include "sidekick.labels" . | nindent 4 }}
    app.kubernetes.io/component: kubernetes-source
rules:
  {{- include "sidekick.kubernetesSource.nodeRules" . | nindent 2 }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $name }}{{ if not $access.clusterWide }}-nodes{{ end }}
  labels:
    {{- include "sidekick.labels" . | nindent 4 }}
    app.kubernetes.io/component: kubernetes-source
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $name }}{{ if not $access.clusterWide }}-nodes{{ end }}
subjects:
  {{- include "sidekick.kubernetesSource.subjects" . | nindent 2 }}
{{- if not $access.clusterWide }}
{{- range $namespace, $logs := $access.namespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  namespace: {{ $namespace }}
  labels:
    {{- include "sidekick.labels" $ | nindent 4 }}
    app.kubernetes.io/component: kubernetes-source
rules:
  {{- include "sidekick.kubernetesSource.rules" (dict "logs" $logs "namespaced" true) | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  namespace: {{ $namespace }}
  labels:
    {{- include "sidekick.labels" $ | nindent 4 }}
    app.kubernetes.io/component: kubernetes-source
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  {{- include "sidekick.kubernetesSource.subjects" $ | nindent 2 }}
{{- end }}
{{- end }}
{{- end }}
{{- $actions := include "sidekick.actions.access" . | fromJson }}
{{- if and .Values.rbac.actions $actions.any }}
{{- $accounts := keys $actions.accounts | sortAlpha }}
{{- $everyAccount := include "sidekick.actions.allAccounts" $actions | fromJsonArray }}
{{- range $account := $everyAccount }}
---
# A service account of the actions. Nothing runs as it: Sidekick asks the API
# server for short-lived tokens of it. The chart gives a prometheus.rule
# account its rights, and gives a helm.rollback account none.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $account }}
  labels:
    {{- include "sidekick.labels" $ | nindent 4 }}
    app.kubernetes.io/component: actions
automountServiceAccountToken: false
{{- end }}
---
# Sidekick's own service account may ask for tokens of the actions' accounts
# and of no other account.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "sidekick.actions.rbacName" (dict "context" . "suffix" "tokens") }}
  labels:
    {{- include "sidekick.labels" . | nindent 4 }}
    app.kubernetes.io/component: actions
rules:
  - apiGroups: [""]
    resources: [serviceaccounts/token]
    resourceNames: {{ $everyAccount | toJson }}
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "sidekick.actions.rbacName" (dict "context" . "suffix" "tokens") }}
  labels:
    {{- include "sidekick.labels" . | nindent 4 }}
    app.kubernetes.io/component: actions
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "sidekick.actions.rbacName" (dict "context" . "suffix" "tokens") }}
subjects:
  {{- include "sidekick.kubernetesSource.subjects" . | nindent 2 }}
{{- range $account := $accounts }}
{{- range $namespace, $names := get $actions.accounts $account }}
---
# The actions' service account may get and patch the PrometheusRules the
# actions list for this namespace, and nothing else.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "sidekick.actions.rbacName" (dict "context" $ "suffix" (printf "for-%s" $account)) }}
  namespace: {{ $namespace }}
  labels:
    {{- include "sidekick.labels" $ | nindent 4 }}
    app.kubernetes.io/component: actions
rules:
  - apiGroups: [monitoring.coreos.com]
    resources: [prometheusrules]
    resourceNames: {{ $names | toJson }}
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "sidekick.actions.rbacName" (dict "context" $ "suffix" (printf "for-%s" $account)) }}
  namespace: {{ $namespace }}
  labels:
    {{- include "sidekick.labels" $ | nindent 4 }}
    app.kubernetes.io/component: actions
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "sidekick.actions.rbacName" (dict "context" $ "suffix" (printf "for-%s" $account)) }}
subjects:
  - kind: ServiceAccount
    name: {{ $account }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
{{- end }}
