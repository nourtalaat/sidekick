# An MCP source that asks for OAuth, which MCP sources do not support yet.
database:
  urlSecret: { name: sidekick-db, key: url }

model:
  connectors:
    claude: { provider: anthropic, model: claude-opus-5-5 }
  roles:
    investigate: claude

sources:
  sentry:
    type: mcp
    url: https://mcp.sentry.dev/mcp
    oauth:
      clientId: sidekick
      clientSecret: { name: sentry-oauth, key: clientSecret }

routes:
  - name: default
