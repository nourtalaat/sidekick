# Lesson limits that a prompt cannot use.
database:
  urlSecret: { name: sidekick-db, key: url }

model:
  connectors:
    claude: { provider: anthropic, model: claude-opus-5-5 }
  roles:
    investigate: claude

routes:
  - name: default

lessons:
  maxPerPrompt: 0
  maxTokens: 100
  globalShare: 1.5
