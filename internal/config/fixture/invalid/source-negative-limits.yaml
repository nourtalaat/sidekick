# A source with a negative call timeout and concurrency.
database:
  urlSecret: { name: sidekick-db, key: url }

model:
  connectors:
    claude: { provider: anthropic, model: claude-opus-5-5 }
  roles:
    investigate: claude

sources:
  signoz:
    type: mcp
    url: https://signoz-mcp.internal/mcp
    timeout: -1s
    concurrency: -2

routes:
  - name: default
