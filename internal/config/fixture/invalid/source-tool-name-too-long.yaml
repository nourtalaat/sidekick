# A source tool renamed to a name that, with the source prefix, is over 64 characters.
database:
  urlSecret: { name: sidekick-db, key: url }

model:
  connectors:
    claude: { provider: anthropic, model: claude-opus-5-5 }
  roles:
    investigate: claude

sources:
  signoz:
    type: mcp
    url: https://signoz-mcp.internal/mcp
    tools:
      rename:
        search_logs: search_logs_in_every_index_of_every_cluster_in_the_whole_company

routes:
  - name: default
