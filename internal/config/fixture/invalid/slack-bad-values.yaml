# A trusted bot that is not a bot ID, an API URL without a trailing slash,
# and a follow-up setting that does not exist.
database:
  urlSecret: { name: sidekick-db, key: url }

model:
  connectors:
    claude: { provider: anthropic, model: claude-opus-5-5 }
  roles:
    investigate: claude

routes:
  - name: default

slack:
  botTokenSecret: { name: sidekick-slack, key: botToken }
  trustedBots: [SigNoz]
  apiURL: https://slack.com/api
  followUps: mentions
