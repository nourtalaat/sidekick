# The vectors are longer than pgvector's HNSW index holds.
database:
  urlSecret: { name: sidekick-db, key: url }

model:
  connectors:
    claude: { provider: anthropic, model: claude-opus-5-5 }
  roles:
    investigate: claude

routes:
  - name: default

memory:
  vector:
    enabled: true
    embeddings: { provider: voyage, model: voyage-4, dimensions: 3072 }
