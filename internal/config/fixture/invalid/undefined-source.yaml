# A route that names a source that does not exist.
database:
  urlSecret: { name: sidekick-db, key: url }

model:
  connectors:
    claude: { provider: anthropic, model: claude-opus-5-5 }
  roles:
    investigate: claude

sources:
  signoz: { type: mcp, url: https://signoz-mcp.internal/mcp }

routes:
  - name: default
    sources: [signz]
