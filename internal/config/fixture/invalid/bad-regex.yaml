# A route text match that is not a regular expression.
database:
  urlSecret: { name: sidekick-db, key: url }

model:
  connectors:
    claude: { provider: anthropic, model: claude-opus-5-5 }
  roles:
    investigate: claude

routes:
  - name: latency
    match: { text: "(?i)latency(" }
  - name: default
