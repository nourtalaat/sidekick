# A misspelled built-in redaction rule, and custom rules whose names are a
# built-in rule's name or do not have the shape of a rule name.
database:
  urlSecret: { name: sidekick-db, key: url }

model:
  connectors:
    claude: { provider: anthropic, model: claude-opus-5-5 }
  roles:
    investigate: claude

routes:
  - name: default

redaction:
  builtIn: [emals, cloud_keys, ipaddresses]
  custom:
    - name: emails
      pattern: "[a-z]+@example\\.com"
    - name: Customer ID
      pattern: "cus_[A-Za-z0-9]{14}"
