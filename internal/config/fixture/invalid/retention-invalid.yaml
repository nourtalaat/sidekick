# Retention periods that are not positive, do not parse, or keep steps
# longer than their investigations.
database:
  urlSecret: { name: sidekick-db, key: url }

model:
  connectors:
    claude: { provider: anthropic, model: claude-opus-5-5 }
  roles:
    investigate: claude

routes:
  - name: default

retention:
  events: 0d
  investigations: 30d
  steps: 31d
  auditLog: 90 days
  watcherChecks: 720h
