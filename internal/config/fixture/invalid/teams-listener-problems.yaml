# Teams listeners with a problem in every field that differs from Slack,
# and one with an unknown source.
database:
  urlSecret: { name: sidekick-db, key: url }

model:
  connectors:
    claude: { provider: anthropic, model: claude-opus-5-5 }
  roles:
    investigate: claude

routes:
  - name: default

teams:
  appID: 00000000-1111-2222-3333-444444444444
  tenantID: 55555555-6666-7777-8888-999999999999
  workloadIdentity: true

listeners:
  teams-alerts:
    source: teams
    channel: "#alerts"
    match:
      sender: { kind: bot, bots: [B01ABCDEF], users: [U01ABCDEF] }
    trusted: true
  chat:
    source: team
    channel: "19:abc@thread.tacv2"
  teams-mention:
    source: teams
    channel: "19:abc@thread.tacv2"
