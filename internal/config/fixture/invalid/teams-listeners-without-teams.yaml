# A Teams listener without the teams section.
database:
  urlSecret: { name: sidekick-db, key: url }

model:
  connectors:
    claude: { provider: anthropic, model: claude-opus-5-5 }
  roles:
    investigate: claude

routes:
  - name: default

listeners:
  alerts:
    source: teams
    channel: "19:abc@thread.tacv2"
