# A route match that names Teams mentions without a teams section.
database:
  urlSecret: { name: sidekick-db, key: url }

model:
  connectors:
    claude: { provider: anthropic, model: claude-opus-5-5 }
  roles:
    investigate: claude

routes:
  - name: mentions
    match: { intake: [teams-mention] }
  - name: default
