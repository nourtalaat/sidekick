# Watcher HTTP host patterns and address ranges that do not parse.
database:
  urlSecret: { name: sidekick-db, key: url }

model:
  connectors:
    claude: { provider: anthropic, model: claude-opus-5-5 }
  roles:
    investigate: claude

routes:
  - name: default

watch:
  http:
    allowHosts: ["status.example.com", "https://status.example.com", "*"]
    allowPrivate: ["10.20.0.0/16", "10.20.0.0/33", "internal.example.com"]
