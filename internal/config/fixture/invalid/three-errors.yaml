# Three problems in different sections, all reported.
database:
  urlSecret: { name: sidekick-db, key: url }

model:
  connectors:
    claude: { provider: anthropic, model: claude-opus-5-5 }
  roles:
    investigate: claude

slack:
  botTokenSecret: { name: sidekick-slack, key: botToken }

outputs:
  slack-thread: { type: slack, channel: "#alerts" }

routes:
  - name: default
    mode: read-write
    outputs: [slak-thread]

report:
  minFalsePositiveConfidence: hgh
