# A teams section with a problem in every field.
database:
  urlSecret: { name: sidekick-db, key: url }

model:
  connectors:
    claude: { provider: anthropic, model: claude-opus-5-5 }
  roles:
    investigate: claude

routes:
  - name: default

teams:
  appID: sidekick-bot
  tenantID: contoso.onmicrosoft.com
  clientSecret: { name: sidekick-teams, key: clientSecret }
  workloadIdentity: true
  trustedBots: [Grafana]
  serviceURL: http://smba.trafficmanager.net/teams
