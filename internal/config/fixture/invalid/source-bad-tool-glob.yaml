# A source tool deny pattern that is not a glob.
database:
  urlSecret: { name: sidekick-db, key: url }

model:
  connectors:
    claude: { provider: anthropic, model: claude-opus-5-5 }
  roles:
    investigate: claude

sources:
  signoz:
    type: mcp
    url: https://signoz-mcp.internal/mcp
    tools:
      deny: ["*create*", "*delete["]

routes:
  - name: default
