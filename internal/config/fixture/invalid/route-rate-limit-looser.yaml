# A route rate limit looser than the global one.
database:
  urlSecret: { name: sidekick-db, key: url }

model:
  connectors:
    claude: { provider: anthropic, model: claude-opus-5-5 }
  roles:
    investigate: claude

routes:
  - name: default
    rateLimit: { events: 120, per: 1h }

budgets:
  rateLimit: { events: 10, per: 10m }
