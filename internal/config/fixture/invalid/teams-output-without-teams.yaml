# A Teams output without the teams section, which holds the bot it posts as.
database:
  urlSecret: { name: sidekick-db, key: url }

model:
  connectors:
    claude: { provider: anthropic, model: claude-opus-5-5 }
  roles:
    investigate: claude

outputs:
  teams-thread: { type: teams, channel: "19:alerts@thread.tacv2" }

routes:
  - name: default
    outputs: [teams-thread]
