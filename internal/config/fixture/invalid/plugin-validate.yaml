# A plugin section that fails the plugin's own Validate.
database:
  urlSecret: { name: sidekick-db, key: url }

model:
  connectors:
    claude: { provider: anthropic, model: claude-opus-5-5 }
  roles:
    investigate: claude

slack:
  botTokenSecret: { name: sidekick-slack, key: botToken }

outputs:
  slack-thread: { type: slack }

routes:
  - name: default
    outputs: [slack-thread]
