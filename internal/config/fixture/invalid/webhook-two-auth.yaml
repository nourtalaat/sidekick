# A webhook with both bearer and HMAC authentication.
database:
  urlSecret: { name: sidekick-db, key: url }

model:
  connectors:
    claude: { provider: anthropic, model: claude-opus-5-5 }
  roles:
    investigate: claude

intake:
  webhooks:
    ci:
      adapter: generic
      auth:
        bearer: { name: sidekick-hooks, key: ci }
        hmac: { name: sidekick-hooks, key: ci-hmac }

routes:
  - name: default
