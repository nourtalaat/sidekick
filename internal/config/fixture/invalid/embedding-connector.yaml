# Embedding connectors under model.connectors, which only
# memory.vector.embeddings can use. The first sets dimensions; the second
# is a provider that only embeds.
database:
  urlSecret: { name: sidekick-db, key: url }

model:
  connectors:
    claude: { provider: anthropic, model: claude-opus-5-5 }
    embed-a: { provider: voyage, model: voyage-4, dimensions: 1024 }
    embed-b: { provider: voyage, model: voyage-4 }
  roles:
    investigate: claude

routes:
  - name: default
