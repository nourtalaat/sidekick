# A route concurrency limit above the global one, and a negative one.
database:
  urlSecret: { name: sidekick-db, key: url }

model:
  connectors:
    claude: { provider: anthropic, model: claude-opus-5-5 }
  roles:
    investigate: claude

routes:
  - name: payments
    match: { labels: { team: payments } }
    concurrency: 12
  - name: default
    concurrency: -1
