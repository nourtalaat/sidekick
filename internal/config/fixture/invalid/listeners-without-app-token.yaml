# Listeners in socket mode without the app token, so nothing would arrive.
database:
  urlSecret: { name: sidekick-db, key: url }

model:
  connectors:
    claude: { provider: anthropic, model: claude-opus-5-5 }
  roles:
    investigate: claude

routes:
  - name: default

slack:
  botTokenSecret: { name: sidekick-slack, key: botToken }

listeners:
  alerts:
    channel: "#alerts"
