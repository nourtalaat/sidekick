# Events API mode without the signing secret that checks requests.
database:
  urlSecret: { name: sidekick-db, key: url }

model:
  connectors:
    claude: { provider: anthropic, model: claude-opus-5-5 }
  roles:
    investigate: claude

routes:
  - name: default

slack:
  botTokenSecret: { name: sidekick-slack, key: botToken }
  mode: events
