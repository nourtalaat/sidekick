# The embeddings connector names a provider that cannot embed text.
database:
  urlSecret: { name: sidekick-db, key: url }

model:
  connectors:
    claude: { provider: anthropic, model: claude-opus-5-5 }
  roles:
    investigate: claude

routes:
  - name: default

memory:
  vector:
    enabled: true
    embeddings: { provider: anthropic, model: claude-opus-5-5 }
