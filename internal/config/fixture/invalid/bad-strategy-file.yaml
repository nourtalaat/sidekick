# A strategies dir that holds a strategy file with an unknown key. The
# strategy routes name is not checked when the strategies cannot be loaded.
database:
  urlSecret: { name: sidekick-db, key: url }

model:
  connectors:
    claude: { provider: anthropic, model: claude-opus-5-5 }
  roles:
    investigate: claude

strategies:
  dir: fixture/strategies-invalid

routes:
  - name: default
    strategy: no-such-strategy
