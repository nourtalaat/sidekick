# An approved route that may propose one action, with the settings of the
# actions section.
database:
  urlSecret: { name: sidekick-db, key: url }

model:
  connectors:
    claude: { provider: anthropic, model: claude-opus-5-5 }
  roles:
    investigate: claude

actions:
  proposalTTL: 12h
  maxPerInvestigation: 3
  monitor-note:
    type: note.create
    tokenSecret: { name: notes, key: token }
    limits: { boards: [ops] }

routes:
  - name: default
    mode: approved
    actions: [monitor-note]
