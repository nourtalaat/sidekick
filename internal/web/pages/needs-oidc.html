<h1>The web UI needs an oidc section</h1>
<p>Sidekick serves the web UI only when its config has an <code>oidc</code> section, because the UI signs users in through your OpenID Connect provider.</p>
<p>See <a href="https://github.com/nourtalaat/sidekick/blob/main/docs/web-ui.md">Web UI and API</a> for how to set it up.</p>
