# A service down alert after Flux applied a merged GitLab merge request that
# makes a Deployment read a config map key that does not exist. The right
# answer is a revert of that merge request. The Kubernetes rollback refuses a
# workload that Flux manages, and the GitHub revert is for another host.
# Service down strategy, approved mode, true positive.
id: revert-gitlab-flux-bad-merge-request
title: Quote engine down after Flux applied a merge request that reads a missing config key
tags: [service-down, flux, gitlab, config, deploy, actions, action-choice, true-positive]
strategy: service-down
now: 2026-11-05T14:55:00Z
route:
  mode: approved
  actions: [gitlab-revert, kubernetes-rollback, github-revert]
  details:
    gitops: Workloads in the namespaces pricing and search are deployed by Flux from the GitLab project quillcart/platform/cluster-config, and the Flux objects are in the namespace flux-system.
event:
  adapter: alertmanager
  payload:
    version: "4"
    status: firing
    receiver: sidekick
    groupKey: '{}:{alertname="QuoteEngineDown"}'
    alerts:
      - status: firing
        labels: { alertname: QuoteEngineDown, service: quote-engine, namespace: pricing, env: prod, severity: critical }
        annotations:
          summary: quote-engine has no ready instance
          description: No instance of quote-engine has been ready for 10m.
        startsAt: 2026-11-05T14:41:00Z
        fingerprint: a27e4b90c5d13f68
