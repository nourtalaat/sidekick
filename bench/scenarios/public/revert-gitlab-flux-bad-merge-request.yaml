              quote-engine: waiting, CreateContainerConfigError: couldn't find key QUOTE_DATABASE_URL in ConfigMap pricing/pricing-shared
            pricing/quote-engine-7b9d6c5f48-zk6wm phase Pending on node ip-10-0-3-21, owned by ReplicaSet/quote-engine-7b9d6c5f48, started 2026-11-05T14:30:20Z
              quote-engine: waiting, CreateContainerConfigError: couldn't find key QUOTE_DATABASE_URL in ConfigMap pricing/pricing-shared
      - tool: get_pod_logs
