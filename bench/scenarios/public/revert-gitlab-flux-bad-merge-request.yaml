              quote-engine-7b9d6c5f48-zk6wm Pending, 0/1 ready, 0 restarts, node ip-10-0-3-21, started 2026-11-05T14:30:20Z, revision 9 (ReplicaSet quote-engine-7b9d6c5f48)
