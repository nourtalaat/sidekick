          evidence:
            - { kind: metric, title: quote-engine ready replicas, url: "https://prometheus.quillcart.example/graph?g0.expr=kube_deployment_status_replicas_ready" }
      - tool: list_alerts
        respond:
          text: |
            1 alert firing
            QuoteEngineDown, firing since 2026-11-05T14:41:00Z, labels service=quote-engine namespace=pricing env=prod severity=critical
              summary: quote-engine has no ready instance
            No other alert is firing or pending for quote-engine or its dependencies.
      - tool: get_rules
        respond:
          text: |
            group quote-engine, alert QuoteEngineDown, for 10m
            expr: sum(kube_deployment_status_replicas_ready{namespace="pricing",deployment="quote-engine"}) == 0
            health ok, last evaluation 14:54:50
