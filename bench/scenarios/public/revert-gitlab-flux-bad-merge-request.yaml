actions:
  gitlab-revert:
    spec: { snapshot: bench/actions/gitlab.revert.json }
  kubernetes-rollback:
    spec: { snapshot: bench/actions/kubernetes.rollback.json }
  github-revert:
    spec: { snapshot: bench/actions/github.revert.json }
default: no_data
expected:
  verdict: true_positive
  rootCause:
    summary: Merge request !57 of quillcart/platform/cluster-config, merged at 14:21 and applied by Flux at 14:30, makes the quote-engine Deployment read the key QUOTE_DATABASE_URL of the config map pricing-shared, but the same merge request adds the key as QUOTE_DB_URL. The key is missing, the pods cannot start, and the Recreate strategy had already stopped the old ones, so no instance is ready.
    rubric:
      - { id: key, text: "Finds that the pods cannot start because the Deployment reads the config map key QUOTE_DATABASE_URL, which does not exist (the config map has QUOTE_DB_URL)", weight: 2, required: true }
      - { id: mr, text: "Ties it to merge request !57 of quillcart/platform/cluster-config, applied by Flux at 14:30", weight: 2, required: true }
      - { id: fix, text: "Proposes reverting merge request !57 in GitLab, and not a Kubernetes rollback, which a Flux-managed workload refuses", weight: 1 }
  evidence:
    - { calledTool: gitlab__list_merge_requests }
    - { citedURL: "https://gitlab.example.com/quillcart/platform/cluster-config/-/merge_requests/57" }
  proposals:
    - action: gitlab-revert
      params:
        project: { equals: quillcart/platform/cluster-config }
        baseBranch: { equals: main }
        mergeRequest: { equals: 57 }
limits: { maxToolCalls: 30, maxCostUSD: 0.50 }
