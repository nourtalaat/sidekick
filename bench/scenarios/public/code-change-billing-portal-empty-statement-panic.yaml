          text: |
            quillcart/billing-portal, internal/statement/summary.go, main
            // Package statement builds the monthly statement of an account.
            package statement

            import (
            	"fmt"
            	"sort"
            	"time"
            )

            // Posting is one line of an account's activity.
            type Posting struct {
            	Date        time.Time
            	Description string
            	AmountCents int64
            }

            // Account is what a statement is built from.
            type Account struct {
            	ID       string
            	Name     string
            	Currency string
            	Postings []Posting
            }

            // Summary is the text and the numbers at the top of a statement.
            type Summary struct {
            	AccountID   string
            	Opening     string
            	FirstDate   time.Time
            	TotalCents  int64
            	PostingText []string
            }

            // Summarize totals the postings of an account for the statement.
            func Summarize(a Account) Summary {
            	postings := append([]Posting(nil), a.Postings...)
            	sort.Slice(postings, func(i, j int) bool { return postings[i].Date.Before(postings[j].Date) })

            	s := Summary{AccountID: a.ID, Opening: openingLine(a)}
            	s.FirstDate = firstPostingDate(postings)

            	for _, p := range postings {
            		s.TotalCents += p.AmountCents
            		s.PostingText = append(s.PostingText, fmt.Sprintf("%s %s", p.Date.Format("2006-01-02"), p.Description))
            	}

            	return s
            }

            func openingLine(a Account) string {
            	return fmt.Sprintf("Statement for %s (%s)", a.Name, a.Currency)
            }

            // firstPostingDate returns the date of the earliest posting.
            func firstPostingDate(postings []Posting) time.Time {
            	return postings[0].Date
            }

            // FormatTotal writes an amount in cents as a decimal text.
            func FormatTotal(cents int64, currency string) string {
            	sign := ""
            	if cents < 0 {
            		sign = "-"
            		cents = -cents
            	}

            	return fmt.Sprintf("%s%d.%02d %s", sign, cents/100, cents%100, currency)
            }
          evidence:
            - { kind: resource, title: internal/statement/summary.go, url: "https://github.example.com/quillcart/billing-portal/blob/main/internal/statement/summary.go" }
