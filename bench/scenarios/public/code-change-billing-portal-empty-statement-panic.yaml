# A crash loop with a stack trace that points at one line of application code,
# and no recent deploy to undo: an account with no postings makes a statement
# worker read the first element of an empty list. The right answer is a small
# code change to that file. A revert pull request and a Kubernetes rollback
# are on the route, but nothing recent changed and an older revision has the
# same code.
# Service down strategy, approved mode, true positive.
