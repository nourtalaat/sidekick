# An error rate alert from SigNoz, which Sidekick reaches through its MCP server,
# caused by a rollout that pointed the SMTP password at the wrong secret.
# Error rate strategy, true positive.
id: error-rate-signoz-bad-secret-reference
title: Notify worker error rate after a rollout that moved its SMTP settings to another secret
tags: [error-rate, signoz, mcp, config, deploy, true-positive]
strategy: error-rate-alert
now: 2026-09-16T08:50:00Z
event:
  adapter: signoz
  payload:
    receiver: sidekick
    status: firing
    alerts:
      - status: firing
        labels:
          alertname: Notify worker error ratio
          ruleId: 01929c4e-5b7d-7a01-9f3e-2b6c8d0e4a11
          ruleSource: https://signoz.quillcart.example/alerts/edit?ruleId=01929c4e-5b7d-7a01-9f3e-2b6c8d0e4a11
          service.name: notify-worker
          deployment.environment: prod
          severity: critical
          threshold.name: critical
        annotations:
          summary: notify-worker error ratio is above 5%
          description: 100% of send_email spans of notify-worker failed in the last 15 minutes. The threshold is 5%.
          related_logs: https://signoz.quillcart.example/logs/logs-explorer?service=notify-worker
        startsAt: 2026-09-16T08:36:00Z
        endsAt: "0001-01-01T00:00:00Z"
        generatorURL: https://signoz.quillcart.example/alerts/edit?ruleId=01929c4e-5b7d-7a01-9f3e-2b6c8d0e4a11
        fingerprint: c6f2a0e9815d3b74
    groupLabels: { alertname: Notify worker error ratio }
    commonLabels: { alertname: Notify worker error ratio, deployment.environment: prod }
    commonAnnotations: {}
    externalURL: https://signoz.quillcart.example
    version: "4"
    groupKey: '{}:{alertname="Notify worker error ratio"}'
sources:
  signoz:
    tools: { snapshot: bench/tools/signoz.json }
    fixtures:
      - tool: signoz_search_logs
        respond:
          text: |
            Logs of notify-worker, 08:25 to 08:50, newest first, 3 of 1,912 shown
            08:49:58 ERROR send_email failed: smtp auth: SMTP_PASSWORD is empty (secret notify-mail has no key "password")
            08:49:41 ERROR send_email failed: smtp auth: SMTP_PASSWORD is empty (secret notify-mail has no key "password")
            08:49:30 ERROR send_email failed: smtp auth: SMTP_PASSWORD is empty (secret notify-mail has no key "password")
            First such line: 08:31:09. No such line before 08:31.
          evidence:
            - { kind: log_query, title: notify-worker errors, url: "https://signoz.quillcart.example/logs/logs-explorer?service=notify-worker&severity=ERROR" }
      - tool: signoz_aggregate_logs
        respond:
          text: |
            notify-worker logs by severity, 08:25 to 08:50
            ERROR 1912 (all from 08:31), INFO 164 (all before 08:31), WARN 3
          evidence:
            - { kind: log_query, title: notify-worker log counts, url: "https://signoz.quillcart.example/logs/logs-explorer?service=notify-worker&groupBy=severity_text" }
      - tool: signoz_aggregate_traces
        respond:
          text: |
            notify-worker spans by operation and error, 08:25 to 08:50
            send_email: 1912 errors from 08:31, 0 errors before. receive_job: 0 errors.
          evidence:
            - { kind: trace, title: notify-worker send_email errors, url: "https://signoz.quillcart.example/traces-explorer?service=notify-worker&error=true" }
      - tool: signoz_query_metrics
        respond:
          text: |
            Error ratio of notify-worker, 5 minute points
            08:25 0.00, 08:30 0.00, 08:35 0.61, 08:40 1.00, 08:45 1.00, 08:50 1.00
      - tool: signoz_list_alerts
        respond:
          text: "1 alert firing: Notify worker error ratio (critical, since 08:36). No other alert fires."
  k8s:
    tools: { snapshot: bench/tools/kubernetes.json }
    fixtures:
      - tool: get_rollout_history
        match:
          args:
            name: { regex: "notify-worker" }
        respond:
          text: |
            Deployment notify/notify-worker, newest first
            revision 42, 2026-09-16T08:29:40Z, image quillcart/notify-worker:2026.09.16-3
              changed: env SMTP_PASSWORD now from secret notify-mail, key password (was secret notify-smtp, key password)
            revision 41, 2026-09-15T16:12:05Z, image quillcart/notify-worker:2026.09.15-1
          evidence:
            - { kind: deploy, title: notify-worker revision 42, url: "https://k8s.quillcart.example/notify/deployments/notify-worker/revisions/42" }
      - tool: list_pod_problems
        respond:
          text: "No pods have problems in namespace notify. 3 of 3 pods are ready."
          noData: true
  github:
    tools: { snapshot: bench/tools/github.json }
    fixtures:
      - tool: list_commits
        respond:
          text: |
            5a8d3b0 2026-09-16T08:20:14Z "Move the SMTP settings to the notify-mail secret" by priya
            e19f402 2026-09-15T15:58:37Z "Retry failed sends with a jittered delay" by priya
          evidence:
            - { kind: commit, title: 5a8d3b0, url: "https://github.example.com/quillcart/notify-worker/commit/5a8d3b0" }
default: no_data
expected:
  verdict: true_positive
  rootCause:
    summary: Rollout 42 at 08:29 moved SMTP_PASSWORD to the secret notify-mail, which has no password key, so every email send fails to authenticate.
    rubric:
      - { id: config, text: "Names the empty SMTP password, because the secret notify-mail has no password key, as the cause of the failed sends", weight: 2, required: true }
      - { id: rollout, text: "Links the cause to the 08:29 rollout (revision 42) or commit 5a8d3b0", weight: 2, required: true }
      - { id: fix, text: "Proposes fixing the secret reference or key, or rolling back to revision 41", weight: 1 }
  evidence:
    - { calledTool: signoz__signoz_search_logs }
    - { citedURL: "https://github.example.com/quillcart/notify-worker/commit/5a8d3b0" }
limits: { maxToolCalls: 30, maxCostUSD: 0.50 }
