name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: make ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sidekick
          POSTGRES_PASSWORD: sidekick
          POSTGRES_DB: sidekick_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sidekick -d sidekick_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # The tests of vector memory run against this Postgres, which has the
      # pgvector extension. Every other test uses the plain one above, so the
      # suite keeps proving that Sidekick needs no extension with vector
      # memory off. The image is pinned by digest.
      pgvector:
        image: pgvector/pgvector:pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
        env:
          POSTGRES_USER: sidekick
          POSTGRES_PASSWORD: sidekick
          POSTGRES_DB: sidekick_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U sidekick -d sidekick_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SIDEKICK_TEST_DATABASE_URL: postgres://sidekick:sidekick@localhost:5432/sidekick_test?sslmode=disable
      SIDEKICK_TEST_VECTOR_DATABASE_URL: postgres://sidekick:sidekick@localhost:5433/sidekick_test?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # The newest 1.26 patch release. go.mod names 1.26.0, the oldest
          # Go that builds Sidekick, and go-version-file would install that.
          go-version: "1.26"
          check-latest: true

      # make ci builds and tests the web UI.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Cache tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bin/tools
          key: tools-${{ runner.os }}-${{ hashFiles('Makefile') }}

      - name: Cache the validator tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bin/validator-tools
          key: validator-tools-${{ runner.os }}-${{ hashFiles('scripts/validator-tools.sh') }}

      # The validator tests run promtool, OpenTofu and the provider mirror
      # from here. The tests themselves use no network: OpenTofu installs
      # providers from the mirror only, behind a proxy that refuses every
      # connection.
      - name: Install the validator tools
        run: make validator-tools

      - run: make ci
        env:
          SIDEKICK_PLANS_DIR: ${{ runner.temp }}/query-plans
          SIDEKICK_VALIDATE_TOOLS: ${{ github.workspace }}/bin/validator-tools

      # The plan tests write each query and its EXPLAIN ANALYZE plan here, for
      # pull request descriptions.
      - name: Upload the query plans
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: query-plans
          path: ${{ runner.temp }}/query-plans
          if-no-files-found: warn

      - name: List the query plans in the job summary
        if: always()
        shell: bash
        env:
          PLANS_DIR: ${{ runner.temp }}/query-plans
        run: |
          # The backticks are Markdown, not command substitution.
          # shellcheck disable=SC2016
          {
            echo '### Query plans'
            echo 'Download the `query-plans` artifact of this run for the files.'
            echo '```'
            (cd "$PLANS_DIR" 2>/dev/null && find . -type f -name '*.txt' | sed 's|^\./||' | sort) || echo 'No query plans were written'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  vulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # The newest 1.26 patch release. go.mod names 1.26.0, the oldest
          # Go that builds Sidekick, and go-version-file would install that.
          go-version: "1.26"
          check-latest: true

      - name: Cache tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bin/tools
          key: tools-${{ runner.os }}-${{ hashFiles('Makefile') }}

      - name: Run govulncheck
        shell: bash
        run: |
          set -o pipefail
          make vulncheck 2>&1 | tee "$RUNNER_TEMP/vulncheck.txt"

      - name: Add the govulncheck report to the job summary
        if: always()
        shell: bash
        run: |
          {
            echo '### govulncheck'
            echo '```'
            cat "$RUNNER_TEMP/vulncheck.txt" 2>/dev/null || echo 'govulncheck did not run'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  kind:
    name: chart in kind
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bin/tools
          key: tools-${{ runner.os }}-${{ hashFiles('Makefile') }}

      - name: Build the image
        run: docker build -t sidekick:ci --build-arg VERSION=ci --build-arg COMMIT="$GITHUB_SHA" .

      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          version: v0.33.0
          node_image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
          cluster_name: sidekick

      - name: Load the image into the cluster
        run: kind load docker-image sidekick:ci --name sidekick

      - name: Install the chart and wait until Sidekick is ready
        run: sh scripts/kind-test.sh "$(make -s helm-path)" sidekick ci

      - name: Show the pods, events and logs
        if: failure()
        run: |
          kubectl -n sidekick get pods -o wide || true
          kubectl -n sidekick describe pods || true
          kubectl -n sidekick get events --sort-by=.lastTimestamp || true
          kubectl -n sidekick logs -l app.kubernetes.io/instance=sidekick --all-containers --prefix --tail=200 || true

  validator-image:
    name: validator image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The Go modules linked into the tools are left out of this build's
      # NOTICE; the release build lists them.
      - name: Build the validator image
        run: docker build -f Dockerfile.validator -t sidekick-validator:ci --build-arg VERSION=ci --build-arg COMMIT="$GITHUB_SHA" --build-arg NOTICE_MODULES=false .

      - name: Check each format in the image, with no network
        run: sh scripts/validator-image-test.sh docker sidekick-validator:ci

  dependency-review:
    name: dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
