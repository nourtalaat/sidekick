name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: make ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sidekick
          POSTGRES_PASSWORD: sidekick
          POSTGRES_DB: sidekick_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sidekick -d sidekick_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SIDEKICK_TEST_DATABASE_URL: postgres://sidekick:sidekick@localhost:5432/sidekick_test?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # The newest 1.26 patch release. go.mod names 1.26.0, the oldest
          # Go that builds Sidekick, and go-version-file would install that.
          go-version: "1.26"
          check-latest: true

      - name: Cache tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bin/tools
          key: tools-${{ runner.os }}-${{ hashFiles('Makefile') }}

      - run: make ci
        env:
          SIDEKICK_PLANS_DIR: ${{ runner.temp }}/query-plans

      # The plan tests write each query and its EXPLAIN ANALYZE plan here, for
      # pull request descriptions.
      - name: Upload the query plans
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: query-plans
          path: ${{ runner.temp }}/query-plans
          if-no-files-found: warn

      - name: List the query plans in the job summary
        if: always()
        shell: bash
        env:
          PLANS_DIR: ${{ runner.temp }}/query-plans
        run: |
          {
            echo '### Query plans'
            echo 'Download the `query-plans` artifact of this run for the files.'
            echo '```'
            (cd "$PLANS_DIR" 2>/dev/null && find . -type f -name '*.txt' | sed 's|^\./||' | sort) || echo 'No query plans were written'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  vulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # The newest 1.26 patch release. go.mod names 1.26.0, the oldest
          # Go that builds Sidekick, and go-version-file would install that.
          go-version: "1.26"
          check-latest: true

      - name: Cache tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bin/tools
          key: tools-${{ runner.os }}-${{ hashFiles('Makefile') }}

      - name: Run govulncheck
        shell: bash
        run: |
          set -o pipefail
          make vulncheck 2>&1 | tee "$RUNNER_TEMP/vulncheck.txt"

      - name: Add the govulncheck report to the job summary
        if: always()
        shell: bash
        run: |
          {
            echo '### govulncheck'
            echo '```'
            cat "$RUNNER_TEMP/vulncheck.txt" 2>/dev/null || echo 'govulncheck did not run'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  dependency-review:
    name: dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
