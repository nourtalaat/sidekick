name: SK-87 repeat

# Temporary: runs the integration job of ci.yml alone, once per push to a
# sk87-repeat/* branch. Removed before review.
on:
  push:
    branches:
      - 'sk87-repeat/**'

permissions:
  contents: read

jobs:
  ci:
    name: make ci-${{ matrix.group }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        group: [integration]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sidekick
          POSTGRES_PASSWORD: sidekick
          POSTGRES_DB: sidekick_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sidekick -d sidekick_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # The tests of vector memory run against this Postgres, which has the
      # pgvector extension. Every other test uses the plain one above, so the
      # suite keeps proving that Sidekick needs no extension with vector
      # memory off. The image is pinned by digest.
      pgvector:
        image: pgvector/pgvector:pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
        env:
          POSTGRES_USER: sidekick
          POSTGRES_PASSWORD: sidekick
          POSTGRES_DB: sidekick_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U sidekick -d sidekick_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SIDEKICK_TEST_DATABASE_URL: postgres://sidekick:sidekick@localhost:5432/sidekick_test?sslmode=disable
      SIDEKICK_TEST_VECTOR_DATABASE_URL: postgres://sidekick:sidekick@localhost:5433/sidekick_test?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # The newest 1.26 patch release. go.mod names 1.26.0, the oldest
          # Go that builds Sidekick, and go-version-file would install that.
          go-version: "1.26"
          check-latest: true

      # make ci builds and tests the web UI.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Cache tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bin/tools
          key: tools-${{ runner.os }}-${{ matrix.group }}-${{ hashFiles('Makefile') }}

      - name: Cache the validator tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bin/validator-tools
          key: validator-tools-${{ runner.os }}-${{ hashFiles('scripts/validator-tools.sh') }}

      # The validator tests run promtool, OpenTofu and the provider mirror
      # from here. The tests themselves use no network: OpenTofu installs
      # providers from the mirror only, behind a proxy that refuses every
      # connection.
      - name: Install the validator tools
        run: make validator-tools

      # A service container takes no command line, so max_connections is
      # raised with ALTER SYSTEM and a restart of the container. The tests of
      # the packages that run at the same time came close to the default of
      # 100 connections, and sometimes went over it.
      - name: Raise max_connections of the Postgres service
        if: matrix.group == 'integration'
        shell: bash
        env:
          MAX_CONNECTIONS: "200"
        run: |
          container=$(docker ps --quiet --filter ancestor=postgres:16)
          docker exec "$container" psql -U sidekick -d sidekick_test -c "ALTER SYSTEM SET max_connections = $MAX_CONNECTIONS"
          docker restart "$container"
          until docker exec "$container" pg_isready -U sidekick -d sidekick_test; do sleep 1; done
          docker exec "$container" psql -U sidekick -d sidekick_test -tAc "SHOW max_connections"

      - run: make ci-${{ matrix.group }}
        env:
          SIDEKICK_PLANS_DIR: ${{ runner.temp }}/query-plans
          SIDEKICK_CONNS_LOG: ${{ runner.temp }}/conns.log
          SIDEKICK_VALIDATE_TOOLS: ${{ github.workspace }}/bin/validator-tools

      # The plan tests write each query and its EXPLAIN ANALYZE plan here, for
      # pull request descriptions.
      - name: Upload the query plans
        if: always() && matrix.group == 'integration'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: query-plans
          path: ${{ runner.temp }}/query-plans
          if-no-files-found: warn

      - name: List the connections each package held
        if: always() && matrix.group == 'integration'
        shell: bash
        run: |
          echo 'plain_own plain_total vector_own vector_total package'
          sort -rn "$RUNNER_TEMP/conns.log" || true
          echo "PEAK plain total: $(sort -k2 -rn "$RUNNER_TEMP/conns.log" | head -1 | awk '{print $2}')"

      - name: List the query plans in the job summary
        if: always() && matrix.group == 'integration'
        shell: bash
        env:
          PLANS_DIR: ${{ runner.temp }}/query-plans
        run: |
          # The backticks are Markdown, not command substitution.
          # shellcheck disable=SC2016
          {
            echo '### Query plans'
            echo 'Download the `query-plans` artifact of this run for the files.'
            echo '```'
            (cd "$PLANS_DIR" 2>/dev/null && find . -type f -name '*.txt' | sed 's|^\./||' | sort) || echo 'No query plans were written'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
