name: SK-85 repeat

# Temporary: repeats the Socket Mode tests with the race detector. Removed
# before the pull request is reviewed.

on:
  push:
    branches:
      - fix/SK-85/socket-race
      - fix/SK-85/socket-race-nofix

permissions:
  contents: read

jobs:
  repeat:
    name: TestSocket 50 times with -race
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sidekick
          POSTGRES_PASSWORD: sidekick
          POSTGRES_DB: sidekick_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sidekick -d sidekick_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SIDEKICK_TEST_DATABASE_URL: postgres://sidekick:sidekick@localhost:5432/sidekick_test?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          check-latest: true

      - name: Run the Socket tests 50 times
        run: go test -race -tags integration -count=50 -timeout 35m -run TestSocket ./internal/slackapp
