name: Release

# Runs on a version tag such as v0.1.0. It builds the image for amd64 and
# arm64, pushes it to ghcr.io, signs it with cosign keyless signing through
# GitHub's OIDC token, attaches an SPDX SBOM as a signed attestation, and
# checks both with cosign verify. Then it pushes the Helm chart to
# oci://ghcr.io/nourtalaat/charts and makes the GitHub release with the
# chart and the SBOM attached.

on:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/nourtalaat/sidekick
  CHART_REPOSITORY: oci://ghcr.io/nourtalaat/charts
  # The identity cosign verify expects: this workflow, run for this tag.
  SIGNER: https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}
  OIDC_ISSUER: https://token.actions.githubusercontent.com

jobs:
  image:
    name: build, sign and push the image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      # For cosign keyless signing.
      id-token: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check the tag
        id: version
        run: |
          if ! printf '%s' "$GITHUB_REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::$GITHUB_REF_NAME is not a version tag such as v0.1.0"
            exit 1
          fi
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The Dockerfile cross compiles on the runner's platform and its last
      # stage runs nothing, so no emulation is needed for arm64.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        # Without these the action uploads a .dockerbuild build record as a
        # workflow artifact, which then ended up among the release assets.
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
          DOCKER_BUILD_SUMMARY: false
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
          # The SBOM is made with syft below and attached as a cosign
          # attestation instead.
          sbom: false

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Make the SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          format: spdx-json
          output-file: sidekick-${{ steps.version.outputs.version }}.spdx.json
          syft-version: v1.54.1
          upload-artifact: false
          upload-release-assets: false

      - name: Sign the image and attach the SBOM
        env:
          REF: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          SBOM: sidekick-${{ steps.version.outputs.version }}.spdx.json
        run: |
          cosign sign --yes "$REF"
          cosign attest --yes --type spdxjson --predicate "$SBOM" "$REF"

      - name: Verify the signature and the SBOM attestation
        env:
          REF: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
        run: |
          cosign verify "$REF" \
            --certificate-identity "$SIGNER" --certificate-oidc-issuer "$OIDC_ISSUER" > /dev/null
          cosign verify-attestation "$REF" --type spdxjson \
            --certificate-identity "$SIGNER" --certificate-oidc-issuer "$OIDC_ISSUER" > /dev/null
          echo "Verified the signature and the SBOM attestation of $REF"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sidekick-${{ steps.version.outputs.version }}.spdx.json
          if-no-files-found: error

  chart:
    name: package and push the chart
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Package the chart
        env:
          VERSION: ${{ needs.image.outputs.version }}
        run: |
          helm="$(make -s helm-path)"
          "$helm" lint --strict charts/sidekick -f charts/sidekick/quickstart-values.yaml
          "$helm" package charts/sidekick --version "$VERSION" --app-version "$VERSION" --destination dist

      - name: Push the chart
        env:
          VERSION: ${{ needs.image.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          helm="$(make -s helm-path)"
          printf '%s' "$GITHUB_TOKEN" | "$helm" registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          "$helm" push "dist/sidekick-$VERSION.tgz" "$CHART_REPOSITORY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chart
          path: dist/sidekick-${{ needs.image.outputs.version }}.tgz
          if-no-files-found: error

  release:
    name: make the GitHub release
    needs: [image, chart]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom
          path: assets

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: chart
          path: assets

      - name: Make the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.image.outputs.version }}
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          {
            echo "## Install"
            echo
            echo '```sh'
            echo "helm install sidekick $CHART_REPOSITORY/sidekick --version $VERSION -f quickstart-values.yaml"
            echo '```'
            echo
            echo "Image: \`$IMAGE:$VERSION\` (\`$DIGEST\`), for linux/amd64 and linux/arm64."
            echo
            echo "## Verify the image"
            echo
            echo '```sh'
            echo "cosign verify $IMAGE@$DIGEST \\"
            echo "  --certificate-identity $SIGNER \\"
            echo "  --certificate-oidc-issuer $OIDC_ISSUER"
            echo "cosign verify-attestation $IMAGE@$DIGEST --type spdxjson \\"
            echo "  --certificate-identity $SIGNER \\"
            echo "  --certificate-oidc-issuer $OIDC_ISSUER"
            echo '```'
          } > notes.md
          release_assets=(
            "assets/sidekick-$VERSION.tgz"
            "assets/sidekick-$VERSION.spdx.json"
          )
          echo "Release assets:"
          for asset in "${release_assets[@]}"; do
            if [ ! -f "$asset" ]; then
              echo "::error::$asset is missing"
              exit 1
            fi
            echo "  $asset"
          done
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$GITHUB_REF_NAME" --notes-file notes.md --generate-notes \
            "${release_assets[@]}"
