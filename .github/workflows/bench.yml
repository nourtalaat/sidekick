name: Benchmark

# Runs the public benchmark scenarios against the Anthropic API with the
# project's key. The key is a repository secret, so the workflow never runs
# where secrets are not available or where a stranger could read one:
#
# - A pull request runs it only when a maintainer has put the `bench` label
#   on it, and never for a pull request from a fork. The `pull_request`
#   event gives a fork no secrets anyway; the condition below also stops the
#   run from starting. `pull_request_target` is never used.
# - The job that holds the key can only read the repository. The job that
#   writes the pull request comment has no key, no checkout and no code of
#   the pull request: it only posts a file from the first job's artifact.
#
# docs/benchmark.md describes the workflow, and docs/free-setups.md the free
# setups the project also benchmarks.

on:
  schedule:
    - cron: "17 3 * * *"
  push:
    tags:
      - "v*"
  pull_request:
    types: [labeled, synchronize, reopened]
  workflow_dispatch:
    inputs:
      repeat:
        description: How many times each scenario runs
        required: false
        default: "3"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  bench:
    name: Run the public scenarios
    # A pull request needs the label and must come from this repository. Any
    # other event (the nightly schedule, a release tag, a manual run) runs.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'bench') &&
      (github.event.action != 'labeled' || github.event.label.name == 'bench'))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      ran: ${{ steps.key.outputs.present }}
    steps:
      - name: Check for the model key
        id: key
        env:
          BENCH_ANTHROPIC_API_KEY: ${{ secrets.BENCH_ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$BENCH_ANTHROPIC_API_KEY" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Benchmark skipped::The repository secret BENCH_ANTHROPIC_API_KEY is not set, so the benchmark did not run."
            echo "### Benchmark skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "The repository secret \`BENCH_ANTHROPIC_API_KEY\` is not set, so the benchmark did not run." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.key.outputs.present == 'true'
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.key.outputs.present == 'true'
        with:
          # The newest 1.26 patch release. go.mod names 1.26.0, the oldest
          # Go that builds Sidekick, and go-version-file would install that.
          go-version: "1.26"
          check-latest: true

      - name: Build sidekick
        if: steps.key.outputs.present == 'true'
        run: go build -tags noui -o "$RUNNER_TEMP/sidekick" ./cmd/sidekick

      - name: Run the public scenarios
        if: steps.key.outputs.present == 'true'
        env:
          BENCH_ANTHROPIC_API_KEY: ${{ secrets.BENCH_ANTHROPIC_API_KEY }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REF_NAME: ${{ github.ref_name }}
          REPEAT_INPUT: ${{ github.event.inputs.repeat }}
          RUN_SHA: ${{ github.sha }}
        run: |
          repeat="${REPEAT_INPUT:-3}"
          case "$repeat" in
            [1-9] | [1-9][0-9]) ;;
            *)
              echo "::error::The repeat input must be a number from 1 to 99."
              exit 2
              ;;
          esac

          # The connector reads its key from this file, which the checkout
          # does not hold and git ignores.
          mkdir -p bench/.secrets/anthropic bench-out
          printf '%s' "$BENCH_ANTHROPIC_API_KEY" > bench/.secrets/anthropic/apiKey
          chmod 600 bench/.secrets/anthropic/apiKey

          # With a committed baseline, a run may not fall far below it.
          settings="$RUNNER_TEMP/bench.yaml"
          cp bench/bench.yaml "$settings"
          if [ -f bench/baseline.json ]; then
            printf '  baseline: bench/baseline.json\n  maxDrop: 0.02\n' >> "$settings"
            echo "Comparing with bench/baseline.json."
          else
            echo "bench/baseline.json does not exist yet, so the run is checked against the absolute thresholds only."
          fi

          label="$EVENT_NAME $REF_NAME"
          if [ "$EVENT_NAME" = pull_request ]; then
            label="pull request $PR_NUMBER $(printf '%.7s' "$RUN_SHA")"
          fi

          "$RUNNER_TEMP/sidekick" bench run \
            --scenarios bench/scenarios/public \
            --config bench/sidekick.yaml \
            --bench-config "$settings" \
            --repeat "$repeat" \
            --label "$label" \
            --out bench-out/report.json \
            --junit bench-out/junit.xml \
            --markdown bench-out/summary.md

      - name: Write a summary when the run did not finish
        if: always() && steps.key.outputs.present == 'true'
        run: |
          mkdir -p bench-out
          if [ ! -f bench-out/summary.md ]; then
            echo "The benchmark did not finish. The log of the run shows why." > bench-out/summary.md
          fi
          cat bench-out/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the report and the JUnit file
        if: always() && steps.key.outputs.present == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-report
          path: bench-out
          if-no-files-found: warn

  comment:
    name: Comment on the pull request
    needs: bench
    # Only a pull request that ran. This job has no key and no checkout.
    if: always() && github.event_name == 'pull_request' && needs.bench.outputs.ran == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bench-report
          path: bench-out

      - name: Post the summary as one comment, updated in place
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          marker='<!-- sidekick-benchmark -->'
          {
            echo "$marker"
            cat bench-out/summary.md
            echo
            echo "[Workflow run]($RUN_URL), with report.json and the JUnit file as artifacts."
          } > comment.md

          id=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | awk 'NR == 1')

          if [ -n "$id" ]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$id" --field body=@comment.md > /dev/null
          else
            gh api --method POST "repos/$REPO/issues/$PR_NUMBER/comments" --field body=@comment.md > /dev/null
          fi
