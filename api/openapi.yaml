                $ref: "#/components/schemas/StrategyProposalFeedback"
            gate:
              $ref: "#/components/schemas/StrategyGate"
            stale:
              type: boolean
              description: True when the strategy has changed since the draft.
            approvable:
              type: boolean
              description: True when the proposal has passed its gate and can be approved.
    StrategyProposalFeedback:
      type: object
      required: [id, investigationId, targetKind, targetRef, rating, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        investigationId:
          type: string
          format: uuid
        targetKind:
          type: string
        targetRef:
          type: string
        rating:
          type: string
        reason:
          type: string
        correctVerdict:
          type: string
        correctCause:
          type: string
        updatedAt:
          type: string
          format: date-time
    StrategyGate:
      type: object
      required: [result, reason, mean, interval, maxDrop, resamples, seed, repeats, costMicros, maxCostMicros, scenarios]
      properties:
        result:
          $ref: "#/components/schemas/StrategyGateResult"
        reason:
          type: string
          description: The result in a sentence.
        mean:
