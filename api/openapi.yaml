      properties:
        tokens:
          type: array
          items:
            $ref: "#/components/schemas/Token"
    NewToken:
      type: object
      required: [name, role, expiresAt]
      properties:
        name:
          type: string
          description: What the token is for, 1 to 100 characters.
        role:
          $ref: "#/components/schemas/Role"
        expiresAt:
          type: string
          format: date-time
          description: When the token stops working, at most a year away.
    CreatedToken:
      type: object
      required: [token, secret]
      properties:
        token:
          $ref: "#/components/schemas/Token"
        secret:
          type: string
          description: 'The token, sent as "Authorization: Bearer <secret>". It is shown only here.'
    Verdict:
      type: string
      enum: [true_positive, false_positive, inconclusive, duplicate, known_issue, flapping]
    Confidence:
      type: string
      enum: [low, medium, high]
    InvestigationStatus:
      type: string
      enum: [queued, running, final, failed, cancelled]
    RunKind:
      type: string
      enum: [investigate, follow_up]
      description: 'What the current run does: a full investigation, or the answer to follow-up questions.'
    FeedbackSummary:
      type: object
      required: [correct, wrong, summary]
      description: The ratings responders gave the verdict of the current run.
      properties:
        correct:
          type: integer
        wrong:
          type: integer
        summary:
          type: string
          enum: [correct, wrong, mixed, none]
          description: |
            correct or wrong when every rating says so, mixed when both
            kinds exist, and none when nobody rated.
    FeedbackTargetKind:
      type: string
      enum: [verdict, finding, fix, tool_call]
    FeedbackPartList:
      type: object
      required: [parts]
      properties:
        parts:
          type: array
          items:
            $ref: "#/components/schemas/FeedbackPart"
    FeedbackPart:
      type: object
      required: [targetKind, targetRef, correct, wrong]
      properties:
        targetKind:
          $ref: "#/components/schemas/FeedbackTargetKind"
        targetRef:
          type: string
        correct:
          type: integer
        wrong:
          type: integer
        mine:
          $ref: "#/components/schemas/FeedbackOpinion"
    FeedbackOpinion:
      type: object
      required: [rating]
      description: One person's feedback on a part.
      properties:
        rating:
          $ref: "#/components/schemas/FeedbackRating"
        reason:
          type: string
        correctVerdict:
          $ref: "#/components/schemas/Verdict"
        correctCause:
          type: string
    FeedbackRating:
      type: string
      enum: [correct, wrong]
      x-enum-varnames: [RatingCorrect, RatingWrong]
    NewFeedback:
      type: object
      required: [targetKind, targetRef, rating]
      properties:
        targetKind:
          $ref: "#/components/schemas/FeedbackTargetKind"
        targetRef:
          type: string
          maxLength: 200
          description: |
            `run:N/verdict`, `run:N/finding:ID` or `run:N/fix:ID` for the
            current run N, or the ID of a tool call.
        rating:
          $ref: "#/components/schemas/FeedbackRating"
        reason:
          type: string
          maxLength: 2000
        correctVerdict:
          $ref: "#/components/schemas/Verdict"
        correctCause:
          type: string
          maxLength: 2000
    Feedback:
      type: object
      required: [id, investigationId, targetKind, targetRef, rating, channel, confirmation, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        investigationId:
          type: string
          format: uuid
        targetKind:
          $ref: "#/components/schemas/FeedbackTargetKind"
        targetRef:
          type: string
        rating:
          $ref: "#/components/schemas/FeedbackRating"
        reason:
          type: string
        correctVerdict:
          $ref: "#/components/schemas/Verdict"
        correctCause:
          type: string
        channel:
          type: string
          enum: [ui, slack]
        confirmation:
          type: string
          enum: [unchanged, confirmed, revised, withdrawn]
          description: How this submission changed the confirmed verdict of the investigation.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    WatcherStatus:
      type: string
      enum: [running, recovered, timed_out, stopped]
    WatcherSummary:
      type: object
      required: [name, status]
      description: The newest watcher of the investigation's group.
      properties:
        name:
          type: string
        status:
          $ref: "#/components/schemas/WatcherStatus"
    InvestigationSummary:
      type: object
      required: [id, route, status, createdAt, costMicros, feedback]
      description: |
        One row of the list. The title comes from the alert, so it is text
        a sender wrote: show it as plain text.
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          description: The title of the event that opened the group. Absent when it has none.
        service:
          type: string
        route:
          type: string
        verdict:
          $ref: "#/components/schemas/Verdict"
        confidence:
          $ref: "#/components/schemas/Confidence"
        status:
          $ref: "#/components/schemas/InvestigationStatus"
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        durationMs:
          type: integer
          format: int64
          description: From the start to the end of the run. Absent while it runs.
        costMicros:
          type: integer
          format: int64
          description: The cost so far, in millionths of a US dollar.
        feedback:
          $ref: "#/components/schemas/FeedbackSummary"
        watcher:
          $ref: "#/components/schemas/WatcherSummary"
    InvestigationList:
      type: object
      required: [investigations]
      properties:
        investigations:
          type: array
          items:
            $ref: "#/components/schemas/InvestigationSummary"
        nextCursor:
          type: string
          description: Pass as cursor for the next page. Absent on the last page.
    Investigation:
      type: object
      required:
        - id
        - groupId
        - groupStatus
        - route
        - mode
        - status
        - run
        - runKind
        - inputTokens
        - outputTokens
        - costMicros
        - toolCalls
        - createdAt
        - eventCount
        - events
        - pendingFollowUps
        - proposals
      properties:
        id:
          type: string
          format: uuid
        groupId:
          type: string
          format: uuid
        groupStatus:
          type: string
          enum: [open, closed]
          description: Whether the group of events is still open. Only an open group, or one closed as resolved, can be resolved.
        groupClosedReason:
          type: string
          description: For a closed group, resolved or window_ended.
        title:
          type: string
        service:
          type: string
        route:
          type: string
        strategy:
          type: string
        strategyVersion:
          type: string
        mode:
          type: string
          description: The action mode in effect, such as read-only.
        status:
          $ref: "#/components/schemas/InvestigationStatus"
        run:
          type: integer
          description: The number of the current run; follow-up runs count too.
        runKind:
          $ref: "#/components/schemas/RunKind"
        verdict:
          $ref: "#/components/schemas/Verdict"
        confidence:
          $ref: "#/components/schemas/Confidence"
        stopReason:
          type: string
          description: Why the run ended, such as submitted, budget, cancelled or triage.
        model:
          type: string
          description: The model of the first model turn.
        connector:
          type: string
          description: The model connector the investigation runs on.
        inputTokens:
          type: integer
          format: int64
        outputTokens:
          type: integer
          format: int64
        costMicros:
          type: integer
          format: int64
        toolCalls:
          type: integer
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
        firstFindingAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        durationMs:
          type: integer
          format: int64
        cancelRequestedAt:
          type: string
          format: date-time
          description: When a responder asked to stop the run, while it has not stopped yet.
        confirmation:
          $ref: "#/components/schemas/Confirmation"
        fixAppliedAt:
          type: string
          format: date-time
          description: When a responder marked the fix of a false positive as applied, if one did.
        report:
          $ref: "#/components/schemas/Report"
        eventCount:
          type: integer
          description: How many events the group has, which can be more than events lists.
        events:
          type: array
          description: The first 50 events of the group, oldest first.
          items:
            $ref: "#/components/schemas/Event"
        pendingFollowUps:
          type: array
          description: Follow-up questions that no run has answered yet, oldest first.
          items:
            $ref: "#/components/schemas/PendingFollowUp"
        proposals:
          type: array
          description: The action proposals of the investigation, oldest first.
          items:
            $ref: "#/components/schemas/Proposal"
        lessons:
          type: array
          description: |
            The lessons that the prompt, or the triage, of the investigation
            used, with their text and status as they are now. A lesson that
            was deleted is not listed.
          items:
            $ref: "#/components/schemas/UsedLesson"
    Confirmation:
      type: object
      required: [verdict, at]
      description: The verdict people agree with.
      properties:
        verdict:
          $ref: "#/components/schemas/Verdict"
        cause:
          type: string
        at:
          type: string
          format: date-time
    PendingFollowUp:
      type: object
      required: [text, createdAt]
      properties:
        text:
          type: string
        author:
          type: string
        createdAt:
          type: string
          format: date-time
    Event:
      type: object
      required: [id, kind, intake, labels, links, receivedAt]
      description: |
        An alert or message that joined the group. Its text came from the
        sender, redacted but untrusted: show it as plain text, and open its
        links only as web links.
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [alert, resolved, message, mention]
        intake:
          type: string
          description: The webhook endpoint or Slack listener that took it.
        alertName:
          type: string
        title:
          type: string
        body:
          type: string
          description: The text, cut to 2000 bytes.
        service:
          type: string
        severity:
          type: string
        sender:
          $ref: "#/components/schemas/Sender"
        labels:
          type: object
          additionalProperties:
            type: string
        links:
          type: array
          description: The links the sender attached, with http or https addresses only.
          items:
            $ref: "#/components/schemas/EventLink"
        receivedAt:
          type: string
          format: date-time
    Sender:
      type: object
      properties:
        kind:
          type: string
          enum: [human, bot, system]
        name:
          type: string
    EventLink:
      type: object
      required: [title, url]
      properties:
        title:
          type: string
        url:
          type: string
    Report:
      type: object
      required: [verdict, confidence, reason, summary, findings, checked, stopReason]
      description: |
        The result of the investigation. The model wrote its text from what
        the sources returned, so show it as plain text.
      properties:
        verdict:
          $ref: "#/components/schemas/Verdict"
        confidence:
          $ref: "#/components/schemas/Confidence"
        reason:
          type: string
        summary:
          type: string
        cause:
          type: string
        impact:
          type: string
        findings:
          type: array
          items:
            $ref: "#/components/schemas/Finding"
        fixes:
          type: array
          items:
            $ref: "#/components/schemas/Fix"
        falsePositive:
          $ref: "#/components/schemas/FalsePositiveDetail"
        checked:
          type: array
          description: What was checked in each source.
          items:
            $ref: "#/components/schemas/SourceCheck"
        stopReason:
          type: string
          enum: [submitted, budget, cancelled, triage, error, no_verdict]
        stopDetail:
          type: string
        followUps:
          type: array
          description: The follow-up runs after the first, oldest first.
          items:
            $ref: "#/components/schemas/FollowUp"
    Finding:
      type: object
      required: [id, claim, evidence]
      properties:
        id:
          type: string
        claim:
          type: string
        evidence:
          type: array
          description: Empty for a hypothesis.
          items:
            $ref: "#/components/schemas/Evidence"
    Evidence:
      type: object
      required: [kind, title]
      properties:
        kind:
          type: string
          description: What the link points at, such as log_query, metric or deploy.
        title:
          type: string
        url:
          type: string
          description: A web link. Absent when the source gave none that is an http or https address.
        toolCallId:
          type: string
          description: The tool call whose step produced the evidence.
        at:
          type: string
          format: date-time
    Fix:
      type: object
      required: [id, title, detail]
      properties:
        id:
          type: string
        title:
          type: string
        detail:
          type: string
        actionProposalId:
          type: string
    FalsePositiveDetail:
      type: object
      required: [whyFired, prevention]
      properties:
        whyFired:
          type: string
        prevention:
          type: array
          items:
            $ref: "#/components/schemas/Prevention"
    Prevention:
      type: object
      required: [kind, detail]
      properties:
        kind:
          type: string
        detail:
          type: string
    SourceCheck:
      type: object
      required: [source, status, toolCalls]
      properties:
        source:
          type: string
        status:
          type: string
          enum: [ok, no_data, failed, unavailable]
        toolCalls:
          type: integer
        error:
          type: string
    FollowUp:
      type: object
      required: [run, questions, answer, answered, at]
      properties:
        run:
          type: integer
        questions:
          type: array
          items:
            $ref: "#/components/schemas/FollowUpQuestion"
        answer:
          type: string
          description: The answer, or why there is none when answered is false.
        answered:
          type: boolean
        evidence:
          type: array
          items:
            $ref: "#/components/schemas/Evidence"
        previousVerdict:
          $ref: "#/components/schemas/Verdict"
        at:
          type: string
          format: date-time
    FollowUpQuestion:
      type: object
      required: [text]
      properties:
        author:
          type: string
        text:
          type: string
    StepList:
      type: object
      required: [steps]
      properties:
        steps:
          type: array
          items:
            $ref: "#/components/schemas/Step"
        nextAfter:
          type: integer
          format: int32
          description: The seq to pass as after for the next page. Absent on the last page.
    Step:
      type: object
      required: [seq, run, kind, status, startedAt, durationMs, parts]
      description: |
        One step of the record. A prompt step has only the first message the
        model got. Reasoning is shown when the provider returned it. Parts
        hold text from alerts, sources and the model: show it as plain text.
      properties:
        seq:
          type: integer
          format: int32
        run:
          type: integer
        kind:
          type: string
          enum:
            - prompt
            - model_turn
            - tool_result
            - note
            - inbox
            - summary
            - triage_prompt
            - triage_turn
            - triage_result
            - triage_override
        status:
          type: string
          enum: [ok, no_data, error, timeout, unavailable, rejected, over_budget]
        source:
          type: string
          description: For a tool result, the source that answered. Absent for a built-in tool.
        tool:
          type: string
        callId:
          type: string
          description: For a tool result, the ID of the call it answers.
        error:
          type: string
        connector:
          type: string
        model:
          type: string
        tokens:
          $ref: "#/components/schemas/StepTokens"
        costMicros:
          type: integer
          format: int64
        startedAt:
          type: string
          format: date-time
        durationMs:
          type: integer
          format: int32
        parts:
          type: array
          items:
            $ref: "#/components/schemas/StepPart"
        lessons:
          $ref: "#/components/schemas/StepLessons"
    StepTokens:
      type: object
      required: [input, output]
      properties:
        input:
          type: integer
          format: int64
        output:
          type: integer
          format: int64
        cacheRead:
          type: integer
          format: int64
        cacheWrite:
          type: integer
          format: int64
    StepPart:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [text, tool_call, tool_result, reasoning]
        text:
          type: string
          description: For text and reasoning, cut to 32 KiB.
        id:
          type: string
          description: For a tool call, its ID.
        name:
          type: string
          description: For a tool call, the tool's name.
        input:
          description: For a tool call, the arguments, as JSON.
        callId:
          type: string
          description: For a tool result, the ID of the call it answers.
        content:
          type: string
          description: For a tool result, what the tool returned, redacted and cut to 32 KiB.
        isError:
          type: boolean
        truncated:
          type: boolean
          description: Set when text or content was cut.
    StreamStatus:
      type: object
      required: [status, run, runKind, confirmed, costMicros, inputTokens, outputTokens, toolCalls]
      description: |
        The data of a `status` event of the stream: what changes while the
        investigation runs. When it differs from the page, get the
        investigation again for the report.
      properties:
        status:
          $ref: "#/components/schemas/InvestigationStatus"
        run:
          type: integer
        runKind:
          $ref: "#/components/schemas/RunKind"
        verdict:
          $ref: "#/components/schemas/Verdict"
        confidence:
          $ref: "#/components/schemas/Confidence"
        stopReason:
          type: string
        finishedAt:
          type: string
          format: date-time
        cancelRequestedAt:
          type: string
          format: date-time
        confirmed:
          type: boolean
          description: Whether people confirmed the verdict.
        costMicros:
          type: integer
          format: int64
        inputTokens:
          type: integer
          format: int64
        outputTokens:
          type: integer
          format: int64
        toolCalls:
          type: integer
    FollowUpRequest:
      type: object
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 4000
          description: The question, at most 4000 bytes after trimming.
    FollowUpAccepted:
      type: object
      required: [added]
      properties:
        added:
          type: boolean
    CancelResult:
      type: object
      required: [requested]
      properties:
        requested:
          type: boolean
          description: False when the investigation had ended or a stop was asked for already.
    ResolveResult:
      type: object
      required: [resolved]
      properties:
        resolved:
          type: boolean
          description: False when the group was resolved already.
    StopWatcherResult:
      type: object
      required: [stopped]
      properties:
        stopped:
          type: boolean
          description: False when the watcher had ended already.
    WatcherList:
      type: object
      required: [watchers]
      properties:
        watchers:
          type: array
          items:
            $ref: "#/components/schemas/Watcher"
    Watcher:
      type: object
      required: [id, name, checkType, status, passesInARow, passesToRecover, intervalSeconds, checks, startedAt, recentChecks]
      description: |
        A check that runs on a schedule until the service is back up or its
        time is over. The last result comes from the checked service, so
        show it as plain text.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        checkType:
          type: string
          description: http, tool or alert.
        status:
          $ref: "#/components/schemas/WatcherStatus"
        passesInARow:
          type: integer
        passesToRecover:
          type: integer
        intervalSeconds:
          type: integer
        checks:
          type: integer
          description: How many checks have run.
        lastCheckAt:
          type: string
          format: date-time
        lastResult:
          type: string
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
        stopReason:
          type: string
          description: For a stopped watcher, group_resolved, responder or config_changed.
        stoppedBy:
          $ref: "#/components/schemas/Person"
        recentChecks:
          type: array
          description: Up to the last 50 checks, newest first.
          items:
            $ref: "#/components/schemas/WatcherCheck"
    Person:
      type: object
      description: Someone who acted, by their Slack user ID, or their user ID in the web UI.
      properties:
        slackUserId:
          type: string
        userId:
          type: string
          format: uuid
          description: The web UI user's ID, or the API token's ID.
        name:
          type: string
          description: The web UI user's name, or the API token's name. Show it as plain text.
    WatcherCheck:
      type: object
      required: [seq, at, result, durationMs]
      properties:
        seq:
          type: integer
        at:
          type: string
          format: date-time
        result:
          type: string
          enum: [pass, fail, error]
        detail:
          type: string
        durationMs:
          type: integer
    ScenarioStatus:
      type: string
      enum: [draft, reviewed]
    Scenario:
      type: object
      required: [id, title, status, revision, createdAt, updatedAt]
      properties:
        id:
          type: string
        title:
          type: string
        status:
          $ref: "#/components/schemas/ScenarioStatus"
        revision:
          type: integer
          format: int32
          description: Counts the edits. Review and update send the revision they read.
        investigationId:
          type: string
          format: uuid
          description: The investigation the scenario was exported from, until it is deleted.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        reviewedAt:
          type: string
          format: date-time
        reviewedBy:
          type: string
          description: The name of the user who reviewed it.
    ScenarioList:
      type: object
      required: [scenarios]
      properties:
        scenarios:
          type: array
          items:
            $ref: "#/components/schemas/Scenario"
        nextCursor:
          type: string
          description: Pass it as `cursor` for the next page. Absent on the last page.
    ScenarioDetail:
      type: object
      required: [scenario, body, notes, candidates, pairs]
      properties:
        scenario:
          $ref: "#/components/schemas/Scenario"
        body:
          type: string
          description: The scenario file, as YAML.
        notes:
          type: array
          description: What the exporter skipped, merged or dropped, in words.
          items:
            $ref: "#/components/schemas/ScenarioNote"
        candidates:
          type: array
          description: Places the cleaner kept that look like IDs, for the reviewer to check.
          items:
            $ref: "#/components/schemas/ScenarioCandidate"
        pairs:
          type: array
          description: Each part of the scenario next to the recorded original it was made from.
          items:
            $ref: "#/components/schemas/ScenarioPair"
    ScenarioNote:
      type: object
      required: [kind, text]
      properties:
        kind:
          type: string
        text:
          type: string
    ScenarioCandidate:
      type: object
      required: [path, start, end, reason]
      properties:
        path:
          type: string
          description: The field, for example `sources.signoz.fixtures[0].responses[0].text`.
        start:
          type: integer
          description: Byte offset into the field's text where the value starts.
        end:
          type: integer
        reason:
          type: string
    ScenarioPair:
      type: object
      required: [ref, label, cleaned]
      properties:
        ref:
          type: string
        label:
          type: string
        original:
          type: string
          description: What the investigation recorded, redacted when it was stored. Absent when it is not shown; `note` says why.
        cleaned:
          type: string
        note:
          type: string
    ScenarioUpdate:
      type: object
      required: [revision, body]
      properties:
        revision:
          type: integer
          format: int32
        body:
          type: string
          description: The whole scenario file, as YAML.
    ScenarioReview:
      type: object
      required: [revision, sensitiveDataChecked]
      properties:
        revision:
          type: integer
          format: int32
        sensitiveDataChecked:
          type: boolean
          description: Must be true. The reviewer says they checked the scenario for sensitive data.
    Problem:
      type: object
      description: Problem details, as RFC 9457 describes.
      required: [type, title, status]
      properties:
        type:
          type: string
          description: A URI that names the kind of problem; about:blank when the status says it all.
        title:
          type: string
          description: A short summary of the kind of problem.
        status:
          type: integer
          description: The HTTP status code.
        detail:
          type: string
          description: What went wrong with this request.
        code:
          type: string
          description: |
            Names the kind of problem for a program. Only some answers have
            it: validation (422), file_rule, exists, stale, conflict
            (409) and not_found (404) on listeners and routes; validation
            and unchanged (422), stale and conflict (409) and not_found
            (404) on strategies; not_undoable, not_allowed, undo_running,
            undo_failed and conflict (409) on undoing a proposal.
        errors:
          type: array
          description: The fields of the request that were refused, when code is validation.
          items:
            $ref: "#/components/schemas/FieldError"
        changes:
          type: array
          description: The difference an undo would overwrite, when code is conflict on an undo.
          items:
            $ref: "#/components/schemas/ProposalChange"
        instance:
          type: string
          description: The path of the request.
    FixApplied:
      type: object
      required: [applied, changed]
      properties:
        applied:
          type: boolean
          description: Whether the fix is marked as applied now.
        changed:
          type: boolean
          description: Whether this request changed the mark.
        appliedAt:
          type: string
          format: date-time
          description: When the fix was marked, while it is marked.
    QualityStats:
      type: object
      required: [from, to, totals, previous, days, matrix, perVerdict, comparison]
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        totals:
          $ref: "#/components/schemas/QualityTotals"
        previous:
          allOf:
            - $ref: "#/components/schemas/QualityTotals"
          description: The same totals for the range of equal length that ends the day before `from`.
        days:
          type: array
          items:
            $ref: "#/components/schemas/QualityDay"
        matrix:
          type: array
          description: Each pair of the verdict given and the verdict confirmed that occurs, with its count.
          items:
            $ref: "#/components/schemas/ConfusionCell"
        perVerdict:
          type: array
          description: Precision and recall of each verdict that was given or confirmed in the range.
          items:
            $ref: "#/components/schemas/VerdictScore"
        comparison:
          type: array
          description: Accuracy by model and strategy, for comparing them.
          items:
            $ref: "#/components/schemas/QualityComparison"
    QualityTotals:
      type: object
      required: [rated, correct]
      properties:
        rated:
          type: integer
          format: int64
          description: The investigations people rated.
        correct:
          type: integer
          format: int64
          description: Those whose verdict was confirmed as given.
        accuracy:
          type: number
          format: double
          description: correct over rated, from 0 to 1; left out when nothing was rated.
    QualityDay:
      type: object
      required: [day, rated, correct, scores]
      properties:
        day:
          type: string
          format: date
        rated:
          type: integer
          format: int64
        correct:
          type: integer
          format: int64
        scores:
          type: array
          description: Precision and recall of each verdict that was given or confirmed on the day, worked out from that day's confusion matrix in the same way as `perVerdict` for the range, with the same filters. Verdicts come in the order of a report. Empty when every rating of the day was wrong without a real verdict. A single day has few ratings, so the numbers move a lot.
          items:
            $ref: "#/components/schemas/VerdictScore"
    ConfusionCell:
      type: object
      required: [predicted, confirmed, n]
      properties:
        predicted:
          $ref: "#/components/schemas/Verdict"
        confirmed:
          type: string
          description: The verdict people confirmed, or `unknown` when they rated the verdict wrong without giving the real one.
        n:
          type: integer
          format: int64
    VerdictScore:
      type: object
      required: [verdict, predicted, actual, hits]
      properties:
        verdict:
          $ref: "#/components/schemas/Verdict"
        predicted:
          type: integer
          format: int64
          description: Rated investigations Sidekick gave this verdict, with a known confirmed verdict.
        actual:
          type: integer
          format: int64
          description: Rated investigations people confirmed with this verdict.
        hits:
          type: integer
          format: int64
          description: Those in both groups.
        precision:
          type: number
          format: double
          description: hits over predicted; left out when predicted is 0.
        recall:
          type: number
          format: double
          description: hits over actual; left out when actual is 0.
    QualityComparison:
      type: object
      required: [model, strategy, rated, correct]
      properties:
        model:
          type: string
          description: Empty when the investigation had no model turn.
        strategy:
          type: string
          description: Empty when no strategy was chosen.
        rated:
          type: integer
          format: int64
        correct:
          type: integer
          format: int64
    StatsFilters:
      type: object
      required: [routes, services, models]
      properties:
        routes:
          type: array
          items:
            type: string
        services:
          type: array
          items:
            type: string
        models:
          type: array
          items:
            type: string
    CostStats:
      type: object
      required: [from, to, ignoredFilters, totals, previous, days, dayModels, byModel, byRoute, perInvestigation, previousPerInvestigation, today]
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        ignoredFilters:
          type: array
          description: The filters of the request that the spend cannot be filtered by, service and verdict.
          items:
            type: string
        totals:
          $ref: "#/components/schemas/Spend"
        previous:
          allOf:
            - $ref: "#/components/schemas/Spend"
          description: The same totals for the range of equal length that ends the day before `from`.
        days:
          type: array
          items:
            $ref: "#/components/schemas/SpendDay"
        dayModels:
          type: array
          description: The spend of each day by connector and model, for a chart stacked by model.
          items:
            $ref: "#/components/schemas/SpendDayModel"
        byModel:
          type: array
          items:
            $ref: "#/components/schemas/SpendModel"
        byRoute:
          type: array
          items:
            $ref: "#/components/schemas/SpendRoute"
        perInvestigation:
          type: array
          description: Investigations and what they cost, by the day they were created.
          items:
            $ref: "#/components/schemas/InvestigationCostDay"
        previousPerInvestigation:
          $ref: "#/components/schemas/InvestigationCost"
        today:
          $ref: "#/components/schemas/SpendToday"
    Spend:
      type: object
      required: [costMicros, inputTokens, outputTokens]
      properties:
        costMicros:
          type: integer
          format: int64
          description: Millionths of a US dollar.
        inputTokens:
          type: integer
          format: int64
        outputTokens:
          type: integer
          format: int64
    SpendDay:
      allOf:
        - $ref: "#/components/schemas/Spend"
        - type: object
          required: [day]
          properties:
            day:
              type: string
              format: date
    SpendDayModel:
      allOf:
        - $ref: "#/components/schemas/SpendDay"
        - type: object
          required: [connector, model]
          properties:
            connector:
              type: string
            model:
              type: string
    SpendModel:
      allOf:
        - $ref: "#/components/schemas/Spend"
        - type: object
          required: [connector, model]
          properties:
            connector:
              type: string
            model:
              type: string
    SpendRoute:
      allOf:
        - $ref: "#/components/schemas/Spend"
        - type: object
          required: [route]
          properties:
            route:
              type: string
    InvestigationCost:
      type: object
      required: [investigations, costMicros]
      properties:
        investigations:
          type: integer
          format: int64
        costMicros:
          type: integer
          format: int64
    InvestigationCostDay:
      allOf:
        - $ref: "#/components/schemas/InvestigationCost"
        - type: object
          required: [day]
          properties:
            day:
              type: string
              format: date
    SpendToday:
      type: object
      required: [day, spentMicros, routes]
      properties:
        day:
          type: string
          format: date
          description: Today in the time zone of the daily caps.
        spentMicros:
          type: integer
          format: int64
          description: Spent today by every route together.
        capMicros:
          type: integer
          format: int64
          description: The global daily cap; left out when there is none.
        routes:
          type: array
          items:
            $ref: "#/components/schemas/SpendTodayRoute"
    SpendTodayRoute:
      type: object
      required: [route, spentMicros]
      properties:
        route:
          type: string
        spentMicros:
          type: integer
          format: int64
        capMicros:
          type: integer
          format: int64
          description: The route's daily cap; left out when it has none.
    OperationsStats:
      type: object
      required: [from, to, interval, series, totals, previous, verdicts, previousVerdicts, downtime]
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        interval:
          type: string
          enum: [day, hour]
        series:
          type: array
          description: One entry for each bucket that has investigations, oldest first.
          items:
            $ref: "#/components/schemas/OperationsBucket"
        totals:
          $ref: "#/components/schemas/OperationsTotals"
        previous:
          allOf:
            - $ref: "#/components/schemas/OperationsTotals"
          description: The same totals for the range of equal length that ends the day before `from`.
        verdicts:
          type: array
          description: The investigations of the range by verdict.
          items:
            $ref: "#/components/schemas/VerdictCount"
        previousVerdicts:
          type: array
          description: The same for the range of equal length that ends the day before `from`.
          items:
            $ref: "#/components/schemas/VerdictCount"
        downtime:
          type: array
          description: Recoveries and downtime by route and service.
          items:
            $ref: "#/components/schemas/DowntimeRow"
    OperationsFigures:
      type: object
      required:
        - investigations
        - finished
        - durationN
        - durationMsSum
        - firstFindingN
        - firstFindingMsSum
        - toolCalls
        - noisyFixed
        - actionsProposed
        - actionsApproved
        - actionsExecuted
        - recoveries
        - downtimeMsSum
        - watchTimeouts
      properties:
        investigations:
          type: integer
          format: int64
          description: Investigations created.
        finished:
          type: integer
          format: int64
          description: Those that ended, as final, failed or cancelled.
        durationN:
          type: integer
          format: int64
          description: Those with a duration, which started and ended.
        durationMsSum:
          type: integer
          format: int64
        firstFindingN:
          type: integer
          format: int64
          description: Those with a first finding.
        firstFindingMsSum:
          type: integer
          format: int64
          description: The time from creation to the first finding, added up. Divide by firstFindingN for the mean.
        toolCalls:
          type: integer
          format: int64
        noisyFixed:
          type: integer
          format: int64
          description: False positives whose fix a responder marked as applied.
        actionsProposed:
          type: integer
          format: int64
        actionsApproved:
          type: integer
          format: int64
        actionsExecuted:
          type: integer
          format: int64
        recoveries:
          type: integer
          format: int64
          description: Groups whose watchers all recovered.
        downtimeMsSum:
          type: integer
          format: int64
          description: Their downtime added up.
        watchTimeouts:
          type: integer
          format: int64
          description: Watchers that timed out.
    OperationsBucket:
      allOf:
        - $ref: "#/components/schemas/OperationsFigures"
        - type: object
          required: [bucket, verdicts]
          properties:
            bucket:
              type: string
              format: date-time
              description: The start of the UTC day or hour.
            verdicts:
              type: array
              items:
                $ref: "#/components/schemas/VerdictCount"
    OperationsTotals:
      allOf:
        - $ref: "#/components/schemas/OperationsFigures"
        - type: object
          properties:
            medianFirstFindingMs:
              type: number
              format: double
              description: About the median time from creation to the first finding; left out when there is none.
            medianDowntimeMs:
              type: number
              format: double
              description: About the median downtime of a recovery; left out when there is none.
    VerdictCount:
      type: object
      required: [verdict, investigations]
      properties:
        verdict:
          type: string
          description: A verdict, or `none` for investigations that have not ended with one.
        investigations:
          type: integer
          format: int64
    DowntimeRow:
      type: object
      required: [route, service, recoveries, downtimeMsSum, watchTimeouts]
      properties:
        route:
          type: string
        service:
          type: string
          description: Empty when the investigation had no service.
        recoveries:
          type: integer
          format: int64
        downtimeMsSum:
          type: integer
          format: int64
        watchTimeouts:
          type: integer
          format: int64
        medianDowntimeMs:
          type: number
          format: double
          description: About the median downtime; left out when nothing recovered.
    BenchRunList:
      type: object
      required: [runs]
      properties:
        runs:
          type: array
          items:
            $ref: "#/components/schemas/BenchRunSummary"
        nextCursor:
          type: string
          description: Pass as cursor for the next page. Absent on the last page.
    BenchRunSummary:
      type: object
      required:
        - id
        - startedAt
        - finishedAt
        - sidekickVersion
        - gitSha
        - connectors
        - strategies
        - scenarioSet
        - repeats
        - status
        - triggeredBy
        - metrics
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        sidekickVersion:
          type: string
        gitSha:
          type: string
        connectors:
          type: object
          description: The connector and model of each role.
          additionalProperties:
            $ref: "#/components/schemas/BenchConnector"
        strategies:
          type: object
          description: The version of each strategy the scenarios used, by name.
          additionalProperties:
            type: string
        scenarioSet:
          type: string
        repeats:
          type: integer
        status:
          type: string
          description: passed, or failed when a threshold failed.
        triggeredBy:
          type: string
          description: cli, ci or gate.
        metrics:
          $ref: "#/components/schemas/BenchMetrics"
    BenchConnector:
      type: object
      required: [connector]
      properties:
        connector:
          type: string
        provider:
          type: string
        model:
          type: string
    BenchMetrics:
      type: object
      description: |
        The scores of a run. A share, from 0 to 1, is left out when the run
        had nothing to count.
      required: [runs, toolCalls, inputTokens, outputTokens, costMicros, judgeCostMicros, judgeErrors]
      properties:
        runs:
          type: integer
        overall:
          type: number
          format: double
        verdictAccuracy:
          type: number
          format: double
        fpPrecision:
          type: number
          format: double
        fpRecall:
          type: number
          format: double
        tpPrecision:
          type: number
          format: double
        tpRecall:
          type: number
          format: double
        rootCauseMatch:
          type: number
          format: double
        rootCauseScore:
          type: number
          format: double
        evidence:
          type: number
          format: double
        sourceFailuresReported:
          type: number
          format: double
        meanCostPerRunUsd:
          type: number
          format: double
        meanDurationMs:
          type: number
          format: double
        toolCalls:
          type: integer
        inputTokens:
          type: integer
          format: int64
        outputTokens:
          type: integer
          format: int64
        costMicros:
          type: integer
          format: int64
        judgeCostMicros:
          type: integer
          format: int64
        judgeErrors:
          type: integer
    BenchRun:
      allOf:
        - $ref: "#/components/schemas/BenchRunSummary"
        - type: object
          required: [configHash, promptVersion, judgePromptVersion, intervals, thresholds, results]
          properties:
            configHash:
              type: string
            promptVersion:
              type: string
            judgePromptVersion:
              type: string
            intervals:
              type: object
              description: The confidence interval of each share metric, by the metric's key, such as overall or fpPrecision.
              additionalProperties:
                $ref: "#/components/schemas/BenchInterval"
            thresholds:
              type: array
              items:
                $ref: "#/components/schemas/BenchThreshold"
            results:
              type: array
              items:
                $ref: "#/components/schemas/BenchResult"
    BenchInterval:
      type: object
      required: [lower, upper]
      properties:
        lower:
          type: number
          format: double
        upper:
          type: number
          format: double
    BenchThreshold:
      type: object
      required: [name, limit, passed]
      properties:
        name:
          type: string
        limit:
          type: number
          format: double
        value:
          type: number
          format: double
          description: The run's metric; left out when it had nothing to count.
        passed:
          type: boolean
        detail:
          type: string
    BenchResult:
      type: object
      required: [scenarioId, repeat, expectedVerdict, verdictCorrect, costMicros, durationMs, inputTokens, outputTokens, toolCalls]
      properties:
        scenarioId:
          type: string
        repeat:
          type: integer
          description: 1 for the first run of the scenario, counting up.
        verdict:
          type: string
          description: The verdict the investigation gave; left out when it gave none.
        expectedVerdict:
          type: string
        verdictCorrect:
          type: boolean
        rootCauseScore:
          type: number
          format: double
        requiredMet:
          type: boolean
        evidenceScore:
          type: number
          format: double
        costMicros:
          type: integer
          format: int64
        durationMs:
          type: integer
          format: int64
        inputTokens:
          type: integer
          format: int64
        outputTokens:
          type: integer
          format: int64
        toolCalls:
          type: integer
    BenchComparison:
      type: object
      required: [a, b, metrics, scenarios]
      properties:
        a:
          $ref: "#/components/schemas/BenchRunSummary"
        b:
          $ref: "#/components/schemas/BenchRunSummary"
        metrics:
          type: array
          items:
            $ref: "#/components/schemas/BenchMetricRow"
        scenarios:
          type: array
          description: The scenarios of both runs, by ID.
          items:
            $ref: "#/components/schemas/BenchScenarioRow"
    BenchMetricRow:
      type: object
      required: [key, label, difference]
      properties:
        key:
          type: string
          description: The metric's key as the metrics and intervals of a run name it.
        label:
          type: string
        a:
          type: number
          format: double
        b:
          type: number
          format: double
        change:
          type: number
          format: double
          description: b minus a; left out when either run had nothing to count.
        difference:
          type: string
          description: |
            Whether the confidence intervals of the two runs are apart
            (`clear`) or overlap (`none`). It is `unknown` when a run has no
            interval for the metric, as for the mean cost and time.
    BenchScenarioRow:
      type: object
      required: [scenarioId, expectedVerdict]
      properties:
        scenarioId:
          type: string
        expectedVerdict:
          type: string
        a:
          $ref: "#/components/schemas/BenchScenarioCounts"
        b:
          $ref: "#/components/schemas/BenchScenarioCounts"
    BenchScenarioCounts:
      type: object
      required: [runs, correct]
      properties:
        runs:
          type: integer
        correct:
          type: integer
          description: Runs whose verdict counts as correct.
        rootCauseMean:
          type: number
          format: double
          description: The mean root-cause score of the graded runs; left out when none was graded.
