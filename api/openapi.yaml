openapi: 3.1.0
info:
  title: Sidekick API
  version: v1
  description: |
    The JSON API of Sidekick, which the web UI uses. Every operation needs a
    web UI session or an API token, and names the lowest role that may call
    it in `x-sidekick-role`: viewer, responder, approver or admin. A higher
    role includes every lower one. Errors are problem details (RFC 9457).
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: /api/v1
security:
  - session: []
  - token: []
paths:
  /me:
    get:
      operationId: GetMe
      summary: The signed-in user or API token, and its role
      x-sidekick-role: viewer
      responses:
        "200":
          description: The caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        default:
          $ref: "#/components/responses/Problem"
  /config:
    get:
      operationId: GetConfig
      summary: The effective config, with secrets shown only as references
      description: |
        The config file as Sidekick read it, defaults included, which only
        a config change can alter, and the listeners and routes stored at
        runtime. Secrets appear only as references to a Secret's name and
        key. Strings the redaction rules match are redacted.
      x-sidekick-role: admin
      responses:
        "200":
          description: The effective config.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EffectiveConfig"
        default:
          $ref: "#/components/responses/Problem"
  /jobs:
    get:
      operationId: ListJobs
      summary: Dead jobs, newest first, a page at a time
      x-sidekick-role: admin
      parameters:
        - name: status
          in: query
          description: Only dead jobs are listed.
          schema:
            type: string
            enum: [dead]
            default: dead
        - name: cursor
          in: query
          description: The nextCursor of the page before.
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: A page of dead jobs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobList"
        default:
          $ref: "#/components/responses/Problem"
  /jobs/{id}/retry:
    post:
      operationId: RetryJob
      summary: Retry a dead job
      description: |
        Sets the dead job back to pending with its attempts reset, and
        writes the retry to the audit log.
      x-sidekick-role: admin
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: The job is pending again.
        default:
          $ref: "#/components/responses/Problem"
  /tokens:
    get:
      operationId: ListTokens
      summary: Every API token, revoked and expired ones included, newest first
      x-sidekick-role: admin
      responses:
        "200":
          description: The tokens. The tokens themselves are never shown again.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: CreateToken
      summary: Create an API token
      description: |
        Only a signed-in admin can create a token, never another token. The
        token's role is at most the creator's, and its expiry at most a year
        away. The answer holds the token itself, which is never shown again.
      x-sidekick-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewToken"
      responses:
        "201":
          description: The new token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedToken"
        default:
          $ref: "#/components/responses/Problem"
  /tokens/{id}:
    delete:
      operationId: RevokeToken
      summary: Revoke an API token
      x-sidekick-role: admin
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: The token is revoked.
        default:
          $ref: "#/components/responses/Problem"
  /listeners:
    get:
      operationId: ListListeners
      summary: The listeners, from the config file and from runtime, with their status
      description: |
        Every listener in effect, in name order, then the runtime listeners
        that are stored but not in effect. A listener of the config file is
        read-only. A runtime listener with the name of a file listener is
        shadowed: the file listener is used and the runtime one is shown
        with status shadowed.
      x-sidekick-role: viewer
      responses:
        "200":
          description: The listeners.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListenerList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: CreateListener
      summary: Add a runtime listener
      description: |
        Runs the checks that the config file and the `/sidekick listen`
        command run. A failed check answers 422 with the field of each
        problem. The name of a file listener answers 409. Every replica uses
        the listener within seconds. The change is written to the audit log.
      x-sidekick-role: responder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewListener"
      responses:
        "201":
          description: The new listener.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Listener"
        default:
          $ref: "#/components/responses/Problem"
  /listeners/{name}:
    put:
      operationId: UpdateListener
      summary: Replace a runtime listener
      description: |
        Replaces the listener and turns it on or off. `version` is the
        version that was read; if the listener changed since, the answer is
        409 with code `stale`. A listener of the config file answers 409.
      x-sidekick-role: responder
      parameters:
        - $ref: "#/components/parameters/RuleName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListenerUpdate"
      responses:
        "200":
          description: The listener as saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Listener"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: DeleteListener
      summary: Delete a runtime listener
      description: |
        Deletes the runtime listener. This also deletes a runtime listener
        that a file listener shadows. A file listener that no runtime
        listener shadows answers 409.
      x-sidekick-role: responder
      parameters:
        - $ref: "#/components/parameters/RuleName"
      responses:
        "204":
          description: The listener is deleted.
        default:
          $ref: "#/components/responses/Problem"
  /routes:
    get:
      operationId: ListRoutes
      summary: The routes, from the config file and from runtime, with their status
      description: |
        The routes in effect in the order they are tried, then the runtime
        routes that are stored but not in effect. A route of the config
        file is read-only. A runtime route with the name of a file route is
        shadowed.
      x-sidekick-role: viewer
      responses:
        "200":
          description: The routes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RouteList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: CreateRoute
      summary: Add a runtime route
      description: |
        Runs the checks of the config file and of `/sidekick route set`,
        with the runtime ceilings: only sources, outputs and strategies of
        the config file, and budgets at or below its ceilings. A failed
        check answers 422 with the field of each problem.
      x-sidekick-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewRoute"
      responses:
        "201":
          description: The new route.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Route"
        default:
          $ref: "#/components/responses/Problem"
  /routes/{name}:
    put:
      operationId: UpdateRoute
      summary: Replace a runtime route
      description: |
        Replaces the route and turns it on or off. `version` is the version
        that was read; if the route changed since, the answer is 409 with
        code `stale`. A route of the config file answers 409.
      x-sidekick-role: admin
      parameters:
        - $ref: "#/components/parameters/RuleName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RouteUpdate"
      responses:
        "200":
          description: The route as saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Route"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: DeleteRoute
      summary: Delete a runtime route
      description: |
        Deletes the runtime route. This also deletes a runtime route that a
        file route shadows. A file route that no runtime route shadows
        answers 409.
      x-sidekick-role: admin
      parameters:
        - $ref: "#/components/parameters/RuleName"
      responses:
        "204":
          description: The route is deleted.
        default:
          $ref: "#/components/responses/Problem"
  /audit:
    get:
      operationId: ListAudit
      summary: The audit log, newest first, a page at a time
      description: |
        Every proposal, approval, investigation, feedback, rule change, login
        and role change, with who made it and, for a change, the old and new
        values. Rows are never changed. The filters must all match. Values
        that a redaction rule matches are redacted.
      x-sidekick-role: admin
      parameters:
        - name: from
          in: query
          description: Only entries made at or after this time.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: Only entries made before this time.
          schema:
            type: string
            format: date-time
        - name: actor
          in: query
          description: |
            The ID of the user, API token or Slack user that made the change.
            sidekick, policy and system select the entries Sidekick made on
            its own.
          schema:
            type: string
        - name: action
          in: query
          description: The action, such as route.updated or job.retried.
          schema:
            type: string
        - name: investigation
          in: query
          description: Only entries of this investigation.
          schema:
            type: string
            format: uuid
        - name: cursor
          in: query
          description: The nextCursor of the page before.
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: A page of audit entries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditList"
        default:
          $ref: "#/components/responses/Problem"
  /investigations:
    get:
      operationId: ListInvestigations
      summary: Investigations, newest first, a page at a time
      description: |
        Every filter that is given must match. The investigations are
        ordered by the time they were created, newest first, and a page
        starts after the investigation the cursor names. Investigations
        from before the list's service, model and title columns existed are
        filled in the background when Sidekick starts; until that has
        finished they do not match the service, model and q filters.
      x-sidekick-role: viewer
      parameters:
        - name: from
          in: query
          description: Only investigations created at or after this time.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: Only investigations created before this time.
          schema:
            type: string
            format: date-time
        - name: route
          in: query
          schema:
            type: string
        - name: service
          in: query
          schema:
            type: string
        - name: model
          in: query
          description: The model of the investigation's first model turn.
          schema:
            type: string
        - name: verdict
          in: query
          schema:
            $ref: "#/components/schemas/Verdict"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/InvestigationStatus"
        - name: q
          in: query
          description: |
            Words of the alert title. Every word must be in it; quotes match
            a phrase, and a minus sign leaves a word out.
          schema:
            type: string
            maxLength: 200
        - name: cursor
          in: query
          description: The nextCursor of the page before.
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: A page of investigations.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvestigationList"
        default:
          $ref: "#/components/responses/Problem"
  /investigations/{id}:
    get:
      operationId: GetInvestigation
      summary: One investigation, with its report and the events of its group
      x-sidekick-role: viewer
      parameters:
        - $ref: "#/components/parameters/InvestigationID"
      responses:
        "200":
          description: The investigation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Investigation"
        default:
          $ref: "#/components/responses/Problem"
  /investigations/{id}/steps:
    get:
      operationId: ListInvestigationSteps
      summary: The steps of an investigation, in order, a page at a time
      description: |
        The record of the run: the prompt, each model turn, each tool call
        and its result, as the model saw them. Tool results are redacted
        already. Steps the retention job deleted are missing from the
        list.
      x-sidekick-role: viewer
      parameters:
        - $ref: "#/components/parameters/InvestigationID"
        - name: run
          in: query
          description: Only the steps of this run.
          schema:
            type: integer
            minimum: 1
        - name: after
          in: query
          description: Only the steps with a seq above this one; the nextAfter of the page before.
          schema:
            type: integer
            format: int32
            minimum: -1
            default: -1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        "200":
          description: A page of steps.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StepList"
        default:
          $ref: "#/components/responses/Problem"
  /investigations/{id}/watchers:
    get:
      operationId: ListInvestigationWatchers
      summary: The watchers of the investigation's group, with their last checks
      x-sidekick-role: viewer
      parameters:
        - $ref: "#/components/parameters/InvestigationID"
      responses:
        "200":
          description: The watchers, oldest first, each with up to its last 50 checks, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WatcherList"
        default:
          $ref: "#/components/responses/Problem"
  /investigations/{id}/feedback:
    post:
      operationId: CreateInvestigationFeedback
      summary: Say that one part of an investigation is correct or wrong
      description: |
        Feedback on the verdict, a finding, a fix or a tool call, with an
        optional reason and, when the caller knows it, the real verdict and
        cause. A signed-in user has one opinion per part: a new submission
        replaces the user's earlier one. A real verdict confirms the
        investigation, whichever part the feedback is about, and a
        confirmation that changes is written to the audit log. Rating the
        verdict Correct confirms it too; rating it Wrong takes back a
        confirmation of that verdict.

        The target is checked against the current report and steps. The
        ref of the verdict is `run:N/verdict`, of a finding
        `run:N/finding:ID`, of a fix `run:N/fix:ID`, where N is the
        investigation's current run; the ref of a tool call is its call ID.
        A ref that is not there answers 422, so a page that shows an older
        run learns that its report is gone. A verdict, finding or fix needs
        an investigation that has a verdict (409 otherwise); a tool call can
        be rated while the investigation runs. API tokens are refused with
        403, since feedback is given by a person.
      x-sidekick-role: responder
      parameters:
        - $ref: "#/components/parameters/InvestigationID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewFeedback"
      responses:
        "201":
          description: The stored feedback.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Feedback"
        default:
          $ref: "#/components/responses/Problem"
  /investigations/{id}/stream:
    get:
      operationId: StreamInvestigation
      summary: A stream of server-sent events about one investigation
      description: |
        Server-sent events (text/event-stream) while the investigation
        changes. Any replica serves the stream, not only the one that runs
        the investigation. The events are:

        - `step`, with the seq as its id and a Step as its data, for each
          step saved after the one the client has.
        - `status`, with no id and a StreamStatus as its data, once when
          the stream starts and again whenever the status, the run, the
          stop request or the confirmed verdict changes.
        - `watchers`, with `{}` as its data, when a watcher of the
          investigation started, ran a check or ended; get the watchers
          again.

        A comment line every 15 seconds keeps the connection open. The
        stream ends after 30 minutes, and the browser's EventSource then
        reconnects with the Last-Event-ID header, which resumes after that
        step. A client that connects the first time can pass `after`, the
        last seq it has, instead. At most 100 streams are open on a
        replica; above that the answer is 429.
      x-sidekick-role: viewer
      parameters:
        - $ref: "#/components/parameters/InvestigationID"
        - name: after
          in: query
          description: The last seq the client has. Last-Event-ID wins when both are given.
          schema:
            type: integer
            format: int32
            minimum: -1
        - name: Last-Event-ID
          in: header
          description: The seq of the last step the client received, sent by EventSource when it reconnects.
          schema:
            type: string
      responses:
        "200":
          description: The event stream.
          content:
            text/event-stream:
              schema:
                type: string
        default:
          $ref: "#/components/responses/Problem"
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: __Host-sidekick_session
      description: |
        The web UI session, set by /auth/callback. Requests that change
        anything also need the session's CSRF token in the X-CSRF-Token
        header.
    token:
      type: http
      scheme: bearer
      description: An API token an admin created.
  parameters:
    RuleName:
      name: name
      in: path
      required: true
      description: The name of a listener or route.
      schema:
        type: string
    InvestigationID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Problem:
      description: An error, as problem details.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Role:
      type: string
      enum: [viewer, responder, approver, admin]
    Me:
      type: object
      required: [kind, id, name, role]
      properties:
        kind:
          type: string
          enum: [user, token]
          description: Whether the caller is a signed-in user or an API token.
        id:
          type: string
          description: The user's or the token's ID.
        name:
          type: string
          description: The user's name, or the token's name.
        email:
          type: string
          description: The user's email, when the identity provider sent a verified one.
        role:
          $ref: "#/components/schemas/Role"
        csrfToken:
          type: string
          description: |
            The session's CSRF token. Requests made with the session that
            change anything send it in the X-CSRF-Token header. Absent for
            an API token.
    EffectiveConfig:
      type: object
      required: [file, runtime]
      properties:
        file:
          type: object
          additionalProperties: true
          description: sidekick.yaml with its defaults, by YAML key. Read-only.
        runtime:
          $ref: "#/components/schemas/RuntimeRules"
    RuntimeRules:
      type: object
      required: [listeners, routes]
      properties:
        listeners:
          type: array
          items:
            $ref: "#/components/schemas/RuntimeRule"
        routes:
          type: array
          items:
            $ref: "#/components/schemas/RuntimeRule"
    RuntimeRule:
      type: object
      required: [name, enabled, version, updatedBy, updatedAt, config]
      properties:
        name:
          type: string
        enabled:
          type: boolean
        version:
          type: integer
        updatedBy:
          type: string
        updatedAt:
          type: string
          format: date-time
        config:
          type: object
          additionalProperties: true
          description: The rule, with the keys a listener or route has in sidekick.yaml.
    RuleLayer:
      type: string
      enum: [file, runtime]
      description: Where the rule is defined. A rule of the file layer is read-only.
    RuleStatus:
      type: string
      enum: [active, shadowed, invalid, disabled]
      description: |
        active: in effect. shadowed: a rule of the config file has the same
        name and is used instead. invalid: it no longer passes the config
        checks. disabled: turned off.
    ListenerSender:
      type: object
      properties:
        kind:
          type: string
          description: human or bot; empty matches both.
        names:
          type: array
          items:
            type: string
        bots:
          type: array
          items:
            type: string
        users:
          type: array
          items:
            type: string
    ListenerMatch:
      type: object
      properties:
        sender:
          $ref: "#/components/schemas/ListenerSender"
        text:
          type: string
          description: A regular expression over the message text.
    ListenerSpec:
      type: object
      required: [channel]
      description: The parts of a listener that a person sets, with the keys they have in sidekick.yaml.
      properties:
        source:
          type: string
          description: The chat app, slack or teams. Empty means slack.
        channel:
          type: string
          description: A channel name such as "#alerts" or a channel ID.
        match:
          $ref: "#/components/schemas/ListenerMatch"
        extract:
          type: array
          items:
            type: string
          description: Regular expressions with named groups that set the alert's fields.
        recovery:
          type: string
          description: A regular expression. A message it matches is a recovery.
    NewListener:
      allOf:
        - type: object
          required: [name]
          properties:
            name:
              type: string
        - $ref: "#/components/schemas/ListenerSpec"
    ListenerUpdate:
      allOf:
        - $ref: "#/components/schemas/ListenerSpec"
        - type: object
          required: [enabled, version]
          properties:
            enabled:
              type: boolean
            version:
              type: integer
              description: The version of the listener that was read.
    Listener:
      allOf:
        - $ref: "#/components/schemas/ListenerSpec"
        - type: object
          required: [name, layer, status, readOnly, enabled, trusted]
          properties:
            name:
              type: string
            layer:
              $ref: "#/components/schemas/RuleLayer"
            status:
              $ref: "#/components/schemas/RuleStatus"
            statusReason:
              type: string
              description: Why the rule is not active.
            readOnly:
              type: boolean
              description: True for a listener of the config file.
            enabled:
              type: boolean
            trusted:
              type: boolean
              description: Whether its senders are trusted. Runtime listeners are never trusted.
            version:
              type: integer
              description: The version of a runtime listener; it grows with every change.
            updatedBy:
              type: string
            updatedAt:
              type: string
              format: date-time
    ListenerList:
      type: object
      required: [listeners]
      properties:
        listeners:
          type: array
          items:
            $ref: "#/components/schemas/Listener"
    RouteMatch:
      type: object
      properties:
        intake:
          type: array
          items:
            type: string
          description: Names of webhook endpoints and listeners.
        labels:
          type: object
          additionalProperties:
            type: string
        service:
          type: string
          description: A glob.
        severity:
          type: array
          items:
            type: string
          description: unknown, info, warning or critical.
        text:
          type: string
          description: A regular expression over the event text.
    RouteBudgets:
      type: object
      description: Limits of one investigation. Zero or empty uses the global value.
      properties:
        maxTokens:
          type: integer
        maxToolCalls:
          type: integer
        maxWallTime:
          type: string
          description: A duration such as 5m.
        maxCostUSD:
          type: number
          format: double
    RouteGrouping:
      type: object
      properties:
        window:
          type: string
          description: A duration such as 30m.
        fingerprintLabels:
          type: array
          items:
            type: string
        relatedWindow:
          type: string
          description: A duration such as 15m. Empty turns it off.
    RouteMode:
      type: string
      enum: [read-only]
      description: The action mode. Only read-only exists until action modes arrive.
    RouteSpec:
      type: object
      description: The parts of a route that a person sets, with the keys they have in sidekick.yaml.
      properties:
        priority:
          type: integer
          description: Lower is tried first. Defaults to 100.
        match:
          $ref: "#/components/schemas/RouteMatch"
        strategy:
          type: string
        sources:
          type: array
          items:
            type: string
        outputs:
          type: array
          items:
            type: string
        mode:
          $ref: "#/components/schemas/RouteMode"
        budgets:
          $ref: "#/components/schemas/RouteBudgets"
        grouping:
          $ref: "#/components/schemas/RouteGrouping"
    NewRoute:
      allOf:
        - type: object
          required: [name]
          properties:
            name:
              type: string
        - $ref: "#/components/schemas/RouteSpec"
    RouteUpdate:
      allOf:
        - $ref: "#/components/schemas/RouteSpec"
        - type: object
          required: [enabled, version]
          properties:
            enabled:
              type: boolean
            version:
              type: integer
              description: The version of the route that was read.
    Route:
      allOf:
        - $ref: "#/components/schemas/RouteSpec"
        - type: object
          required: [name, layer, status, readOnly, enabled]
          properties:
            name:
              type: string
            layer:
              $ref: "#/components/schemas/RuleLayer"
            status:
              $ref: "#/components/schemas/RuleStatus"
            statusReason:
              type: string
              description: Why the rule is not active.
            readOnly:
              type: boolean
              description: True for a route of the config file.
            enabled:
              type: boolean
            position:
              type: integer
              description: The place of a route in effect in the order routes are tried, from 1.
            version:
              type: integer
              description: The version of a runtime route; it grows with every change.
            updatedBy:
              type: string
            updatedAt:
              type: string
              format: date-time
    RouteList:
      type: object
      required: [routes]
      properties:
        routes:
          type: array
          items:
            $ref: "#/components/schemas/Route"
    FieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
          description: |
            The path of the field in the request body, such as
            budgets.maxTokens or match.sender.bots[0]. Empty for a problem
            with the whole body.
        message:
          type: string
    AuditEntry:
      type: object
      required: [id, at, actorKind, action]
      properties:
        id:
          type: integer
          format: int64
        at:
          type: string
          format: date-time
        actorKind:
          type: string
          enum: [user, token, sidekick, policy, system]
        actorId:
          type: string
          description: A user ID, an API token ID or a Slack user ID. Absent for sidekick, policy and system.
        actorName:
          type: string
          description: The name of the user or token, when it is still known.
        action:
          type: string
          description: What happened, such as route.updated.
        targetKind:
          type: string
        targetId:
          type: string
        investigationId:
          type: string
          format: uuid
        old:
          description: The value before the change, of any JSON type. Absent when there was none.
        new:
          description: The value after the change, of any JSON type. Absent when there was none.
    AuditList:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/AuditEntry"
        nextCursor:
          type: string
          description: Pass it as cursor to get the next page. Absent on the last page.
    Job:
      type: object
      required: [id, kind, attempts, maxAttempts, createdAt]
      properties:
        id:
          type: integer
          format: int64
        kind:
          type: string
          description: The kind of job, such as investigate or publish.
        route:
          type: string
        attempts:
          type: integer
        maxAttempts:
          type: integer
        lastError:
          type: string
          description: Why the last attempt failed, redacted.
        createdAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
          description: When the job became dead.
    JobList:
      type: object
      required: [jobs]
      properties:
        jobs:
          type: array
          items:
            $ref: "#/components/schemas/Job"
        nextCursor:
          type: string
          description: Pass as cursor for the next page. Absent on the last page.
    Token:
      type: object
      required: [id, name, role, createdBy, createdAt, expiresAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        createdBy:
          type: string
          format: uuid
          description: The ID of the user who created the token.
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
          description: When the token was last used, to the minute.
        revokedAt:
          type: string
          format: date-time
    TokenList:
      type: object
      required: [tokens]
      properties:
        tokens:
          type: array
          items:
            $ref: "#/components/schemas/Token"
    NewToken:
      type: object
      required: [name, role, expiresAt]
      properties:
        name:
          type: string
          description: What the token is for, 1 to 100 characters.
        role:
          $ref: "#/components/schemas/Role"
        expiresAt:
          type: string
          format: date-time
          description: When the token stops working, at most a year away.
    CreatedToken:
      type: object
      required: [token, secret]
      properties:
        token:
          $ref: "#/components/schemas/Token"
        secret:
          type: string
          description: 'The token, sent as "Authorization: Bearer <secret>". It is shown only here.'
    Verdict:
      type: string
      enum: [true_positive, false_positive, inconclusive, duplicate, known_issue, flapping]
    Confidence:
      type: string
      enum: [low, medium, high]
    InvestigationStatus:
      type: string
      enum: [queued, running, final, failed, cancelled]
    RunKind:
      type: string
      enum: [investigate, follow_up]
      description: 'What the current run does: a full investigation, or the answer to follow-up questions.'
    FeedbackSummary:
      type: object
      required: [correct, wrong, summary]
      description: The ratings responders gave the verdict of the current run.
      properties:
        correct:
          type: integer
        wrong:
          type: integer
        summary:
          type: string
          enum: [correct, wrong, mixed, none]
          description: |
            correct or wrong when every rating says so, mixed when both
            kinds exist, and none when nobody rated.
    FeedbackTargetKind:
      type: string
      enum: [verdict, finding, fix, tool_call]
    FeedbackRating:
      type: string
      enum: [correct, wrong]
      x-enum-varnames: [RatingCorrect, RatingWrong]
    NewFeedback:
      type: object
      required: [targetKind, targetRef, rating]
      properties:
        targetKind:
          $ref: "#/components/schemas/FeedbackTargetKind"
        targetRef:
          type: string
          maxLength: 200
          description: |
            `run:N/verdict`, `run:N/finding:ID` or `run:N/fix:ID` for the
            current run N, or the ID of a tool call.
        rating:
          $ref: "#/components/schemas/FeedbackRating"
        reason:
          type: string
          maxLength: 2000
        correctVerdict:
          $ref: "#/components/schemas/Verdict"
        correctCause:
          type: string
          maxLength: 2000
    Feedback:
      type: object
      required: [id, investigationId, targetKind, targetRef, rating, channel, confirmation, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        investigationId:
          type: string
          format: uuid
        targetKind:
          $ref: "#/components/schemas/FeedbackTargetKind"
        targetRef:
          type: string
        rating:
          $ref: "#/components/schemas/FeedbackRating"
        reason:
          type: string
        correctVerdict:
          $ref: "#/components/schemas/Verdict"
        correctCause:
          type: string
        channel:
          type: string
          enum: [ui, slack]
        confirmation:
          type: string
          enum: [unchanged, confirmed, revised, withdrawn]
          description: How this submission changed the confirmed verdict of the investigation.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    WatcherStatus:
      type: string
      enum: [running, recovered, timed_out, stopped]
    WatcherSummary:
      type: object
      required: [name, status]
      description: The newest watcher of the investigation's group.
      properties:
        name:
          type: string
        status:
          $ref: "#/components/schemas/WatcherStatus"
    InvestigationSummary:
      type: object
      required: [id, route, status, createdAt, costMicros, feedback]
      description: |
        One row of the list. The title comes from the alert, so it is text
        a sender wrote: show it as plain text.
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          description: The title of the event that opened the group. Absent when it has none.
        service:
          type: string
        route:
          type: string
        verdict:
          $ref: "#/components/schemas/Verdict"
        confidence:
          $ref: "#/components/schemas/Confidence"
        status:
          $ref: "#/components/schemas/InvestigationStatus"
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        durationMs:
          type: integer
          format: int64
          description: From the start to the end of the run. Absent while it runs.
        costMicros:
          type: integer
          format: int64
          description: The cost so far, in millionths of a US dollar.
        feedback:
          $ref: "#/components/schemas/FeedbackSummary"
        watcher:
          $ref: "#/components/schemas/WatcherSummary"
    InvestigationList:
      type: object
      required: [investigations]
      properties:
        investigations:
          type: array
          items:
            $ref: "#/components/schemas/InvestigationSummary"
        nextCursor:
          type: string
          description: Pass as cursor for the next page. Absent on the last page.
    Investigation:
      type: object
      required:
        - id
        - groupId
        - route
        - mode
        - status
        - run
        - runKind
        - inputTokens
        - outputTokens
        - costMicros
        - toolCalls
        - createdAt
        - eventCount
        - events
        - pendingFollowUps
      properties:
        id:
          type: string
          format: uuid
        groupId:
          type: string
          format: uuid
        title:
          type: string
        service:
          type: string
        route:
          type: string
        strategy:
          type: string
        strategyVersion:
          type: string
        mode:
          type: string
          description: The action mode in effect, such as read-only.
        status:
          $ref: "#/components/schemas/InvestigationStatus"
        run:
          type: integer
          description: The number of the current run; follow-up runs count too.
        runKind:
          $ref: "#/components/schemas/RunKind"
        verdict:
          $ref: "#/components/schemas/Verdict"
        confidence:
          $ref: "#/components/schemas/Confidence"
        stopReason:
          type: string
          description: Why the run ended, such as submitted, budget, cancelled or triage.
        model:
          type: string
          description: The model of the first model turn.
        connector:
          type: string
          description: The model connector the investigation runs on.
        inputTokens:
          type: integer
          format: int64
        outputTokens:
          type: integer
          format: int64
        costMicros:
          type: integer
          format: int64
        toolCalls:
          type: integer
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
        firstFindingAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        durationMs:
          type: integer
          format: int64
        cancelRequestedAt:
          type: string
          format: date-time
          description: When a responder asked to stop the run, while it has not stopped yet.
        confirmation:
          $ref: "#/components/schemas/Confirmation"
        report:
          $ref: "#/components/schemas/Report"
        eventCount:
          type: integer
          description: How many events the group has, which can be more than events lists.
        events:
          type: array
          description: The first 50 events of the group, oldest first.
          items:
            $ref: "#/components/schemas/Event"
        pendingFollowUps:
          type: array
          description: Follow-up questions that no run has answered yet, oldest first.
          items:
            $ref: "#/components/schemas/PendingFollowUp"
    Confirmation:
      type: object
      required: [verdict, at]
      description: The verdict people agree with.
      properties:
        verdict:
          $ref: "#/components/schemas/Verdict"
        cause:
          type: string
        at:
          type: string
          format: date-time
    PendingFollowUp:
      type: object
      required: [text, createdAt]
      properties:
        text:
          type: string
        author:
          type: string
        createdAt:
          type: string
          format: date-time
    Event:
      type: object
      required: [id, kind, intake, labels, links, receivedAt]
      description: |
        An alert or message that joined the group. Its text came from the
        sender, redacted but untrusted: show it as plain text, and open its
        links only as web links.
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [alert, resolved, message, mention]
        intake:
          type: string
          description: The webhook endpoint or Slack listener that took it.
        alertName:
          type: string
        title:
          type: string
        body:
          type: string
          description: The text, cut to 2000 bytes.
        service:
          type: string
        severity:
          type: string
        sender:
          $ref: "#/components/schemas/Sender"
        labels:
          type: object
          additionalProperties:
            type: string
        links:
          type: array
          description: The links the sender attached, with http or https addresses only.
          items:
            $ref: "#/components/schemas/EventLink"
        receivedAt:
          type: string
          format: date-time
    Sender:
      type: object
      properties:
        kind:
          type: string
          enum: [human, bot, system]
        name:
          type: string
    EventLink:
      type: object
      required: [title, url]
      properties:
        title:
          type: string
        url:
          type: string
    Report:
      type: object
      required: [verdict, confidence, reason, summary, findings, checked, stopReason]
      description: |
        The result of the investigation. The model wrote its text from what
        the sources returned, so show it as plain text.
      properties:
        verdict:
          $ref: "#/components/schemas/Verdict"
        confidence:
          $ref: "#/components/schemas/Confidence"
        reason:
          type: string
        summary:
          type: string
        cause:
          type: string
        impact:
          type: string
        findings:
          type: array
          items:
            $ref: "#/components/schemas/Finding"
        fixes:
          type: array
          items:
            $ref: "#/components/schemas/Fix"
        falsePositive:
          $ref: "#/components/schemas/FalsePositiveDetail"
        checked:
          type: array
          description: What was checked in each source.
          items:
            $ref: "#/components/schemas/SourceCheck"
        stopReason:
          type: string
          enum: [submitted, budget, cancelled, triage, error, no_verdict]
        stopDetail:
          type: string
        followUps:
          type: array
          description: The follow-up runs after the first, oldest first.
          items:
            $ref: "#/components/schemas/FollowUp"
    Finding:
      type: object
      required: [id, claim, evidence]
      properties:
        id:
          type: string
        claim:
          type: string
        evidence:
          type: array
          description: Empty for a hypothesis.
          items:
            $ref: "#/components/schemas/Evidence"
    Evidence:
      type: object
      required: [kind, title]
      properties:
        kind:
          type: string
          description: What the link points at, such as log_query, metric or deploy.
        title:
          type: string
        url:
          type: string
          description: A web link. Absent when the source gave none that is an http or https address.
        toolCallId:
          type: string
          description: The tool call whose step produced the evidence.
        at:
          type: string
          format: date-time
    Fix:
      type: object
      required: [id, title, detail]
      properties:
        id:
          type: string
        title:
          type: string
        detail:
          type: string
        actionProposalId:
          type: string
    FalsePositiveDetail:
      type: object
      required: [whyFired, prevention]
      properties:
        whyFired:
          type: string
        prevention:
          type: array
          items:
            $ref: "#/components/schemas/Prevention"
    Prevention:
      type: object
      required: [kind, detail]
      properties:
        kind:
          type: string
        detail:
          type: string
    SourceCheck:
      type: object
      required: [source, status, toolCalls]
      properties:
        source:
          type: string
        status:
          type: string
          enum: [ok, no_data, failed, unavailable]
        toolCalls:
          type: integer
        error:
          type: string
    FollowUp:
      type: object
      required: [run, questions, answer, answered, at]
      properties:
        run:
          type: integer
        questions:
          type: array
          items:
            $ref: "#/components/schemas/FollowUpQuestion"
        answer:
          type: string
          description: The answer, or why there is none when answered is false.
        answered:
          type: boolean
        evidence:
          type: array
          items:
            $ref: "#/components/schemas/Evidence"
        previousVerdict:
          $ref: "#/components/schemas/Verdict"
        at:
          type: string
          format: date-time
    FollowUpQuestion:
      type: object
      required: [text]
      properties:
        author:
          type: string
        text:
          type: string
    StepList:
      type: object
      required: [steps]
      properties:
        steps:
          type: array
          items:
            $ref: "#/components/schemas/Step"
        nextAfter:
          type: integer
          format: int32
          description: The seq to pass as after for the next page. Absent on the last page.
    Step:
      type: object
      required: [seq, run, kind, status, startedAt, durationMs, parts]
      description: |
        One step of the record. A prompt step has only the first message the
        model got. Reasoning is shown when the provider returned it. Parts
        hold text from alerts, sources and the model: show it as plain text.
      properties:
        seq:
          type: integer
          format: int32
        run:
          type: integer
        kind:
          type: string
          enum:
            - prompt
            - model_turn
            - tool_result
            - note
            - inbox
            - summary
            - triage_prompt
            - triage_turn
            - triage_result
            - triage_override
        status:
          type: string
          enum: [ok, no_data, error, timeout, unavailable, rejected, over_budget]
        source:
          type: string
          description: For a tool result, the source that answered. Absent for a built-in tool.
        tool:
          type: string
        callId:
          type: string
          description: For a tool result, the ID of the call it answers.
        error:
          type: string
        connector:
          type: string
        model:
          type: string
        tokens:
          $ref: "#/components/schemas/StepTokens"
        costMicros:
          type: integer
          format: int64
        startedAt:
          type: string
          format: date-time
        durationMs:
          type: integer
          format: int32
        parts:
          type: array
          items:
            $ref: "#/components/schemas/StepPart"
    StepTokens:
      type: object
      required: [input, output]
      properties:
        input:
          type: integer
          format: int64
        output:
          type: integer
          format: int64
        cacheRead:
          type: integer
          format: int64
        cacheWrite:
          type: integer
          format: int64
    StepPart:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [text, tool_call, tool_result, reasoning]
        text:
          type: string
          description: For text and reasoning, cut to 32 KiB.
        id:
          type: string
          description: For a tool call, its ID.
        name:
          type: string
          description: For a tool call, the tool's name.
        input:
          description: For a tool call, the arguments, as JSON.
        callId:
          type: string
          description: For a tool result, the ID of the call it answers.
        content:
          type: string
          description: For a tool result, what the tool returned, redacted and cut to 32 KiB.
        isError:
          type: boolean
        truncated:
          type: boolean
          description: Set when text or content was cut.
    StreamStatus:
      type: object
      required: [status, run, runKind, confirmed, costMicros, inputTokens, outputTokens, toolCalls]
      description: |
        The data of a `status` event of the stream: what changes while the
        investigation runs. When it differs from the page, get the
        investigation again for the report.
      properties:
        status:
          $ref: "#/components/schemas/InvestigationStatus"
        run:
          type: integer
        runKind:
          $ref: "#/components/schemas/RunKind"
        verdict:
          $ref: "#/components/schemas/Verdict"
        confidence:
          $ref: "#/components/schemas/Confidence"
        stopReason:
          type: string
        finishedAt:
          type: string
          format: date-time
        cancelRequestedAt:
          type: string
          format: date-time
        confirmed:
          type: boolean
          description: Whether people confirmed the verdict.
        costMicros:
          type: integer
          format: int64
        inputTokens:
          type: integer
          format: int64
        outputTokens:
          type: integer
          format: int64
        toolCalls:
          type: integer
    WatcherList:
      type: object
      required: [watchers]
      properties:
        watchers:
          type: array
          items:
            $ref: "#/components/schemas/Watcher"
    Watcher:
      type: object
      required: [id, name, checkType, status, passesInARow, passesToRecover, intervalSeconds, checks, startedAt, recentChecks]
      description: |
        A check that runs on a schedule until the service is back up or its
        time is over. The last result comes from the checked service, so
        show it as plain text.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        checkType:
          type: string
          description: http, tool or alert.
        status:
          $ref: "#/components/schemas/WatcherStatus"
        passesInARow:
          type: integer
        passesToRecover:
          type: integer
        intervalSeconds:
          type: integer
        checks:
          type: integer
          description: How many checks have run.
        lastCheckAt:
          type: string
          format: date-time
        lastResult:
          type: string
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
        stopReason:
          type: string
          description: For a stopped watcher, group_resolved, responder or config_changed.
        stoppedBy:
          $ref: "#/components/schemas/Person"
        recentChecks:
          type: array
          description: Up to the last 50 checks, newest first.
          items:
            $ref: "#/components/schemas/WatcherCheck"
    Person:
      type: object
      description: Someone who acted, by their Slack user ID, or their user ID in the web UI.
      properties:
        slackUserId:
          type: string
        userId:
          type: string
          format: uuid
    WatcherCheck:
      type: object
      required: [seq, at, result, durationMs]
      properties:
        seq:
          type: integer
        at:
          type: string
          format: date-time
        result:
          type: string
          enum: [pass, fail, error]
        detail:
          type: string
        durationMs:
          type: integer
    Problem:
      type: object
      description: Problem details, as RFC 9457 describes.
      required: [type, title, status]
      properties:
        type:
          type: string
          description: A URI that names the kind of problem; about:blank when the status says it all.
        title:
          type: string
          description: A short summary of the kind of problem.
        status:
          type: integer
          description: The HTTP status code.
        detail:
          type: string
          description: What went wrong with this request.
        code:
          type: string
          description: |
            Names the kind of problem for a program. Only some answers have
            it: validation (422), file_rule, exists, stale, conflict
            (409) and not_found (404) on listeners and routes.
        errors:
          type: array
          description: The fields of the request that were refused, when code is validation.
          items:
            $ref: "#/components/schemas/FieldError"
        instance:
          type: string
          description: The path of the request.
