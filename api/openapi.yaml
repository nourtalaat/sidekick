        kind:
          type: string
          description: The kind of job, such as investigate or publish.
        route:
          type: string
        attempts:
          type: integer
        maxAttempts:
          type: integer
        lastError:
          type: string
          description: Why the last attempt failed, redacted.
        createdAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
          description: When the job became dead.
    JobList:
      type: object
      required: [jobs]
      properties:
        jobs:
          type: array
          items:
            $ref: "#/components/schemas/Job"
        nextCursor:
          type: string
          description: Pass as cursor for the next page. Absent on the last page.
    Token:
      type: object
      required: [id, name, role, createdBy, createdAt, expiresAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        createdBy:
          type: string
          format: uuid
          description: The ID of the user who created the token.
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
          description: When the token was last used, to the minute.
        revokedAt:
          type: string
          format: date-time
    TokenList:
      type: object
