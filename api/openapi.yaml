openapi: 3.1.0
info:
  title: Sidekick API
  version: v1
  description: |
    The JSON API of Sidekick, which the web UI uses. Every operation needs a
    web UI session or an API token, and names the lowest role that may call
    it in `x-sidekick-role`: viewer, responder, approver or admin. A higher
    role includes every lower one. Errors are problem details (RFC 9457).
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: /api/v1
security:
  - session: []
  - token: []
paths:
  /me:
    get:
      operationId: GetMe
      summary: The signed-in user or API token, and its role
      x-sidekick-role: viewer
      responses:
        "200":
          description: The caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        default:
          $ref: "#/components/responses/Problem"
  /config:
    get:
      operationId: GetConfig
      summary: The effective config, with secrets shown only as references
      description: |
        The config file as Sidekick read it, defaults included, which only
        a config change can alter, and the listeners and routes stored at
        runtime. Secrets appear only as references to a Secret's name and
        key. Strings the redaction rules match are redacted.
      x-sidekick-role: admin
      responses:
        "200":
          description: The effective config.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EffectiveConfig"
        default:
          $ref: "#/components/responses/Problem"
  /jobs:
    get:
      operationId: ListJobs
      summary: Dead jobs, newest first, a page at a time
      x-sidekick-role: admin
      parameters:
        - name: status
          in: query
          description: Only dead jobs are listed.
          schema:
            type: string
            enum: [dead]
            default: dead
        - name: cursor
          in: query
          description: The nextCursor of the page before.
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: A page of dead jobs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobList"
        default:
          $ref: "#/components/responses/Problem"
  /jobs/{id}/retry:
    post:
      operationId: RetryJob
      summary: Retry a dead job
      description: |
        Sets the dead job back to pending with its attempts reset, and
        writes the retry to the audit log.
      x-sidekick-role: admin
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: The job is pending again.
        default:
          $ref: "#/components/responses/Problem"
  /jobs/{id}/discard:
    post:
      operationId: DiscardJob
      summary: Discard a dead job
      description: |
        Deletes the dead job, so it cannot run again, and writes the discard
        to the audit log with the job's kind, attempts and masked last error.
        A job that is not dead answers 409.
      x-sidekick-role: admin
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: The job is deleted.
        default:
          $ref: "#/components/responses/Problem"
  /tokens:
    get:
      operationId: ListTokens
      summary: Every API token, revoked and expired ones included, newest first
      x-sidekick-role: admin
      responses:
        "200":
          description: The tokens. The tokens themselves are never shown again.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: CreateToken
      summary: Create an API token
      description: |
        Only a signed-in admin can create a token, never another token. The
        token's role is at most the creator's, and its expiry at most a year
        away. The answer holds the token itself, which is never shown again.
      x-sidekick-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewToken"
      responses:
        "201":
          description: The new token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedToken"
        default:
          $ref: "#/components/responses/Problem"
  /tokens/{id}:
    delete:
      operationId: RevokeToken
      summary: Revoke an API token
      x-sidekick-role: admin
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: The token is revoked.
        default:
          $ref: "#/components/responses/Problem"
  /listeners:
    get:
      operationId: ListListeners
      summary: The listeners, from the config file and from runtime, with their status
      description: |
        Every listener in effect, in name order, then the runtime listeners
        that are stored but not in effect. A listener of the config file is
        read-only. A runtime listener with the name of a file listener is
        shadowed: the file listener is used and the runtime one is shown
        with status shadowed.
      x-sidekick-role: viewer
      responses:
        "200":
          description: The listeners.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListenerList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: CreateListener
      summary: Add a runtime listener
      description: |
        Runs the checks that the config file and the `/sidekick listen`
        command run. A failed check answers 422 with the field of each
        problem. The name of a file listener answers 409. Every replica uses
        the listener within seconds. The change is written to the audit log.
      x-sidekick-role: responder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewListener"
      responses:
        "201":
          description: The new listener.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Listener"
        default:
          $ref: "#/components/responses/Problem"
  /listeners/{name}:
    put:
      operationId: UpdateListener
      summary: Replace a runtime listener
      description: |
        Replaces the listener and turns it on or off. `version` is the
        version that was read; if the listener changed since, the answer is
        409 with code `stale`. A listener of the config file answers 409.
      x-sidekick-role: responder
      parameters:
        - $ref: "#/components/parameters/RuleName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListenerUpdate"
      responses:
        "200":
          description: The listener as saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Listener"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: DeleteListener
      summary: Delete a runtime listener
      description: |
        Deletes the runtime listener. This also deletes a runtime listener
        that a file listener shadows. A file listener that no runtime
        listener shadows answers 409.
      x-sidekick-role: responder
      parameters:
        - $ref: "#/components/parameters/RuleName"
      responses:
        "204":
          description: The listener is deleted.
        default:
          $ref: "#/components/responses/Problem"
  /routes:
    get:
      operationId: ListRoutes
      summary: The routes, from the config file and from runtime, with their status
      description: |
        The routes in effect in the order they are tried, then the runtime
        routes that are stored but not in effect. A route of the config
        file is read-only. A runtime route with the name of a file route is
        shadowed.
      x-sidekick-role: viewer
      responses:
        "200":
          description: The routes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RouteList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: CreateRoute
      summary: Add a runtime route
      description: |
        Runs the checks of the config file and of `/sidekick route set`,
        with the runtime ceilings: only sources, outputs and strategies of
        the config file, and budgets at or below its ceilings. A failed
        check answers 422 with the field of each problem.
      x-sidekick-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewRoute"
      responses:
        "201":
          description: The new route.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Route"
        default:
          $ref: "#/components/responses/Problem"
  /routes/{name}:
    put:
      operationId: UpdateRoute
      summary: Replace a runtime route
      description: |
        Replaces the route and turns it on or off. `version` is the version
        that was read; if the route changed since, the answer is 409 with
        code `stale`. A route of the config file answers 409.
      x-sidekick-role: admin
      parameters:
        - $ref: "#/components/parameters/RuleName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RouteUpdate"
      responses:
        "200":
          description: The route as saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Route"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: DeleteRoute
      summary: Delete a runtime route
      description: |
        Deletes the runtime route. This also deletes a runtime route that a
        file route shadows. A file route that no runtime route shadows
        answers 409.
      x-sidekick-role: admin
      parameters:
        - $ref: "#/components/parameters/RuleName"
      responses:
        "204":
          description: The route is deleted.
        default:
          $ref: "#/components/responses/Problem"
  /strategies:
    get:
      operationId: ListStrategies
      summary: The strategies, built-in, from the config file and from runtime, with their status
      description: |
        The strategies in effect in name order, then the runtime strategies
        that are stored but not in effect. A runtime strategy replaces a
        built-in one of the same name, and a strategy file replaces both. A
        built-in strategy and a strategy file are read-only. A runtime
        strategy with the name of a strategy file is shadowed. A stored
        version that no longer passes the strategy checks is invalid.
      x-sidekick-role: viewer
      responses:
        "200":
          description: The strategies.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StrategyList"
        default:
          $ref: "#/components/responses/Problem"
  /strategies/{name}:
    get:
      operationId: GetStrategy
      summary: The strategy in effect with this name, with its YAML
      description: |
        For a name with no strategy in effect but an invalid runtime
        version stored, the answer is that runtime strategy with the status
        invalid. Answers 404 when there is neither.
      x-sidekick-role: viewer
      parameters:
        - $ref: "#/components/parameters/StrategyName"
      responses:
        "200":
          description: The strategy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StrategyDetail"
        default:
          $ref: "#/components/responses/Problem"
  /strategies/{name}/versions:
    get:
      operationId: ListStrategyVersions
      summary: The saved versions of a runtime strategy, newest first
      description: |
        A page of the versions without their YAML. A name that no strategy
        has answers 404; a strategy with no runtime version answers an
        empty list.
      x-sidekick-role: viewer
      parameters:
        - $ref: "#/components/parameters/StrategyName"
        - name: before
          in: query
          description: Only versions below this number; the next of the page before.
          schema:
            type: integer
            minimum: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: A page of versions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StrategyVersionList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: SaveStrategyVersion
      summary: Save a new version of a runtime strategy
      description: |
        Saves the YAML as the next version of the runtime strategy, and
        creates the strategy with version 1 when none is stored. The YAML
        goes through the checks of a strategy file, and its name must be
        the name in the path. A reason is required. A failed check answers
        422 with code `validation` and a field for each problem: `reason`,
        `body` for the whole YAML, or `body.` and the path in the YAML, such
        as `body.match.textPattern`; a message ends with the line when it is
        known. A body that is the same as the current version answers 422
        with code `unchanged`. `baseVersion` is the version that was read,
        or 0 for a strategy that is not stored yet; if the strategy was
        saved since, the answer is 409 with code `stale`.
      x-sidekick-role: admin
      parameters:
        - $ref: "#/components/parameters/StrategyName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewStrategyVersion"
      responses:
        "201":
          description: The version as saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StrategyVersionDetail"
        default:
          $ref: "#/components/responses/Problem"
  /strategies/{name}/versions/{version}:
    get:
      operationId: GetStrategyVersion
      summary: One saved version of a runtime strategy, with its YAML
      x-sidekick-role: viewer
      parameters:
        - $ref: "#/components/parameters/StrategyName"
        - name: version
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: The version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StrategyVersionDetail"
        default:
          $ref: "#/components/responses/Problem"
  /lessons:
    get:
      operationId: ListLessons
      summary: Lessons, newest first, a page at a time
      description: |
        Lessons are short pieces of reviewed guidance that prompts show the
        model. A lesson that waits for review has the status `proposed`.
        `counts` is the number of lessons with each status, whatever the
        filters. The text of a lesson came from people and the model: show it
        as plain text.
      x-sidekick-role: viewer
      parameters:
        - name: status
          in: query
          description: Only lessons with this status.
          schema:
            $ref: "#/components/schemas/LessonStatus"
        - name: service
          in: query
          description: Only lessons scoped to this service.
          schema:
            type: string
        - name: q
          in: query
          description: Only lessons whose text matches these words, as in a web search.
          schema:
            type: string
            maxLength: 200
        - name: cursor
          in: query
          description: The nextCursor of the page before.
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: A page of lessons.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LessonList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: CreateLesson
      summary: Write a lesson
      description: |
        Stores a lesson written by an admin, active at once unless
        `status` is `proposed`. A lesson with no scope field is global and
        applies to every investigation. A failed check answers 422 with the
        field of the problem. The change is written to the audit log.
      x-sidekick-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewLesson"
      responses:
        "201":
          description: The new lesson.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lesson"
        default:
          $ref: "#/components/responses/Problem"
  /lessons/{id}:
    put:
      operationId: UpdateLesson
      summary: Edit a lesson, disable or enable it, or reject it
      description: |
        Replaces the text and scope of the lesson. `status` may be omitted to
        keep the status; a lesson that waits for review may be rejected, an
        active one disabled and a disabled one enabled. Approving a lesson
        that waits for review is its own operation. `version` is the version
        that was read; if the lesson changed since, the answer is 409 with
        code `stale`. A lesson drafted from feedback keeps at least one scope
        field (422). The change is written to the audit log.
      x-sidekick-role: admin
      parameters:
        - $ref: "#/components/parameters/LessonID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LessonUpdate"
      responses:
        "200":
          description: The lesson as saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lesson"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: DeleteLesson
      summary: Delete a lesson
      description: |
        Deletes the lesson and the record of the investigations that used it.
        The audit log keeps its text.
      x-sidekick-role: admin
      parameters:
        - $ref: "#/components/parameters/LessonID"
      responses:
        "204":
          description: The lesson is deleted.
        default:
          $ref: "#/components/responses/Problem"
  /lessons/{id}/approve:
    post:
      operationId: ApproveLesson
      summary: Approve a lesson that waits for review
      description: |
        Makes the lesson active, so prompts use it, and notes who approved it.
        `version` is the version that was read; if the lesson changed since,
        the answer is 409 with code `stale`. A lesson that does not wait for
        review answers 409 with code `not_proposed`. The change is written to
        the audit log.
      x-sidekick-role: admin
      parameters:
        - $ref: "#/components/parameters/LessonID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LessonApproval"
      responses:
        "200":
          description: The lesson as saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lesson"
        default:
          $ref: "#/components/responses/Problem"
  /strategy-proposals:
    get:
      operationId: ListStrategyProposals
      summary: Proposed changes to strategies, newest first, a page at a time
      description: |
        The changes the model drafted after a strategy version collected
        wrong feedback, with the result of the benchmark gate that checks
        each. Proposals that are still being drafted, and drafts that
        failed, are listed only when asked for with `status`.
      x-sidekick-role: admin
      parameters:
        - name: status
          in: query
          description: Only proposals with this status. The default is every status but `drafting` and `draft_failed`.
          schema:
            $ref: "#/components/schemas/StrategyProposalStatus"
        - name: name
          in: query
          description: Only proposals for the strategy with this name.
          schema:
            type: string
        - name: cursor
          in: query
          description: The nextCursor of the page before.
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: A page of proposals.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StrategyProposalList"
        default:
          $ref: "#/components/responses/Problem"
  /strategy-proposals/{id}:
    get:
      operationId: GetStrategyProposal
      summary: One proposal, with its YAML, the feedback and the gate result
      description: |
        `baseBody` and `body` are the strategy before and after the change,
        for a diff. `gate` holds the numbers the gate's decision rests on.
        `stale` is true when the strategy has changed since the draft, so
        approving a proposal for a runtime strategy would fail.
      x-sidekick-role: admin
      parameters:
        - $ref: "#/components/parameters/StrategyProposalID"
      responses:
        "200":
          description: The proposal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StrategyProposal"
        default:
          $ref: "#/components/responses/Problem"
    put:
      operationId: EditStrategyProposal
      summary: Replace the YAML of a proposal and send it through the gate again
      description: |
        Only a proposal whose gate has ended and that nobody has decided on
        can be edited; any other answers 409 with code `conflict`. The YAML
        goes through the checks of a strategy file, and its name must be the
        proposal's; a failed check answers 422 with code `validation` and
        a field for each problem. The old gate result is dropped. Saving the
        same YAML runs the gate again.
      x-sidekick-role: admin
      parameters:
        - $ref: "#/components/parameters/StrategyProposalID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EditStrategyProposal"
      responses:
        "200":
          description: The proposal, now pending.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StrategyProposal"
        default:
          $ref: "#/components/responses/Problem"
  /strategy-proposals/{id}/approve:
    post:
      operationId: ApproveStrategyProposal
      summary: Apply a proposal that passed its gate
      description: |
        There is no way to apply a proposal that has not passed: any other
        answers 409 with code `not_passed`, and nothing is changed. For a
        runtime strategy the YAML is saved as its next version, and for a
        built-in one as a runtime strategy of the same name. The answer has
        the `version`. For a strategy in a file, Sidekick cannot change the
        file: the answer has the `yaml` to commit. A strategy that was saved
        since the draft answers 409 with code `stale`, and one that already
        holds the YAML 422 with code `unchanged`.
      x-sidekick-role: admin
      parameters:
        - $ref: "#/components/parameters/StrategyProposalID"
      responses:
        "200":
          description: The proposal as decided.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StrategyProposalApproval"
        default:
          $ref: "#/components/responses/Problem"
  /strategy-proposals/{id}/reject:
    post:
      operationId: RejectStrategyProposal
      summary: Set a proposal aside
      description: |
        A proposal that has a draft and that nobody has decided on can be
        rejected, whatever its gate result; any other answers 409 with code
        `conflict`. A gate that is still running stops before its next run.
      x-sidekick-role: admin
      parameters:
        - $ref: "#/components/parameters/StrategyProposalID"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectStrategyProposal"
      responses:
        "200":
          description: The rejected proposal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StrategyProposalSummary"
        default:
          $ref: "#/components/responses/Problem"
  /memory/entries:
    get:
      operationId: ListMemoryEntries
      summary: Memory entries, newest confirmation first, a page at a time
      description: |
        Memory holds one entry for each investigation whose verdict a
        responder confirmed; prompts show the entries like a new alert. The
        list has disabled entries too. The text of an entry came from the
        model and from people: show it as plain text. The answer has no total,
        since counting every entry would read the whole table.
      x-sidekick-role: viewer
      parameters:
        - name: service
          in: query
          description: Only entries of this service.
          schema:
            type: string
        - name: verdict
          in: query
          description: Only entries with this confirmed verdict.
          schema:
            $ref: "#/components/schemas/Verdict"
        - name: q
          in: query
          description: Only entries whose service, alert name, summary or cause match these words, as in a web search.
          schema:
            type: string
            maxLength: 200
        - name: disabled
          in: query
          description: With true, only disabled entries; with false, only enabled ones. Leave it out for both.
          schema:
            type: boolean
        - name: cursor
          in: query
          description: The nextCursor of the page before.
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: A page of memory entries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryEntryList"
        default:
          $ref: "#/components/responses/Problem"
  /memory/entries/{id}:
    get:
      operationId: GetMemoryEntry
      summary: One memory entry
      x-sidekick-role: viewer
      parameters:
        - $ref: "#/components/parameters/MemoryEntryID"
      responses:
        "200":
          description: The memory entry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryEntry"
        default:
          $ref: "#/components/responses/Problem"
    put:
      operationId: UpdateMemoryEntry
      summary: Edit a memory entry, disable it or enable it
      description: |
        Replaces the summary, the cause and the disabled flag. A disabled
        entry is never shown to a prompt or found by a search. The last write
        wins; there is no version. The next change of the investigation's
        confirmation replaces the summary and the cause with the
        investigation's own and keeps the flag. A summary or cause that is
        empty (the summary), too long or has control characters answers 422
        with the field. Text that differs from the stored text is redacted
        before it is stored. A request that changes nothing writes nothing.
        The change is written to the audit log.
      x-sidekick-role: admin
      parameters:
        - $ref: "#/components/parameters/MemoryEntryID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemoryEntryUpdate"
      responses:
        "200":
          description: The memory entry as stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryEntry"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: DeleteMemoryEntry
      summary: Delete a memory entry
      description: |
        Deletes the entry and its embedding. If the confirmation of the
        investigation changes later, a new entry is written; disable an entry
        to keep it out for good. The audit log keeps what the entry said.
      x-sidekick-role: admin
      parameters:
        - $ref: "#/components/parameters/MemoryEntryID"
      responses:
        "204":
          description: The memory entry is deleted.
        default:
          $ref: "#/components/responses/Problem"
  /services/notes:
    get:
      operationId: ListServiceNotes
      summary: The services that have notes, by name, a page at a time
      description: |
        Service notes are what people wrote about a service; the memory source
        shows them to the model. Each service comes with the first characters
        of its notes. Read the notes of one service with
        `GET /services/{name}/notes`.
      x-sidekick-role: viewer
      parameters:
        - name: after
          in: query
          description: The nextAfter of the page before.
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        "200":
          description: A page of services with notes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceNotesList"
        default:
          $ref: "#/components/responses/Problem"
  /services/{name}/notes:
    get:
      operationId: GetServiceNotes
      summary: The notes about a service
      description: |
        A service without notes answers 200 with empty `text` and no
        `updatedAt`. The text is plain text: show it as such.
      x-sidekick-role: viewer
      parameters:
        - $ref: "#/components/parameters/ServiceName"
      responses:
        "200":
          description: The notes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceNotes"
        default:
          $ref: "#/components/responses/Problem"
    put:
      operationId: PutServiceNotes
      summary: Replace the notes about a service
      description: |
        Replaces the notes with `text`, which is trimmed and redacted before
        it is stored. Empty text deletes the notes. The last write wins.
        Text longer than 4,000 characters, once redacted, or with control
        characters answers 422 with the field `text`. The change is written
        to the audit log; a request that changes nothing writes nothing.
      x-sidekick-role: admin
      parameters:
        - $ref: "#/components/parameters/ServiceName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceNotesUpdate"
      responses:
        "200":
          description: The notes as stored, empty after a delete.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceNotes"
        default:
          $ref: "#/components/responses/Problem"
  /audit:
    get:
      operationId: ListAudit
      summary: The audit log, newest first, a page at a time
      description: |
        Every proposal, approval, investigation, feedback, rule change, login
        and role change, with who made it and, for a change, the old and new
        values. Rows are never changed. The filters must all match. Values
        that a redaction rule matches are redacted.
      x-sidekick-role: admin
      parameters:
        - name: from
          in: query
          description: Only entries made at or after this time.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: Only entries made before this time.
          schema:
            type: string
            format: date-time
        - name: actor
          in: query
          description: |
            The ID of the user, API token or Slack user that made the change.
            sidekick, policy and system select the entries Sidekick made on
            its own.
          schema:
            type: string
        - name: action
          in: query
          description: The action, such as route.updated or job.retried.
          schema:
            type: string
        - name: investigation
          in: query
          description: Only entries of this investigation.
          schema:
            type: string
            format: uuid
        - name: cursor
          in: query
          description: The nextCursor of the page before.
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: A page of audit entries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditList"
        default:
          $ref: "#/components/responses/Problem"
  /investigations:
    get:
      operationId: ListInvestigations
      summary: Investigations, newest first, a page at a time
      description: |
        Every filter that is given must match. The investigations are
        ordered by the time they were created, newest first, and a page
        starts after the investigation the cursor names. Investigations
        from before the list's service, model and title columns existed are
        filled in the background when Sidekick starts; until that has
        finished they do not match the service, model and q filters.
      x-sidekick-role: viewer
      parameters:
        - name: from
          in: query
          description: Only investigations created at or after this time.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: Only investigations created before this time.
          schema:
            type: string
            format: date-time
        - name: route
          in: query
          schema:
            type: string
        - name: service
          in: query
          schema:
            type: string
        - name: model
          in: query
          description: The model of the investigation's first model turn.
          schema:
            type: string
        - name: verdict
          in: query
          schema:
            $ref: "#/components/schemas/Verdict"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/InvestigationStatus"
        - name: q
          in: query
          description: |
            Words of the alert title. Every word must be in it; quotes match
            a phrase, and a minus sign leaves a word out.
          schema:
            type: string
            maxLength: 200
        - name: cursor
          in: query
          description: The nextCursor of the page before.
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: A page of investigations.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvestigationList"
        default:
          $ref: "#/components/responses/Problem"
  /investigations/{id}:
    get:
      operationId: GetInvestigation
      summary: One investigation, with its report and the events of its group
      x-sidekick-role: viewer
      parameters:
        - $ref: "#/components/parameters/InvestigationID"
      responses:
        "200":
          description: The investigation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Investigation"
        default:
          $ref: "#/components/responses/Problem"
  /investigations/{id}/steps:
    get:
      operationId: ListInvestigationSteps
      summary: The steps of an investigation, in order, a page at a time
      description: |
        The record of the run: the prompt, each model turn, each tool call
        and its result, as the model saw them. Tool results are redacted
        already. Steps the retention job deleted are missing from the
        list.
      x-sidekick-role: viewer
      parameters:
        - $ref: "#/components/parameters/InvestigationID"
        - name: run
          in: query
          description: Only the steps of this run.
          schema:
            type: integer
            minimum: 1
        - name: after
          in: query
          description: Only the steps with a seq above this one; the nextAfter of the page before.
          schema:
            type: integer
            format: int32
            minimum: -1
            default: -1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        "200":
          description: A page of steps.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StepList"
        default:
          $ref: "#/components/responses/Problem"
  /investigations/{id}/watchers:
    get:
      operationId: ListInvestigationWatchers
      summary: The watchers of the investigation's group, with their last checks
      x-sidekick-role: viewer
      parameters:
        - $ref: "#/components/parameters/InvestigationID"
      responses:
        "200":
          description: The watchers, oldest first, each with up to its last 50 checks, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WatcherList"
        default:
          $ref: "#/components/responses/Problem"
  /investigations/{id}/feedback:
    get:
      operationId: ListInvestigationFeedback
      summary: How people rated the parts of an investigation
      description: |
        For each part of the current run's report that has feedback (the
        verdict, a finding or a fix), and for each tool call that has
        some, how many people rated it correct and how many wrong, from
        Slack and the web UI together. When a signed-in user is calling,
        `mine` is their own opinion of the part. Parts nobody rated are
        left out, and so is feedback on the parts of an earlier run.
      x-sidekick-role: viewer
      parameters:
        - $ref: "#/components/parameters/InvestigationID"
      responses:
        "200":
          description: The parts with feedback.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackPartList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: CreateInvestigationFeedback
      summary: Say that one part of an investigation is correct or wrong
      description: |
        Feedback on the verdict, a finding, a fix or a tool call, with an
        optional reason and, when the caller knows it, the real verdict and
        cause. A signed-in user has one opinion per part: a new submission
        replaces the user's earlier one. A real verdict confirms the
        investigation, whichever part the feedback is about, and a
        confirmation that changes is written to the audit log. Rating the
        verdict Correct confirms it too; rating it Wrong takes back a
        confirmation of that verdict.

        The target is checked against the current report and steps. The
        ref of the verdict is `run:N/verdict`, of a finding
        `run:N/finding:ID`, of a fix `run:N/fix:ID`, where N is the
        investigation's current run; the ref of a tool call is its call ID.
        A ref that is not there answers 422, so a page that shows an older
        run learns that its report is gone. A verdict, finding or fix needs
        an investigation that has a verdict (409 otherwise); a tool call can
        be rated while the investigation runs. API tokens are refused with
        403, since feedback is given by a person.
      x-sidekick-role: responder
      parameters:
        - $ref: "#/components/parameters/InvestigationID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewFeedback"
      responses:
        "201":
          description: The stored feedback.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Feedback"
        default:
          $ref: "#/components/responses/Problem"
  /investigations/{id}/stream:
    get:
      operationId: StreamInvestigation
      summary: A stream of server-sent events about one investigation
      description: |
        Server-sent events (text/event-stream) while the investigation
        changes. Any replica serves the stream, not only the one that runs
        the investigation. The events are:

        - `step`, with the seq as its id and a Step as its data, for each
          step saved after the one the client has.
        - `status`, with no id and a StreamStatus as its data, once when
          the stream starts and again whenever the status, the run, the
          stop request or the confirmed verdict changes.
        - `watchers`, with `{}` as its data, when a watcher of the
          investigation started, ran a check or ended; get the watchers
          again.

        A comment line every 15 seconds keeps the connection open. The
        stream ends after 30 minutes, and the browser's EventSource then
        reconnects with the Last-Event-ID header, which resumes after that
        step. A client that connects the first time can pass `after`, the
        last seq it has, instead. At most 100 streams are open on a
        replica; above that the answer is 429.
      x-sidekick-role: viewer
      parameters:
        - $ref: "#/components/parameters/InvestigationID"
        - name: after
          in: query
          description: The last seq the client has. Last-Event-ID wins when both are given.
          schema:
            type: integer
            format: int32
            minimum: -1
        - name: Last-Event-ID
          in: header
          description: The seq of the last step the client received, sent by EventSource when it reconnects.
          schema:
            type: string
      responses:
        "200":
          description: The event stream.
          content:
            text/event-stream:
              schema:
                type: string
        default:
          $ref: "#/components/responses/Problem"
  /investigations/{id}/follow-ups:
    post:
      operationId: AskFollowUp
      summary: Ask a follow-up question about an investigation
      description: |
        Adds the question to the investigation's inbox. A running
        investigation reads it before its next model turn; one that has
        ended answers it in a new follow-up run. The text is redacted
        before it is stored. The answer shows up in the investigation's
        report, and the stream tells the page when a run starts.
        The answer is 409 for a triage-only result, which takes no
        questions until a full investigation has run, and for an
        investigation that failed.
      x-sidekick-role: responder
      parameters:
        - $ref: "#/components/parameters/InvestigationID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FollowUpRequest"
      responses:
        "202":
          description: The question was stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FollowUpAccepted"
        default:
          $ref: "#/components/responses/Problem"
  /investigations/{id}/cancel:
    post:
      operationId: CancelInvestigation
      summary: Stop the run of an investigation
      description: |
        Asks the run to stop. The worker that owns it cancels the call in
        flight, and the run ends as cancelled with a report built from its
        steps. Asking again, or asking for an investigation that has ended,
        changes nothing and answers with `requested` false.
      x-sidekick-role: responder
      parameters:
        - $ref: "#/components/parameters/InvestigationID"
      responses:
        "200":
          description: Whether this request asked for the stop.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancelResult"
        default:
          $ref: "#/components/responses/Problem"
  /investigations/{id}/resolve:
    post:
      operationId: ResolveInvestigation
      summary: Mark the investigation's group as resolved
      description: |
        Closes the group as resolved and ends its running watchers, as a
        recovery does. A group that is resolved already changes nothing and
        answers with `resolved` false. A group that closed for another
        reason, such as the end of its window, answers 409.
      x-sidekick-role: responder
      parameters:
        - $ref: "#/components/parameters/InvestigationID"
      responses:
        "200":
          description: Whether this request resolved the group.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResolveResult"
        default:
          $ref: "#/components/responses/Problem"
  /watchers/{id}/stop:
    post:
      operationId: StopWatcher
      summary: Stop a running watcher
      description: |
        Stops the watcher with reason `responder`. A watcher that has ended
        already changes nothing and answers with `stopped` false.
      x-sidekick-role: responder
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Whether this request stopped the watcher.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StopWatcherResult"
        default:
          $ref: "#/components/responses/Problem"
  /proposals:
    get:
      operationId: ListProposals
      summary: Action proposals, newest first, a page at a time
      description: |
        The review queue. Without `status` it lists the proposals that wait
        for a decision. The proposals are ordered by the time they were
        made, newest first, and a page starts after the proposal the
        cursor names. `params`, `paramsText` and `reason` are text the
        model wrote: show them as plain text, and show `paramsText`, which
        spells out characters that could hide something, to the person who
        decides. `action` narrows the list to one action name.
      x-sidekick-role: approver
      parameters:
        - name: status
          in: query
          description: Only proposals with one of these statuses. The default is proposed.
          schema:
            type: array
            items:
              $ref: "#/components/schemas/ProposalStatus"
        - name: action
          in: query
          description: |
            Only proposals of this action. It is a name from the `actions`
            section of the config, as `Proposal.action` holds it;
            `GET /proposals/actions` lists them. It combines with `status`
            and `cursor`. A name that is not configured answers 400, and the
            detail lists the names.
          schema:
            type: string
        - name: cursor
          in: query
          description: The nextCursor of the page before.
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: A page of proposals.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProposalList"
        default:
          $ref: "#/components/responses/Problem"
  /proposals/actions:
    get:
      operationId: ListProposalActions
      summary: The names of the actions the config defines
      description: |
        The names in the `actions` section of the config, sorted. They are
        the values the `action` parameter of `GET /proposals` takes. They
        are read from the config in memory, not from the proposals, so an
        action that was removed from the config is not listed even when
        proposals of it exist.
      x-sidekick-role: approver
      responses:
        "200":
          description: The action names.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProposalActionList"
        default:
          $ref: "#/components/responses/Problem"
  /proposals/{id}/approve:
    post:
      operationId: ApproveProposal
      summary: Approve an action proposal
      description: |
        Approves a proposal that waits for a decision and queues the job
        that runs it. Only a person who is signed in approves: an API token
        gets 403, though it may list the queue and reject. The answer is 409 when the proposal expired
        (`code` expired), was decided already by someone else (`code`
        decided, with who in the detail), or is not allowed by the config
        any more (`code` not_allowed): the route no longer lists the
        action or is read-only now, or the action is no longer defined.
        When two people decide at the same time, one gets 200 and the
        other 409.
      x-sidekick-role: approver
      parameters:
        - $ref: "#/components/parameters/ProposalID"
      responses:
        "200":
          description: The proposal, approved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Proposal"
        default:
          $ref: "#/components/responses/Problem"
  /proposals/{id}/reject:
    post:
      operationId: RejectProposal
      summary: Reject an action proposal
      description: |
        Rejects a proposal that waits for a decision. Nothing runs. The
        note, if given, is redacted and kept in the audit log. The answers
        are those of approving, except that the config is not checked.
      x-sidekick-role: approver
      parameters:
        - $ref: "#/components/parameters/ProposalID"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectProposalRequest"
      responses:
        "200":
          description: The proposal, rejected.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Proposal"
        default:
          $ref: "#/components/responses/Problem"
  /proposals/{id}/undo:
    post:
      operationId: UndoProposal
      summary: Undo a succeeded action proposal
      description: |
        Restores what a succeeded proposal changed, for an action that
        changes a definition in place, such as a monitor. It records a new
        proposal that points at the original (`undoOf`), approved by the
        person who asked and run at once, and answers with that proposal.
        The original becomes `undone`. Only a person who is signed in undoes:
        an API token gets 403. Only proposals with `undoable` true qualify.

        Only the fields the action changed are put back; every other field
        stays as it is now. When someone changed one of those fields since,
        and `force` is not true, nothing is restored and the answer is 409
        with `code` conflict and `changes`: the difference between the
        definition now (`before`) and the value a restore would write
        (`after`). Send the same request with `force` true to restore it.

        The other 409 answers have a `code`: `not_undoable` (the proposal
        is not succeeded, was undone already, is an undo, or its action
        cannot undo it), `not_allowed` (the config no longer allows the
        action), `undo_running` (an undo of this proposal is running) and
        `undo_failed` (the restore failed for good; the detail says why and
        the original stays succeeded). A restore that failed for a reason
        that may pass answers 200 with the new proposal still `executing`;
        a job tries again.
      x-sidekick-role: approver
      parameters:
        - $ref: "#/components/parameters/ProposalID"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UndoProposalRequest"
      responses:
        "200":
          description: The new proposal that restores the original.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Proposal"
        default:
          $ref: "#/components/responses/Problem"
  /proposals/{id}/files/diff:
    get:
      operationId: GetProposalFileDiff
      summary: The line diff of one file of a pull request proposal
      description: |
        The unified line diff of the file at `path`, from the file on the
        base branch of the host to the content in the proposal's
        parameters. A person opens one file at a time, so the base is read
        from the host through the action when this is asked and is never
        stored. The proposal can have any status, so a person can read what
        was proposed after it expired or was rejected.

        Without `full` the answer holds the lines that changed with three
        unchanged lines on each side, cut at 400 lines (`truncated` true);
        a jump in the line numbers between two lines means lines were left
        out. With `full` true it holds every line of the file, uncut. A
        deleted file has only removed lines and a new file only added ones.
        `text` is one line of the file, with characters that could hide
        something written as \u escapes, and is plain text: show it as
        such.

        The answer is 400 without `path`, 404 when the proposal does not
        exist or does not change a file with that path, 409 with `code`
        diff_unavailable when the action that made the proposal is gone from
        the config or cannot read files from its host, and 502 when the host
        did not give the base of the file (it does not have the blob, or the
        file is too large or not text).
      x-sidekick-role: approver
      parameters:
        - $ref: "#/components/parameters/ProposalID"
        - name: path
          in: query
          required: true
          description: The path of a file in the `files` of the proposal.
          schema:
            type: string
        - name: full
          in: query
          description: Return every line of the file, with no cut.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: The diff.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProposalFileDiff"
        default:
          $ref: "#/components/responses/Problem"
  /investigations/{id}/fix-applied:
    put:
      operationId: MarkFixApplied
      summary: Mark the fix of a false positive as applied
      description: |
        Records that a responder applied the change that stops a false
        positive from firing again, such as a new monitor threshold. The
        dashboard counts it under noisy alerts fixed. Only an investigation
        that ended with the verdict false_positive has a fix to mark; any
        other answers 409. Marking one that is marked already changes
        nothing, writes no audit row and answers with `changed` false.
      x-sidekick-role: responder
      parameters:
        - $ref: "#/components/parameters/InvestigationID"
      responses:
        "200":
          description: The mark after the request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FixApplied"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: UnmarkFixApplied
      summary: Take back the mark that the fix was applied
      description: |
        Takes the mark away, for a fix that was marked by mistake. Taking
        back a mark that is not there changes nothing, writes no audit row
        and answers with `changed` false.
      x-sidekick-role: responder
      parameters:
        - $ref: "#/components/parameters/InvestigationID"
      responses:
        "200":
          description: The mark after the request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FixApplied"
        default:
          $ref: "#/components/responses/Problem"
  /investigations/{id}/scenario-draft:
    post:
      operationId: CreateScenarioDraft
      summary: Export a confirmed investigation as a benchmark scenario draft
      description: |
        Builds a draft of a benchmark scenario from the investigation and
        saves it: the payload of the alert that opened it, one fixture for
        each recorded source call, the confirmed verdict and cause as the
        expected outcome, and rubric items drafted by the `summarize` model
        when one is configured. Fixtures keep only the arguments that
        identify a query. Emails, user names, account IDs, host names and
        IP addresses are replaced by numbered placeholders such as `host-1`,
        the same everywhere in the scenario, and the draft is refused if
        anything of that kind is left.

        The draft has to be reviewed (`POST /scenarios/{id}/review`) before
        it can be run or downloaded. An investigation that has a scenario
        already answers 200 with it and builds nothing. The investigation
        must be confirmed (409 otherwise), and the alert that opened it
        must have come in on a webhook endpoint that is still in the
        config; a Slack or Teams message cannot be exported (422).
      x-sidekick-role: admin
      parameters:
        - $ref: "#/components/parameters/InvestigationID"
      responses:
        "200":
          description: The investigation had a scenario already.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scenario"
        "201":
          description: The new draft.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scenario"
        default:
          $ref: "#/components/responses/Problem"
  /scenarios:
    get:
      operationId: ListScenarios
      summary: Benchmark scenarios, most recently changed first, a page at a time
      x-sidekick-role: admin
      parameters:
        - name: status
          in: query
          description: Only scenarios with this status.
          schema:
            $ref: "#/components/schemas/ScenarioStatus"
        - name: cursor
          in: query
          description: The nextCursor of the page before.
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: A page of scenarios.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScenarioList"
        default:
          $ref: "#/components/responses/Problem"
  /scenarios/{id}:
    get:
      operationId: GetScenario
      summary: A scenario with what a reviewer needs to check it
      description: |
        The scenario file, what the exporter skipped or merged, the places
        the cleaner kept but could not classify, and each part of the
        scenario next to the recorded original it was made from. The
        originals are read while the investigation's events and steps are
        kept; later they are left out.
      x-sidekick-role: admin
      parameters:
        - $ref: "#/components/parameters/ScenarioID"
      responses:
        "200":
          description: The scenario.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScenarioDetail"
        default:
          $ref: "#/components/responses/Problem"
    put:
      operationId: UpdateScenario
      summary: Replace the file of a scenario
      description: |
        Replaces the scenario file. It must be a valid scenario with the same
        id, and hold no email, host name or IP address (422 otherwise).
        `revision` is the revision the editor read; if the scenario changed
        since, the answer is 409. Whatever the status was, the scenario is a
        draft again afterwards and has to be reviewed again.
      x-sidekick-role: admin
      parameters:
        - $ref: "#/components/parameters/ScenarioID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScenarioUpdate"
      responses:
        "200":
          description: The scenario, as a draft.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scenario"
        default:
          $ref: "#/components/responses/Problem"
  /scenarios/{id}/review:
    post:
      operationId: ReviewScenario
      summary: Mark a scenario draft as reviewed
      description: |
        Needs `sensitiveDataChecked` true: the reviewer says they checked
        the scenario for sensitive data. The file is checked again first.
        `revision` is the revision the reviewer read; if the scenario
        changed since, the answer is 409. API tokens are refused with 403,
        since a person has to review. Only reviewed scenarios can be run or
        downloaded.
      x-sidekick-role: admin
      parameters:
        - $ref: "#/components/parameters/ScenarioID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScenarioReview"
      responses:
        "200":
          description: The reviewed scenario.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scenario"
        default:
          $ref: "#/components/responses/Problem"
  /scenarios/{id}/file:
    get:
      operationId: GetScenarioFile
      summary: Download a reviewed scenario
      description: |
        The scenario file, as an attachment. A scenario that is not reviewed
        answers 409. The download is written to the audit log.
      x-sidekick-role: admin
      parameters:
        - $ref: "#/components/parameters/ScenarioID"
      responses:
        "200":
          description: The scenario file.
          content:
            application/yaml:
              schema:
                type: string
        default:
          $ref: "#/components/responses/Problem"
  /stats/quality:
    get:
      operationId: GetQualityStats
      summary: Verdict accuracy, precision and recall from feedback
      description: |
        The verdict Sidekick gave against the verdict people confirmed, for
        the investigations created in the range, read from the daily
        rollup. Days are UTC dates. Only investigations that people rated
        count: those with a confirmed verdict, and those whose verdict was
        rated wrong without a real verdict, which count as confirmed
        `unknown`; they are wrong in the accuracy and left out of precision
        and recall. The `verdict` filter selects the verdict Sidekick gave.
        The rollup is recounted once a minute, so the newest changes can
        take that long to show.
      x-sidekick-role: viewer
      parameters:
        - $ref: "#/components/parameters/StatsFrom"
        - $ref: "#/components/parameters/StatsTo"
        - $ref: "#/components/parameters/StatsRoute"
        - $ref: "#/components/parameters/StatsService"
        - $ref: "#/components/parameters/StatsModel"
        - $ref: "#/components/parameters/StatsVerdict"
      responses:
        "200":
          description: The quality numbers of the range and of the range before it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QualityStats"
        default:
          $ref: "#/components/responses/Problem"
  /stats/filters:
    get:
      operationId: GetStatsFilters
      summary: The values the dashboard filters offer
      description: |
        The routes, services and models of the investigations of the last
        400 days, for the filter menus of the dashboard.
      x-sidekick-role: viewer
      responses:
        "200":
          description: The values, sorted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatsFilters"
        default:
          $ref: "#/components/responses/Problem"
  /stats/cost:
    get:
      operationId: GetCostStats
      summary: Spend, tokens and cost per investigation
      description: |
        What model calls cost in the range, by day, model and route, with
        the tokens in and out, and what the day's cap leaves; from the
        daily spend table the caps read. Days are UTC dates for the range
        and follow `budgets.daily.timeZone` for the spend and the caps. The
        spend table has no service or verdict, so those filters do not
        apply to it and `ignoredFilters` names the ones that were given.
        The cost per investigation comes from the hourly rollup and takes
        every filter.
      x-sidekick-role: viewer
      parameters:
        - $ref: "#/components/parameters/StatsFrom"
        - $ref: "#/components/parameters/StatsTo"
        - $ref: "#/components/parameters/StatsRoute"
        - $ref: "#/components/parameters/StatsService"
        - $ref: "#/components/parameters/StatsModel"
        - $ref: "#/components/parameters/StatsVerdict"
      responses:
        "200":
          description: The spend of the range and of the range before it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CostStats"
        default:
          $ref: "#/components/responses/Problem"
  /stats/operations:
    get:
      operationId: GetOperationsStats
      summary: Volume, speed, tool calls, false positives, fixes, actions and downtime
      description: |
        What the investigations created in the range did, from the hourly
        rollup, by UTC day or hour. A median is worked out from counts in
        buckets of growing width, so it is about right (within a third),
        not exact. The downtime is the time from the first event of a group
        to the last recovery of its watchers, for groups whose watchers all
        recovered. The actions of an investigation count in its hour:
        `actionsProposed` is every proposal; `actionsApproved` is those a
        person or the policy approved, which are approved, executing,
        succeeded and undone ones and failed ones that have a decision, so
        not rejected or expired ones; `actionsExecuted` is those that ran
        and succeeded, which includes the undone ones.
      x-sidekick-role: viewer
      parameters:
        - $ref: "#/components/parameters/StatsFrom"
        - $ref: "#/components/parameters/StatsTo"
        - $ref: "#/components/parameters/StatsRoute"
        - $ref: "#/components/parameters/StatsService"
        - $ref: "#/components/parameters/StatsModel"
        - $ref: "#/components/parameters/StatsVerdict"
        - name: interval
          in: query
          description: The width of a bucket of the series. An hour needs a range of at most 7 days.
          schema:
            type: string
            enum: [day, hour]
            default: day
      responses:
        "200":
          description: The numbers of the range and of the range before it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationsStats"
        default:
          $ref: "#/components/responses/Problem"
  /bench/runs:
    get:
      operationId: ListBenchRuns
      summary: Benchmark runs, newest first, a page at a time
      description: |
        The runs that `sidekick bench run --db` stored, with their settings
        and headline metrics.
      x-sidekick-role: viewer
      parameters:
        - name: cursor
          in: query
          description: The nextCursor of the page before.
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: A page of runs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BenchRunList"
        default:
          $ref: "#/components/responses/Problem"
  /bench/runs/{id}:
    get:
      operationId: GetBenchRun
      summary: One benchmark run with its results
      description: |
        The run's settings, its metrics with their confidence intervals and
        thresholds, and the result of each run of each scenario. The judge's
        reasons are left out, since they are model output.
      x-sidekick-role: viewer
      parameters:
        - $ref: "#/components/parameters/BenchRunID"
      responses:
        "200":
          description: The run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BenchRun"
        default:
          $ref: "#/components/responses/Problem"
  /bench/compare:
    get:
      operationId: CompareBenchRuns
      summary: Two benchmark runs side by side
      description: |
        Each metric of the two runs with the change from a to b and whether
        their confidence intervals overlap, and each scenario's correct
        runs. A scenario that only one run has shows the other as absent.
      x-sidekick-role: viewer
      parameters:
        - name: a
          in: query
          required: true
          description: The ID of the first run.
          schema:
            type: string
            format: uuid
        - name: b
          in: query
          required: true
          description: The ID of the second run.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The comparison.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BenchComparison"
        default:
          $ref: "#/components/responses/Problem"
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: __Host-sidekick_session
      description: |
        The web UI session, set by /auth/callback. Requests that change
        anything also need the session's CSRF token in the X-CSRF-Token
        header.
    token:
      type: http
      scheme: bearer
      description: An API token an admin created.
  parameters:
    ServiceName:
      name: name
      in: path
      required: true
      description: The name of a service, up to 200 characters.
      schema:
        type: string
    MemoryEntryID:
      name: id
      in: path
      required: true
      description: The ID of the investigation the entry is about.
      schema:
        type: string
        format: uuid
    LessonID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RuleName:
      name: name
      in: path
      required: true
      description: The name of a listener or route.
      schema:
        type: string
    StrategyName:
      name: name
      in: path
      required: true
      description: The name of a strategy.
      schema:
        type: string
    StrategyProposalID:
      name: id
      in: path
      required: true
      description: The ID of a strategy proposal.
      schema:
        type: string
        format: uuid
    InvestigationID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProposalID:
      name: id
      in: path
      required: true
      description: The ID of an action proposal.
      schema:
        type: string
        format: uuid
    ScenarioID:
      name: id
      in: path
      required: true
      description: The id of a scenario.
      schema:
        type: string
        pattern: "^[a-z0-9][a-z0-9._-]{0,99}$"
    StatsFrom:
      name: from
      in: query
      description: The first day of the range, a UTC date. The default is 29 days before `to`.
      schema:
        type: string
        format: date
    StatsTo:
      name: to
      in: query
      description: The last day of the range, a UTC date, included. The default is today. The range is at most 400 days.
      schema:
        type: string
        format: date
    StatsRoute:
      name: route
      in: query
      description: Only investigations of this route.
      schema:
        type: string
    StatsService:
      name: service
      in: query
      description: Only investigations of this service.
      schema:
        type: string
    StatsModel:
      name: model
      in: query
      description: Only investigations whose first model turn used this model.
      schema:
        type: string
    StatsVerdict:
      name: verdict
      in: query
      description: Only investigations with this verdict.
      schema:
        $ref: "#/components/schemas/Verdict"
    BenchRunID:
      name: id
      in: path
      required: true
      description: The ID of a benchmark run.
      schema:
        type: string
        format: uuid
  responses:
    Problem:
      description: An error, as problem details.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Role:
      type: string
      enum: [viewer, responder, approver, admin]
    Me:
      type: object
      required: [kind, id, name, role]
      properties:
        kind:
          type: string
          enum: [user, token]
          description: Whether the caller is a signed-in user or an API token.
        id:
          type: string
          description: The user's or the token's ID.
        name:
          type: string
          description: The user's name, or the token's name.
        email:
          type: string
          description: The user's email, when the identity provider sent a verified one.
        role:
          $ref: "#/components/schemas/Role"
        csrfToken:
          type: string
          description: |
            The session's CSRF token. Requests made with the session that
            change anything send it in the X-CSRF-Token header. Absent for
            an API token.
    EffectiveConfig:
      type: object
      required: [file, runtime]
      properties:
        file:
          type: object
          additionalProperties: true
          description: sidekick.yaml with its defaults, by YAML key. Read-only.
        runtime:
          $ref: "#/components/schemas/RuntimeRules"
    RuntimeRules:
      type: object
      required: [listeners, routes]
      properties:
        listeners:
          type: array
          items:
            $ref: "#/components/schemas/RuntimeRule"
        routes:
          type: array
          items:
            $ref: "#/components/schemas/RuntimeRule"
    RuntimeRule:
      type: object
      required: [name, enabled, version, updatedBy, updatedAt, config]
      properties:
        name:
          type: string
        enabled:
          type: boolean
        version:
          type: integer
        updatedBy:
          type: string
        updatedAt:
          type: string
          format: date-time
        config:
          type: object
          additionalProperties: true
          description: The rule, with the keys a listener or route has in sidekick.yaml.
    RuleLayer:
      type: string
      enum: [file, runtime]
      description: Where the rule is defined. A rule of the file layer is read-only.
    RuleStatus:
      type: string
      enum: [active, shadowed, invalid, disabled]
      description: |
        active: in effect. shadowed: a rule of the config file has the same
        name and is used instead. invalid: it no longer passes the config
        checks. disabled: turned off.
    ListenerSender:
      type: object
      properties:
        kind:
          type: string
          description: human or bot; empty matches both.
        names:
          type: array
          items:
            type: string
        bots:
          type: array
          items:
            type: string
        users:
          type: array
          items:
            type: string
    ListenerMatch:
      type: object
      properties:
        sender:
          $ref: "#/components/schemas/ListenerSender"
        text:
          type: string
          description: A regular expression over the message text.
    ListenerSpec:
      type: object
      required: [channel]
      description: The parts of a listener that a person sets, with the keys they have in sidekick.yaml.
      properties:
        source:
          type: string
          description: The chat app, slack or teams. Empty means slack.
        channel:
          type: string
          description: A channel name such as "#alerts" or a channel ID.
        match:
          $ref: "#/components/schemas/ListenerMatch"
        extract:
          type: array
          items:
            type: string
          description: Regular expressions with named groups that set the alert's fields.
        recovery:
          type: string
          description: A regular expression. A message it matches is a recovery.
    NewListener:
      allOf:
        - type: object
          required: [name]
          properties:
            name:
              type: string
        - $ref: "#/components/schemas/ListenerSpec"
    ListenerUpdate:
      allOf:
        - $ref: "#/components/schemas/ListenerSpec"
        - type: object
          required: [enabled, version]
          properties:
            enabled:
              type: boolean
            version:
              type: integer
              description: The version of the listener that was read.
    Listener:
      allOf:
        - $ref: "#/components/schemas/ListenerSpec"
        - type: object
          required: [name, layer, status, readOnly, enabled, trusted]
          properties:
            name:
              type: string
            layer:
              $ref: "#/components/schemas/RuleLayer"
            status:
              $ref: "#/components/schemas/RuleStatus"
            statusReason:
              type: string
              description: Why the rule is not active.
            readOnly:
              type: boolean
              description: True for a listener of the config file.
            enabled:
              type: boolean
            trusted:
              type: boolean
              description: Whether its senders are trusted. Runtime listeners are never trusted.
            version:
              type: integer
              description: The version of a runtime listener; it grows with every change.
            updatedBy:
              type: string
            updatedAt:
              type: string
              format: date-time
    ListenerList:
      type: object
      required: [listeners]
      properties:
        listeners:
          type: array
          items:
            $ref: "#/components/schemas/Listener"
    RouteMatch:
      type: object
      properties:
        intake:
          type: array
          items:
            type: string
          description: Names of webhook endpoints and listeners.
        labels:
          type: object
          additionalProperties:
            type: string
        service:
          type: string
          description: A glob.
        severity:
          type: array
          items:
            type: string
          description: unknown, info, warning or critical.
        text:
          type: string
          description: A regular expression over the event text.
    RouteBudgets:
      type: object
      description: Limits of one investigation. Zero or empty uses the global value.
      properties:
        maxTokens:
          type: integer
        maxToolCalls:
          type: integer
        maxWallTime:
          type: string
          description: A duration such as 5m.
        maxCostUSD:
          type: number
          format: double
    RouteGrouping:
      type: object
      properties:
        window:
          type: string
          description: A duration such as 30m.
        fingerprintLabels:
          type: array
          items:
            type: string
        relatedWindow:
          type: string
          description: A duration such as 15m. Empty turns it off.
    RouteMode:
      type: string
      enum: [read-only, approved, read-write]
      description: |
        The action mode. In read-only mode, the default, the model cannot
        propose changes. In approved mode it may propose the route's
        actions, and a person approves each one. In read-write mode a
        proposal of an event from a trusted sender runs without a person.
        A route in approved or read-write mode lists at least one action.
        A read-write route may select only trusted intakes and listeners,
        unless `allowUntrustedWrite` is set. An investigation of an event
        that is not trusted runs in approved mode instead. Only the config
        file and an admin here can set read-write; Slack commands cannot.
    RouteSpec:
      type: object
      description: The parts of a route that a person sets, with the keys they have in sidekick.yaml.
      properties:
        priority:
          type: integer
          description: Lower is tried first. Defaults to 100.
        match:
          $ref: "#/components/schemas/RouteMatch"
        strategy:
          type: string
        sources:
          type: array
          items:
            type: string
        outputs:
          type: array
          items:
            type: string
        mode:
          $ref: "#/components/schemas/RouteMode"
        allowUntrustedWrite:
          type: boolean
          description: |
            Lets a read-write route select intakes and listeners that are
            not trusted, and keeps read-write mode for their events. Every
            start logs a warning for it, and the change is in the audit
            log. It has no effect in other modes.
        actions:
          type: array
          description: The actions the route may propose, by their names in the config file's actions section. Empty in read-only mode.
          items:
            type: string
        details:
          type: object
          description: |
            Fixed facts about the route, such as the owning team or the
            environment, that the investigation prompt shows to the model
            as trusted text. They must hold no secrets and no text copied
            from alerts or other outside sources. At most 20 keys; a key is
            1 to 64 letters, digits, `-`, `_` or `.`; a value is one line of
            at most 500 characters with no control characters, and is not
            empty. A body without `details` removes them.
          additionalProperties:
            type: string
        budgets:
          $ref: "#/components/schemas/RouteBudgets"
        grouping:
          $ref: "#/components/schemas/RouteGrouping"
    NewRoute:
      allOf:
        - type: object
          required: [name]
          properties:
            name:
              type: string
        - $ref: "#/components/schemas/RouteSpec"
    RouteUpdate:
      allOf:
        - $ref: "#/components/schemas/RouteSpec"
        - type: object
          required: [enabled, version]
          properties:
            enabled:
              type: boolean
            version:
              type: integer
              description: The version of the route that was read.
    Route:
      allOf:
        - $ref: "#/components/schemas/RouteSpec"
        - type: object
          required: [name, layer, status, readOnly, enabled]
          properties:
            name:
              type: string
            layer:
              $ref: "#/components/schemas/RuleLayer"
            status:
              $ref: "#/components/schemas/RuleStatus"
            statusReason:
              type: string
              description: Why the rule is not active.
            readOnly:
              type: boolean
              description: True for a route of the config file.
            enabled:
              type: boolean
            position:
              type: integer
              description: The place of a route in effect in the order routes are tried, from 1.
            version:
              type: integer
              description: The version of a runtime route; it grows with every change.
            updatedBy:
              type: string
            updatedAt:
              type: string
              format: date-time
    RouteList:
      type: object
      required: [routes]
      properties:
        routes:
          type: array
          items:
            $ref: "#/components/schemas/Route"
    StrategyLayer:
      type: string
      description: |
        Where the strategy is defined: built-in, runtime or file. A
        built-in strategy and a strategy of the file layer are read-only.
        This is not an enum, because the names of its values would clash
        with those of RuleLayer in the generated Go code.
    StrategyStatus:
      type: string
      description: |
        active: in effect. shadowed: a strategy file has the same name and
        is used instead. invalid: the stored version no longer passes the
        strategy checks. Not an enum, for the reason StrategyLayer gives.
    Strategy:
      type: object
      required: [name, layer, status, readOnly]
      properties:
        name:
          type: string
        description:
          type: string
        layer:
          $ref: "#/components/schemas/StrategyLayer"
        status:
          $ref: "#/components/schemas/StrategyStatus"
        statusReason:
          type: string
          description: Why the strategy is not active.
        readOnly:
          type: boolean
          description: True for a built-in strategy and a strategy file.
        version:
          type: string
          description: |
            The version investigations record: a content hash for a built-in
            strategy and a strategy file, and runtime:N for version N of a
            runtime strategy.
        runtimeVersion:
          type: integer
          description: The current version of the runtime strategy of this name, when one is stored.
        overrides:
          type: array
          description: The layers whose strategy of this name this one replaces.
          items:
            $ref: "#/components/schemas/StrategyLayer"
        updatedBy:
          type: string
          description: The name of who saved the current version of a runtime strategy.
        updatedAt:
          type: string
          format: date-time
    StrategyList:
      type: object
      required: [strategies]
      properties:
