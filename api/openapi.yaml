      properties:
        summary:
          type: string
        links:
          type: array
          items:
            $ref: "#/components/schemas/ActionLink"
    Proposal:
      type: object
      description: |
        An action the model proposed. `params`, `paramsText` and `reason`
        are text the model wrote, so a screen shows them as plain text.
        What `params` holds never changes, and it is what runs.
      required: [id, investigationId, route, action, params, paramsText, reason, mode, status, proposedAt, expiresAt, undoable]
      properties:
        id:
          type: string
          format: uuid
        investigationId:
          type: string
          format: uuid
        alertTitle:
          type: string
          description: The title of the alert of the investigation. Set in the review queue only.
        route:
          type: string
        action:
          type: string
          description: The name of the action in the config file.
        params:
          type: object
          additionalProperties: true
          description: The parameters, as the action runs with them.
        paramsText:
          type: string
          description: The parameters as the approver reads them. Characters that could hide something are written as \u escapes, and nothing is cut.
        reason:
          type: string
        target:
          type: string
          description: What an action that changes a definition in place changes, such as datadog:monitor/123. Absent for any other action.
        changes:
          type: array
          description: |
            The difference between the definition before and after the
            change, field by field, sorted by path. Absent for an action
            that changes no definition in place. A change with an empty
            `path` and no `after` removes the whole definition.
          items:
            $ref: "#/components/schemas/ProposalChange"
        files:
          type: array
          description: |
            The files of a proposal that opens a pull request or a merge
            request, sorted by path, read from the snapshot with no call to
            the host. Absent for any other proposal and for an undo.
          items:
            $ref: "#/components/schemas/ProposalFile"
        undoable:
          type: boolean
          description: Whether the proposal can be undone now. True only for a succeeded proposal whose action can undo it, that is not an undo itself.
        undoOf:
          type: string
          format: uuid
          description: Set on a proposal that restores the proposal with this ID.
        mode:
          type: string
        status:
          $ref: "#/components/schemas/ProposalStatus"
        proposedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        decidedByName:
          type: string
          description: The name of the user or API token that approved or rejected it.
        decidedBySlackUser:
          type: string
          description: The Slack user ID of someone who decided in Slack.
        approvedByPolicy:
          type: boolean
          description: |
            True when nobody decided the proposal: its investigation ran in
            read-write mode, so the route's policy approved it as it was
            stored, and `decidedAt` is the time of that approval.
        decidedAt:
          type: string
          format: date-time
        result:
          $ref: "#/components/schemas/ActionResult"
        error:
          type: string
          description: Why it failed. While it is tried again, the last failed attempt.
    ProposalChange:
      type: object
      description: |
        One field that differs. `before` and `after` are the JSON values as
        text, like `paramsText`: characters that could hide something are
        written as \u escapes, and nothing is cut. They come from the
        monitoring tool and from the model, so show them as plain text. A
        missing `before` means the field did not exist; a missing `after`
        means it is removed.
      required: [path]
      properties:
        path:
          type: string
          description: The field, such as options.thresholds.critical or rules[0].expr.
        before:
          type: string
        after:
          type: string
    ProposalFile:
      type: object
      description: |
        One file of a pull request or merge request. `path` comes from the
        model, so a screen shows it as plain text.
      required: [path, status, linesAdded, linesRemoved, diffAvailable]
      properties:
        path:
          type: string
          description: The path from the root of the repository.
        diffAvailable:
          type: boolean
          description: |
            Whether the line diff of the file can be asked for: the action
            that made the proposal is still in the config and can read files
            from its host.
        status:
          type: string
          enum: [added, changed, deleted]
        linesAdded:
          type: integer
          minimum: 0
        linesRemoved:
          type: integer
          minimum: 0
    ProposalFileDiff:
      type: object
      description: The line diff of one file of a proposal. The lines are plain text.
      required: [path, status, lines, truncated]
      properties:
        path:
          type: string
        status:
          type: string
          enum: [added, changed, deleted]
        lines:
          type: array
          items:
            $ref: "#/components/schemas/ProposalDiffLine"
        truncated:
          type: boolean
          description: True when more lines follow than the ones returned. Ask again with `full` true to get them.
        finalNewline:
          type: string
          enum: [added, removed]
          description: Set when the change adds a newline at the end of the file, or removes the one it had.
    ProposalDiffLine:
      type: object
      required: [kind, text]
      properties:
        kind:
          type: string
          enum: [context, added, removed]
        oldLine:
          type: integer
          minimum: 1
          description: The number of the line in the file on the base branch. Absent for an added line.
        newLine:
          type: integer
          minimum: 1
          description: The number of the line in the new file. Absent for a removed line.
        text:
          type: string
          description: The line without its line break, with characters that could hide something written as \u escapes.
    UndoProposalRequest:
      type: object
      properties:
        force:
          type: boolean
          default: false
          description: Restore even though someone changed the fields since. Send it after a 409 with code conflict showed the difference.
    ProposalList:
      type: object
      required: [proposals]
      properties:
        proposals:
          type: array
          items:
            $ref: "#/components/schemas/Proposal"
        nextCursor:
          type: string
          description: Pass it as cursor to get the next page. Absent on the last page.
    RejectProposalRequest:
      type: object
      properties:
        note:
          type: string
          maxLength: 500
          description: Why it is rejected. Redacted, and kept in the audit log.
    Job:
