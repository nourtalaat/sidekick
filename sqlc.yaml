version: "2"
sql:
  - engine: postgresql
    # sqlc reads the goose migrations as the schema and skips the Down parts.
    # The vector migrations are a second set, run only with vector memory.
    schema:
      - internal/store/migrations
      - internal/store/migrations/vector
    queries: internal/store/queries
    gen:
      go:
        package: db
        out: internal/store/db
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        overrides:
          - db_type: jsonb
            go_type:
              import: encoding/json
              type: RawMessage
          - db_type: uuid
            go_type:
              import: github.com/google/uuid
              type: UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true
          # pgx sends a Go string as text to the vector type, which pgvector
          # reads as "[1,2,3]", so no pgvector Go module is needed.
          - db_type: vector
            go_type: string
          - db_type: timestamptz
            go_type:
              import: time
              type: Time
          - db_type: timestamptz
            nullable: true
            go_type:
              import: time
              type: Time
              pointer: true
